    'scrutiny-picker': '2026-05-23',
    'school-switcher': '2026-05-23',
  };

  /* ── NAVIGATE ───────────────────────────────────────── */
  function navigate(pageId) {
    if (REDIRECTS[pageId]) { pageId = REDIRECTS[pageId]; location.hash = pageId; }
    const page = getPageContent(pageId);
    if (!page) {
      // Unknown hash — render an in-SPA "page not found" instead of silently
      // bouncing to welcome. Keeps the URL intact so the reader sees what they
      // typed and gets an obvious next step.
      const pc = document.getElementById('pageContent');
      if (pc) {
        pc.style.animation = 'none'; void pc.offsetHeight; pc.style.animation = '';
        const safe = escapeHtml(pageId || '');
        pc.innerHTML = '<h1>Page not found</h1>'
          + '<p>We couldn’t find <code>#' + safe + '</code>. The page may have moved or never existed.</p>'
          + '<div class="hint hint-info"><div class="hint-icon">' + IC.info + '</div><div>Try the search bar above, or jump to <a href="#welcome" onclick="navigate(\'welcome\');return false">the help center home</a>. Still stuck? <a href="#contact" onclick="navigate(\'contact\');return false">Contact support</a>.</div></div>';
        document.title = 'Page not found · Kaynos Docs';
      }
      return;
    }

    if (pageId === 'release-notes') markWhatsNewSeen();

    const pc = document.getElementById('pageContent');
    // Retrigger animation
    pc.style.animation = 'none';
    void pc.offsetHeight;
    pc.style.animation = '';
    // Safe: page.content comes from hardcoded PAGES constant (static HTML strings)
    pc.innerHTML = page.content;

    // Wrap tables
    pc.querySelectorAll('table').forEach(t => {
      if (!t.closest('.table-wrap')) {
        const w = document.createElement('div');
        w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      }
    });

    // Wrap pre blocks with copy button
    pc.querySelectorAll('pre').forEach(pre => {
      if (!pre.closest('.code-block-wrap')) {
        const w = document.createElement('div');
        w.className = 'code-block-wrap';
        pre.parentNode.insertBefore(w, pre);
        w.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => copyCode(btn, pre.textContent);
        w.appendChild(btn);
      }
    });

    // Add copy buttons to code blocks
    pc.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.copy-code-btn')) return;
      const btn = document.createElement('button');
      btn.className = 'copy-code-btn';
      btn.textContent = 'Copy';
      btn.onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(pre.textContent.replace('Copy', '').trim()).then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, TIMINGS.COPY_FEEDBACK);
        }).catch(() => showToast('Copy failed — try selecting manually'));
      };
      pre.style.position = 'relative';
      pre.appendChild(btn);
    });

    // Sidebar active
    document.querySelectorAll('.sidebar-link').forEach(l => {
      const isActive = l.dataset.page === pageId;
      l.classList.toggle('active', isActive);
      if (isActive) l.setAttribute('aria-current', 'page');
      else l.removeAttribute('aria-current');
    });

    // Breadcrumb
    if (page.section) {
      const sectionGroup = NAV.find(g => g.section === page.section);
      const sectionFirst = sectionGroup ? sectionGroup.pages[0] : 'welcome';
      const bc = document.createElement('div');
      bc.className = 'breadcrumb';
      // Safe: sectionFirst, page.section, page.title all from hardcoded PAGES/NAV constants
      bc.innerHTML = `<a href="#welcome" onclick="navigate('welcome');return false">Help Center</a><span class="breadcrumb-sep">›</span><a href="#${sectionFirst}" onclick="navigate('${sectionFirst}');return false">${page.section}</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">${page.title}</span>`;
      pc.prepend(bc);
    }

    // Footer nav
    renderFooterNav(pageId);

    // TOC
    renderToc(pc);

    // Anchor links on headings
    pc.querySelectorAll('h2[id], h3[id]').forEach(h => {
      const a = document.createElement('a');
      a.className = 'heading-anchor';
      a.href = '#' + pageId + ':' + h.id;
      a.textContent = '#';
      a.title = 'Copy link to section';
      a.onclick = (e) => {
        e.preventDefault();
        const url = location.origin + location.pathname + '#' + pageId + ':' + h.id;
        navigator.clipboard.writeText(url).then(() => showToast('Link copied')).catch(() => showToast('Copy failed — try selecting manually'));
      };
      h.appendChild(a);
    });

    if (!window._isPopstate) window.scrollTo({ top: 0, behavior: 'instant' });
    if (!window._isPopstate) history.pushState({ page: pageId }, '', '#' + pageId);
    document.title = pageId === 'welcome' ? 'Kaynos Docs' : `${page.title} — Kaynos Docs`;

    // Move focus to the new content so keyboard/SR users land at the article
    // start instead of resuming Tab order from the now-replaced previous page.
    // Skip on initial page load so the skip-link remains the first tab stop
    // (WCAG 2.4.1 — bypass blocks); only move focus when the user has
    // already been interacting with the page chrome.
    if (document.activeElement && document.activeElement !== document.body) {
      pc.focus({ preventScroll: true });
    }

    // Announce page change to screen readers
    let liveRegion = document.getElementById('sr-announce');
    if (!liveRegion) { liveRegion = document.createElement('div'); liveRegion.id = 'sr-announce'; liveRegion.setAttribute('aria-live', 'polite'); liveRegion.setAttribute('aria-atomic', 'true'); liveRegion.className = 'sr-only'; document.body.appendChild(liveRegion); }
    liveRegion.textContent = page.title;

    // Dynamic meta description — prefer curated, fall back to auto-generated
    const descEl = document.querySelector('meta[name="description"]');
    const tmp = document.createElement('div');
    tmp.innerHTML = page.content;
    const plainText = (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    if (descEl) {
      const curated = PAGE_DESCRIPTIONS[pageId];
      if (curated) {
        descEl.setAttribute('content', curated);
      } else {
        // fallback to auto-generated
        descEl.setAttribute('content', plainText.slice(0, 160) + (plainText.length > 160 ? '…' : ''));
      }
    }

    // Update OG / Twitter tags
    const ogTitle = document.querySelector('meta[property="og:title"]');
    const ogDesc = document.querySelector('meta[property="og:description"]');
    const ogUrl = document.querySelector('meta[property="og:url"]');
    const twTitle = document.querySelector('meta[name="twitter:title"]');
    const twDesc = document.querySelector('meta[name="twitter:description"]');
    const twUrl = document.querySelector('meta[name="twitter:url"]');
    const pageTitle = pageId === 'welcome' ? 'Kaynos Docs' : page.title + ' — Kaynos Docs';
    const pageDesc = plainText.slice(0, 160);
    const pageUrl = pageId === 'welcome' ? 'https://docs.kaynos.net/' : 'https://docs.kaynos.net/#' + pageId;
    if (ogTitle) ogTitle.setAttribute('content', pageTitle);
    if (ogDesc) ogDesc.setAttribute('content', pageDesc);
    if (ogUrl) ogUrl.setAttribute('content', pageUrl);
    if (twTitle) twTitle.setAttribute('content', pageTitle);
    if (twDesc) twDesc.setAttribute('content', pageDesc);
    if (twUrl) twUrl.setAttribute('content', pageUrl);

    // FAQ structured data
    let schemaEl = document.getElementById('dynamic-schema');
    if (pageId === 'faq') {
      const faqItems = [];
      const h3s = pc.querySelectorAll('h3');
      h3s.forEach(h3 => {
        const answer = [];
        let sib = h3.nextElementSibling;
        while (sib && sib.tagName !== 'H3' && sib.tagName !== 'H2' && sib.tagName !== 'HR') {
          answer.push(sib.textContent);
          sib = sib.nextElementSibling;
        }
        if (answer.length) faqItems.push({ '@type': 'Question', name: h3.textContent, acceptedAnswer: { '@type': 'Answer', text: answer.join(' ') } });
      });
      if (faqItems.length) {
        if (!schemaEl) { schemaEl = document.createElement('script'); schemaEl.type = 'application/ld+json'; schemaEl.id = 'dynamic-schema'; document.head.appendChild(schemaEl); }
        schemaEl.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: faqItems });
      }
    } else if (schemaEl) {
      schemaEl.remove();
    }

    // BreadcrumbList schema
    let bcSchema = document.getElementById('breadcrumb-schema');
    if (pageId !== 'welcome' && page.section) {
      const items = [
        { '@type': 'ListItem', position: 1, name: 'Help Center', item: 'https://docs.kaynos.net/' },
        { '@type': 'ListItem', position: 2, name: page.section, item: 'https://docs.kaynos.net/' },
        { '@type': 'ListItem', position: 3, name: page.title, item: 'https://docs.kaynos.net/#' + pageId }
      ];
      if (!bcSchema) { bcSchema = document.createElement('script'); bcSchema.type = 'application/ld+json'; bcSchema.id = 'breadcrumb-schema'; document.head.appendChild(bcSchema); }
      bcSchema.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: items });
    } else if (bcSchema) { bcSchema.remove(); }

    // Dynamic canonical URL
    let canonEl = document.querySelector('link[rel="canonical"]');
    if (!canonEl) {
      canonEl = document.createElement('link');
      canonEl.setAttribute('rel', 'canonical');
      document.head.appendChild(canonEl);
    }
    canonEl.setAttribute('href', pageId === 'welcome'
      ? 'https://docs.kaynos.net/'
      : 'https://docs.kaynos.net/#' + pageId);

    closeSidebar();
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').classList.remove('active');
    document.getElementById('searchInput').setAttribute('aria-expanded', 'false');

    // Scroll active link into view
    const active = document.querySelector('.sidebar-link.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: smoothBehavior() });
  }

  /* ── FOOTER NAV ─────────────────────────────────────── */
  function renderFooterNav(pageId) {
    const idx = visiblePageKeys.indexOf(pageId);
    const fn = document.getElementById('footerNav');
    fn.innerHTML = '';
    if (idx === -1) return;
    if (idx > 0) {
      const id = visiblePageKeys[idx - 1];
      const a = document.createElement('a');
      a.className = 'footer-nav-btn prev';
      a.href = '#' + id;
      a.onclick = (e) => { e.preventDefault(); navigate(id); };
      a.innerHTML = `<span class="fn-label">← Previous</span><span class="fn-title">${PAGES[id].title}</span>`;
      fn.appendChild(a);
    }
    if (idx < visiblePageKeys.length - 1) {
      const id = visiblePageKeys[idx + 1];
      const a = document.createElement('a');
      a.className = 'footer-nav-btn next';
      a.href = '#' + id;
      a.onclick = (e) => { e.preventDefault(); navigate(id); };
      a.innerHTML = `<span class="fn-label">Next →</span><span class="fn-title">${PAGES[id].title}</span>`;
      fn.appendChild(a);
    }
  }

  /* ── INLINE "ON THIS PAGE" CALLOUT ──────────────────── */
  /* Renders only when the page has at least PAGE_TOC_MIN_H2 H2 sections.    */
  /* Up to PAGE_TOC_DENSE_AT items: horizontal comma-flow layout.            */
  /* Above PAGE_TOC_DENSE_AT: vertical 2-column grid wrapped in <details>    */
  /* so the reader can collapse the list — at 20 items the horizontal flow   */
  /* fills 200+ vertical pixels and stops being scannable.                   */
  const PAGE_TOC_MIN_H2 = 6;
  const PAGE_TOC_DENSE_AT = 10;
  function renderToc(container) {
    // Drop any previously rendered inline TOC before rendering the new one
    const old = container.querySelector('.page-toc');
    if (old) old.remove();

    const h2s = Array.from(container.querySelectorAll('h2'));
    if (h2s.length < PAGE_TOC_MIN_H2) return;

    // Anchor each h2 with a stable sequential id
    const items = h2s.map((h, i) => {
      const id = 'h-' + i;
      h.id = id;
      const label = (h.childNodes[0]?.textContent || h.textContent).trim();
      return { id, label };
    });

    let nav;
    if (items.length <= PAGE_TOC_DENSE_AT) {
      // Horizontal flow with dot separators
      nav = document.createElement('nav');
      nav.className = 'page-toc';
      nav.setAttribute('aria-label', 'On this page');
      const parts = ['<span class="page-toc-label">On this page</span>'];
      items.forEach((it, i) => {
        if (i > 0) parts.push('<span class="page-toc-sep" aria-hidden="true">·</span>');
        parts.push(`<a href="#${it.id}" onclick="tocJump(event,'${it.id}')">${escapeHtml(it.label)}</a>`);
      });
      // Safe: labels are escaped; ids are sequential and not user-controlled
      nav.innerHTML = parts.join(' ');
    } else {
      // Dense mode: collapsible vertical list
      nav = document.createElement('details');
      nav.className = 'page-toc';
      nav.setAttribute('aria-label', 'On this page');
      nav.open = true;
      const summary = `<summary>On this page<span class="page-toc-count">${items.length} sections</span></summary>`;
      const links = items.map(it =>
        `<a href="#${it.id}" onclick="tocJump(event,'${it.id}')">${escapeHtml(it.label)}</a>`
      ).join('');
      // Safe: labels are escaped; ids are sequential and not user-controlled
      nav.innerHTML = summary + `<div class="page-toc-list">${links}</div>`;
    }

    // Insert after the h1 (or at top if no h1)
    const h1 = container.querySelector('h1');
    if (h1 && h1.parentNode === container) h1.insertAdjacentElement('afterend', nav);
    else container.prepend(nav);
  }

  function tocJump(e, id) {
    e.preventDefault();
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: smoothBehavior(), block: 'start' });
  }

  /* ── COPY ───────────────────────────────────────────── */
  function copyCode(btn, text) {
    navigator.clipboard.writeText(text.trim()).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      showToast('Copied to clipboard');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, TIMINGS.TOAST);
    }).catch(() => {
      showToast('Copy failed — try selecting manually');
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toast);
    window._toast = setTimeout(() => t.classList.remove('show'), TIMINGS.TOAST);
  }

  /* ── SEARCH ─────────────────────────────────────────── */
  function debounce(fn, ms) {
    let t;
    return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  }
  const debouncedSearch = debounce(handleSearch, TIMINGS.DEBOUNCE_SEARCH);
  let srIdx = -1;

  function fuzzyMatch(text, query) {
    // Simple word-based fuzzy: all query words must appear in text
    const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 1);
    const lower = text.toLowerCase();
    return words.every(w => lower.includes(w));
  }

  // Search index — built lazily so we don't strip ~99 KB of HTML on every page
  // load when most visitors never search. Built on first search-input focus or
  // during browser idle, whichever comes first.
  const SEARCH_INDEX = {};
  let _searchIndexBuilt = false;
  function buildSearchIndex() {
    if (_searchIndexBuilt) return;
    for (const [id, page] of Object.entries(PAGES)) {
      if (id === 'welcome') continue;
      const text = page.content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
      SEARCH_INDEX[id] = { title: page.title, titleLower: page.title.toLowerCase(), text, section: page.section || '' };
    }
    _searchIndexBuilt = true;
  }
  if (typeof requestIdleCallback === 'function') requestIdleCallback(buildSearchIndex, { timeout: 2000 });
  else setTimeout(buildSearchIndex, 1000);

  // Synonyms: when a user types one term, also consider the others as matches.
  // Bidirectional — typing any term in a group surfaces pages that mention any
  // other term in the same group. Each entry is a single equivalence class.
  const SEARCH_SYNONYM_GROUPS = [
    ['student', 'students', 'member', 'members', 'learner', 'user'],
    ['coach', 'coaches', 'instructor', 'instructors', 'teacher'],
    ['admin', 'admins', 'owner', 'manager'],
    ['video', 'videos', 'clip', 'clips', 'recording', 'footage'],
    ['session', 'sessions', 'lesson'],
    ['class', 'classes', 'group session', 'workshop'],
    ['note', 'notes', 'comment', 'comments', 'feedback', 'annotation'],
    ['upload', 'uploads', 'uploading', 'add video', 'send'],
    ['login', 'log in', 'sign in', 'signin', "can't login", 'locked out', 'lockout', 'access denied'],
    ['signup', 'sign up', 'register', 'create account', 'subscribe'],
    ['cancel subscription', 'pause subscription', 'cancel trial', 'end subscription', 'unsubscribe'],
    ['password', 'passcode', 'pin'],
    ['payment', 'billing', 'invoice', 'invoices', 'charge', 'subscription', 'receipt', 'receipts', 'refund', 'refunds', 'card', 'pricing', 'cost', 'price', 'tax', 'vat'],
    ['delete', 'remove', 'cancel'],
    ['notification', 'notifications', 'alert', 'email'],
    ['mobile', 'phone', 'iphone', 'android', 'tablet'],
    ['error', 'errors', 'bug', 'broken', 'not working', 'crash', 'failure'],
    ['camera', 'cameras', 'tripod', 'microphone', 'mic', 'audio', 'lighting', 'hardware', 'equipment', 'recording gear'],
    ['gdpr', 'ccpa', 'cpra', 'privacy rights', 'data rights', 'data request', 'data export', 'dpa', 'data processing agreement'],
    ['export', 'exports', 'backup', 'download data', 'data export'],
    ['api', 'integration', 'integrations', 'webhook', 'webhooks', 'sdk'],
  ];
  // Build lookup: term -> Set of all terms in the same group(s).
  const SYNONYM_MAP = (() => {
    const m = new Map();
    for (const group of SEARCH_SYNONYM_GROUPS) {
      const set = new Set(group);
      for (const term of group) {
        const existing = m.get(term);
        if (existing) for (const t of set) existing.add(t);
        else m.set(term, new Set(set));
      }
    }
    return m;
  })();
  function expandWithSynonyms(query) {
    const trimmed = query.trim().toLowerCase();
    if (!trimmed) return [trimmed];
    // Whole-query lookup first (handles multi-word phrases like "sign in").
    const whole = SYNONYM_MAP.get(trimmed);
    if (whole) return Array.from(whole);
    // Otherwise, single-token expansion: any matched token broadens the search.
    const tokens = trimmed.split(/\s+/);
    const expanded = new Set([trimmed]);
    for (const t of tokens) {
      const set = SYNONYM_MAP.get(t);
      if (set) for (const syn of set) expanded.add(syn);
    }
    return Array.from(expanded);
  }

  // Section filter for search results — set by the chip row, cleared on each fresh search.
  let searchSectionFilter = '';

  function handleSearch(q, opts = {}) {
    const sr = document.getElementById('searchResults');
    srIdx = -1;
    if (!q || q.length < 2) { sr.classList.remove('active'); sr.innerHTML = ''; document.getElementById('searchInput').setAttribute('aria-expanded', 'false'); searchSectionFilter = ''; return; }
    if (!opts.preserveFilter) searchSectionFilter = '';
    buildSearchIndex();
    const lower = q.toLowerCase();
    const synonyms = expandWithSynonyms(q);
    const results = [];
    for (const [id, page] of Object.entries(PAGES)) {
      const idx = SEARCH_INDEX[id];
      if (!idx) continue;
      const text = idx.text;
      const textLower = text;
      // Match if ANY synonym appears in title/section/body. Score is highest for
      // an exact-query hit; synonym-only hits still count but score lower.
      const titleMatch = synonyms.some((s) => idx.titleLower.includes(s));
      const sectionLower = (page.section || '').toLowerCase();
      const sectionMatch = !!sectionLower && synonyms.some((s) => sectionLower.includes(s));
      let exactIdx = -1;
      for (const s of synonyms) {
        const i = textLower.indexOf(s);
        if (i !== -1) { exactIdx = i; break; }
      }
      const fuzzy = !titleMatch && exactIdx === -1 && fuzzyMatch(page.title + ' ' + text, q);
      if (titleMatch || sectionMatch || exactIdx !== -1 || fuzzy) {
        let snippet = '';
        const snipIdx = exactIdx !== -1 ? exactIdx : textLower.indexOf(lower.split(/\s+/)[0]);
        if (snipIdx !== -1) {
          const s = Math.max(0, snipIdx - LIMITS.SNIPPET_BEFORE), e = Math.min(textLower.length, snipIdx + q.length + LIMITS.SNIPPET_AFTER);
          const raw = (s > 0 ? '…' : '') + text.slice(s, e) + (e < textLower.length ? '…' : '');
          // Highlight the literal query first, then synonyms (so visual match still tracks what the user typed).
          const escapedRaw = escapeHtml(raw);
          const allTerms = [q, ...synonyms.filter((x) => x !== lower)].filter(Boolean);
          const pattern = allTerms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
          snippet = pattern ? escapedRaw.replace(new RegExp(pattern, 'gi'), (m) => `<mark>${escapeHtml(m)}</mark>`) : escapedRaw;
        }
        // Ranking: title >> section name > body exact >> body fuzzy.
        // Exact-query bonus when the user's literal text appears in title/body.
        const literalTitle = idx.titleLower.includes(lower);
        const literalBody = textLower.indexOf(lower);
        const score = (titleMatch ? 10 : 0) + (literalTitle ? 4 : 0) + (sectionMatch ? 4 : 0) + (exactIdx !== -1 ? 3 : 0) + (literalBody !== -1 ? 2 : 0) + (fuzzy ? 1 : 0);
        results.push({ id, title: page.title, section: page.section, snippet, score });
      }
    }
    results.sort((a, b) => b.score - a.score);

    // Apply section filter if set (chip row click).
    const sectionsPresent = Array.from(new Set(results.map((r) => r.section).filter(Boolean)));
    const filtered = searchSectionFilter ? results.filter((r) => r.section === searchSectionFilter) : results;

    // Empty-state "did you mean": suggest pages whose title shares meaningful
    // overlap with the query. Cheap character-Jaccard so we catch typos and
    // partial matches that exact/fuzzy missed.
    let didYouMean = '';
    if (!results.length) {
      const qSet = new Set(lower.replace(/\s+/g, '').split(''));
      const suggestions = [];
      for (const [id, page] of Object.entries(PAGES)) {
        if (id === 'welcome') continue;
        const tSet = new Set(page.title.toLowerCase().replace(/\s+/g, '').split(''));
        if (!qSet.size || !tSet.size) continue;
        let inter = 0;
        qSet.forEach(c => { if (tSet.has(c)) inter++; });
        const score = inter / Math.max(qSet.size, tSet.size);
        if (score >= 0.5) suggestions.push({ id, title: page.title, score });
      }
      suggestions.sort((a, b) => b.score - a.score);
      const top = suggestions.slice(0, 3);
      if (top.length) {
        didYouMean = '<div class="search-empty">No exact matches. Did you mean:</div>'
          + top.map((r, i) =>
              `<div class="search-result" role="option" id="sr-${i}" data-page="${r.id}" onclick="addSearchHistory(document.getElementById('searchInput').value.trim());navigate('${r.id}')">
                <div class="sr-title">${escapeHtml(r.title)}</div>
              </div>`
            ).join('');
      }
    }

    // Section-filter chip row — only shown when there are 2+ sections to choose from
    let chipRow = '';
    if (sectionsPresent.length > 1) {
      const chip = (label, value) => {
        const active = (value === searchSectionFilter) || (!value && !searchSectionFilter);
        return `<button type="button" class="search-chip${active ? ' active' : ''}" onclick="filterSearchBySection('${escapeHtml(value)}')">${escapeHtml(label)}</button>`;
      };
      chipRow = '<div class="search-chips">' + chip('All', '') + sectionsPresent.map((s) => chip(s, s)).join('') + '</div>';
    }

    // Safe: titles/sections escaped via escapeHtml(); snippet uses escapeHtml + <mark> wrapping of query match
    const renderResults = filtered.length === 0
      ? (didYouMean || '<div class="search-empty">No matches. Try fewer or different keywords.</div>')
      : filtered.slice(0, LIMITS.SEARCH_RESULTS).map((r, i) =>
          `<div class="search-result" role="option" id="sr-${i}" data-page="${r.id}" onclick="addSearchHistory(document.getElementById('searchInput').value.trim());navigate('${r.id}')">
            <div class="sr-title">${escapeHtml(r.title)}</div>
            ${r.section ? `<div class="sr-section">${escapeHtml(r.section)}</div>` : ''}
            ${r.snippet ? `<div class="sr-snippet">${r.snippet}</div>` : ''}
          </div>`

  document.getElementById('searchInput').addEventListener('keydown', e => {
    const sr = document.getElementById('searchResults');
    const items = sr.querySelectorAll('.search-result');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      // Wrap-around: past the last result jumps back to the first.
      srIdx = items.length ? (srIdx + 1) % items.length : -1;
      items.forEach((el, i) => el.classList.toggle('focused', i === srIdx));
      if (items[srIdx]) { items[srIdx].scrollIntoView({ block: 'nearest' }); document.getElementById('searchInput').setAttribute('aria-activedescendant', 'sr-' + srIdx); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      // Wrap-around: pressing up at the input jumps to the last result.
      srIdx = items.length ? (srIdx - 1 + items.length) % items.length : -1;
      items.forEach((el, i) => el.classList.toggle('focused', i === srIdx));
      if (items[srIdx]) { items[srIdx].scrollIntoView({ block: 'nearest' }); document.getElementById('searchInput').setAttribute('aria-activedescendant', 'sr-' + srIdx); }
    } else if (e.key === 'Enter' && srIdx >= 0 && items[srIdx]) {
      addSearchHistory(document.getElementById('searchInput').value.trim());

    } else if (e.key === 'Escape') {
      sr.classList.remove('active');

    if (e.key !== 'Tab') return;
    const sb = document.getElementById('sidebar');
    const focusable = sb.querySelectorAll('.sidebar-link');
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

  /* ── SCROLL EFFECTS ─────────────────────────────────── */
  let _scrollTick = false;
  window.addEventListener('scroll', () => {
    if (!_scrollTick) {
      requestAnimationFrame(() => {
        const d = document.documentElement;
        const pct = d.scrollHeight > d.clientHeight
          ? (d.scrollTop / (d.scrollHeight - d.clientHeight)) * 100 : 0;
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('back-top').classList.toggle('visible', d.scrollTop > LIMITS.BACK_TO_TOP);
        _scrollTick = false;
      });

  /* ── POPSTATE ───────────────────────────────────────── */
  // popstate fires on browser back/forward AND on hash changes triggered
  // outside our SPA (typing a hash in the address bar, clicking a plain
  // <a href="#x"> elsewhere, a deep link that lands on the already-loaded
  // tab). e.state is null in those last cases, so the URL is the only
  // source of truth.
  function pageFromHash() {
    const raw = (location.hash.slice(1).split(':')[0]) || 'welcome';
    return REDIRECTS[raw] || raw;
  }
  window.addEventListener('popstate', e => {
    const pageId = e.state?.page || pageFromHash();

    window._isPopstate = false;

  });
  // hashchange catches address-bar edits and hash-only nav from external
  // links — popstate doesn't fire reliably for those across all browsers.
  window.addEventListener('hashchange', () => {
    const pageId = pageFromHash();
    // navigate() also reads the hash for REDIRECTS; this is idempotent.
    if ((document.querySelector('.content-inner h1')?.textContent || '') !==
        (PAGES[pageId]?.title || '')) {
      navigate(pageId);
    }
  });

  /* ── KEYBOARD SHORTCUTS ─────────────────────────────── */
  /* Focus-trap helper (KAY-202). Distinct from the sidebar's trapFocus above
     — separate names because both lived in the same scope and the later
     declaration was silently shadowing the sidebar trap. */
  let _savedFocus = null;
  function trapModalFocus(overlay) {
    const focusable = overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    focusable[0].focus();
    overlay._trapHandler = function(e) {
      if (e.key !== 'Tab') return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    };
    overlay.addEventListener('keydown', overlay._trapHandler);
  }
  function releaseFocus(overlay) {
    if (overlay._trapHandler) { overlay.removeEventListener('keydown', overlay._trapHandler); overlay._trapHandler = null; }
    if (_savedFocus) { try { _savedFocus.focus(); } catch(e){} _savedFocus = null; }
  }

  function openKbd() { _savedFocus = document.activeElement; var m = document.getElementById('kbdModal'); m.classList.add('active'); trapModalFocus(m); }
  function closeKbd() { var m = document.getElementById('kbdModal'); m.classList.remove('active'); releaseFocus(m); }

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
    if (document.getElementById('kbdModal').classList.contains('active')) {
      if (e.key === 'Escape') closeKbd();
      return;
    }
    if (e.key === '?') { e.preventDefault(); openKbd(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const cur = location.hash.slice(1) || 'welcome';
      const idx = visiblePageKeys.indexOf(cur);
      if (idx === -1) return;
      if (e.key === 'ArrowLeft' && idx > 0) navigate(visiblePageKeys[idx - 1]);
      if (e.key === 'ArrowRight' && idx < visiblePageKeys.length - 1) navigate(visiblePageKeys[idx + 1]);
    }
    if (e.key === 't' || e.key === 'T') window.scrollTo({ top: 0, behavior: smoothBehavior() });
    if (e.key === 'h' || e.key === 'H') navigate('welcome');
  });

  /* ── RECENT PAGES ─────────────────────────────────────── */
  function addToRecent(pageId) {
    if (pageId === 'welcome') return;
    let recent = getRecent();
    recent = recent.filter(p => p !== pageId);
    recent.unshift(pageId);
    if (recent.length > 5) recent = recent.slice(0, 5);
    localStorage.setItem('recent-pages', JSON.stringify(recent));
  }

  /* ── FAQ ACCORDION ──────────────────────────────────── */
  function renderFaqAccordion(container, pageId) {
    if (pageId !== 'faq') return;
    const h3s = container.querySelectorAll('h3');
    h3s.forEach((h3, i) => {
      const item = document.createElement('div');
      item.className = 'faq-item';
      const question = document.createElement('button');
      question.className = 'faq-question';
      question.type = 'button';
      question.setAttribute('aria-expanded', 'false');
      question.setAttribute('aria-controls', `faq-answer-${i}`);
      const qText = h3.textContent.replace(/#\s*$/, '').trim();
      question.innerHTML = `<span>${qText}</span><span class="faq-chevron" aria-hidden="true">▼</span>`;
      question.onclick = () => {
        const isOpen = item.classList.toggle('open');
        question.setAttribute('aria-expanded', isOpen);
      };
      const answer = document.createElement('div');
      answer.className = 'faq-answer';
      answer.id = `faq-answer-${i}`;
      answer.setAttribute('role', 'region');
      answer.setAttribute('aria-labelledby', `faq-q-${i}`);
      question.id = `faq-q-${i}`;
      // Collect siblings until next h3, h2, or hr
      let sib = h3.nextElementSibling;
      const siblings = [];
      while (sib && sib.tagName !== 'H3' && sib.tagName !== 'H2' && sib.tagName !== 'HR') {
        siblings.push(sib);
        sib = sib.nextElementSibling;
      }
      siblings.forEach(s => answer.appendChild(s));
      item.appendChild(question);
      item.appendChild(answer);
      h3.replaceWith(item);
    });
  }

  /* ── READING TIME ───────────────────────────────────── */
  function renderArticleMeta(container, pageId) {
    if (pageId === 'welcome') return;
    // Use raw page content to avoid counting UI chrome (buttons, tooltips)
    const raw = (PAGES[pageId]?.content || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const words = raw ? raw.split(/\s+/).length : 0;
    const mins = Math.max(1, Math.round(words / 200));
    const h1 = container.querySelector('h1');
    if (!h1) return;
    // Breadcrumb (Section → Page) inserted before the H1 so it acts as a
    // section-orientation cue for users arriving via search engines.
    const section = PAGES[pageId]?.section;
    if (section && !container.querySelector('.breadcrumb-trail')) {
      const crumb = document.createElement('div');
      crumb.className = 'breadcrumb-trail';
      crumb.innerHTML = `<span class="breadcrumb-section">${escapeHtml(section)}</span><span class="breadcrumb-sep" aria-hidden="true">›</span><span class="breadcrumb-current">${escapeHtml(PAGES[pageId].title)}</span>`;
      h1.insertAdjacentElement('beforebegin', crumb);
    }
    const meta = document.createElement('div');
    meta.className = 'article-meta';
    const updated = LAST_UPDATED[pageId] || LAST_UPDATED_DEFAULT;
    meta.innerHTML = `<span class="read-time">${mins} min read</span><span class="article-meta-dot"></span><span>${words} words</span><span class="article-meta-dot"></span><span>Updated ${updated}</span>`;
    h1.insertAdjacentElement('afterend', meta);
  }

  /* ── ARTICLE FEEDBACK WIDGET ──────────────────────── */
  // Pages that already function as a feedback channel get no widget.
  const FEEDBACK_EXCLUDED = new Set(['welcome', 'contact', 'feature-requests']);
  function renderArticleFeedback(container, pageId) {
    if (FEEDBACK_EXCLUDED.has(pageId)) return;
    const page = PAGES[pageId];
    if (!page) return;
    // Don't ask twice in the same browser
    const seen = safeGet('article-feedback-given', {});
    if (seen[pageId]) return;
    const wrap = document.createElement('div');
    wrap.className = 'article-feedback';
    wrap.dataset.page = pageId;
    wrap.innerHTML = `
      <p class="article-feedback-prompt">Was this page helpful?</p>
      <div class="article-feedback-buttons">
        <button type="button" class="article-feedback-btn" onclick="rateHelpful('${pageId}', 'yes')">${IC.check} Yes</button>
        <button type="button" class="article-feedback-btn" onclick="rateHelpful('${pageId}', 'no')">${IC.x} No</button>
      </div>
      <div class="article-feedback-form" hidden>
        <label for="afComment-${escapeHtml(pageId)}" class="sr-only">What didn't work?</label>
        <textarea id="afComment-${escapeHtml(pageId)}" placeholder="What didn't work? Any details help us improve this page." rows="3" autocapitalize="sentences" enterkeyhint="send"></textarea>
        <button type="button" class="article-feedback-submit" onclick="sendArticleFeedback('${pageId}')">Send feedback</button>
      </div>
      <div class="article-feedback-thanks" hidden>Thanks — your feedback is in our queue.</div>`;
    container.appendChild(wrap);
  }
  function rateHelpful(pageId, value) {
    const wrap = document.querySelector(`.article-feedback[data-page="${pageId}"]`);
    if (!wrap) return;
    const buttons = wrap.querySelector('.article-feedback-buttons');
    const form = wrap.querySelector('.article-feedback-form');
    const thanks = wrap.querySelector('.article-feedback-thanks');
    if (value === 'no') {
      // Reveal the comment composer
      buttons.style.display = 'none';
      form.hidden = false;
      const ta = form.querySelector('textarea');
      if (ta) ta.focus();
      return;
    }
    // value === 'yes' — record locally and dismiss; no submission needed.
    markFeedbackGiven(pageId);
    buttons.style.display = 'none';
    form.hidden = true;
    thanks.hidden = false;
    thanks.textContent = 'Thanks!';
    thanks.setAttribute('role', 'status');
  }
  // Posts feedback to the kaynos-site Linear feature-request function (KAY-1494);
  // the function is CORS-allowlisted for https://docs.kaynos.net and creates a
  // Linear issue tagged [Customer request] with FEATURE + HELP_CENTER labels.
  // Falls back to the user's mail client if the network request fails so they
  // are never stuck without a way to send the feedback.
  const FEEDBACK_ENDPOINT = 'https://www.kaynos.net/.netlify/functions/feature-request';
  async function sendArticleFeedback(pageId) {
    const wrap = document.querySelector(`.article-feedback[data-page="${pageId}"]`);
    if (!wrap) return;
    const ta = wrap.querySelector('textarea');
    const comment = (ta && ta.value || '').trim();
    if (!comment) { ta?.focus(); return; }
    const page = PAGES[pageId];
    const title = page?.title || pageId;
    const url = location.origin + location.pathname + '#' + pageId;
    const submit = wrap.querySelector('.article-feedback-submit');
    const form = wrap.querySelector('.article-feedback-form');
    const thanks = wrap.querySelector('.article-feedback-thanks');
    const prevLabel = submit ? submit.textContent : '';
    if (submit) { submit.disabled = true; submit.textContent = 'Sending…'; }

    const description = [
      `**Page:** ${title} (#${pageId})`,
      `**URL:** ${url}`,
      '',
      '---',
      '',
      comment,
    ].join('\n');

    const payload = {
      title: `Docs feedback: ${title}`,
      description,
      name: 'docs.kaynos.net reader',
      email: '',
      priority: 'nice-to-have',
    };

    let ok = false;
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(FEEDBACK_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });
      clearTimeout(timeoutId);
      ok = res.ok;
    } catch (_) { ok = false; }

    if (ok) {
      markFeedbackGiven(pageId);
      form.hidden = true;
      thanks.hidden = false;
      thanks.textContent = 'Thanks — your feedback is in our queue.';
      thanks.setAttribute('role', 'status');
      return;
    }

    // Network or server failure: fall back to mailto so the comment isn't lost.
    if (submit) { submit.disabled = false; submit.textContent = prevLabel; }
    const subject = 'Docs feedback: ' + title;
    const body = 'Page: ' + title + ' (#' + pageId + ')\nURL: ' + url + '\n\n' + comment;
    const mail = mailHref('?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body));
    markFeedbackGiven(pageId);
    form.hidden = true;
    thanks.hidden = false;
    thanks.textContent = 'Couldn’t reach our server — opening your email instead.';
    thanks.setAttribute('role', 'status');
    window.location.href = mail;
  }
  window.sendArticleFeedback = sendArticleFeedback;
  function markFeedbackGiven(pageId) {
    const seen = safeGet('article-feedback-given', {});
    seen[pageId] = Date.now();
    safeSet('article-feedback-given', seen);
  }
  window.rateHelpful = rateHelpful;

  /* ── RELATED ARTICLES ──────────────────────────────── */
  function renderRelated(container, pageId) {
    const page = PAGES[pageId];
    if (!page || !page.section || pageId === 'welcome') return;
    const sameSection = allPageKeys.filter(k => PAGES[k].section === page.section && k !== pageId);
    if (!sameSection.length) return;
    // Fisher-Yates shuffle for unbiased selection
    const shuffled = [...sameSection];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const picks = shuffled.slice(0, 3);
    const div = document.createElement('div');
    div.className = 'related-articles';
    div.innerHTML = '<div class="related-title">Related articles</div><div class="related-grid">' +
      picks.map(k => `<a class="related-card" href="#${k}" onclick="navigate('${k}');return false"><span class="related-card-title">${PAGES[k].title}</span><span class="related-card-section">${PAGES[k].section}</span></a>`).join('') +
      '</div>';
    container.appendChild(div);
  }

  function lookupError(q) {
    const container = document.getElementById('errorResults');
    if (!container) return;
    if (!q || q.length < 2) { container.innerHTML = ''; return; }
    const lower = q.toLowerCase();
    const matches = ERROR_DB.filter(e => e.patterns.some(p => lower.includes(p)));
    if (matches.length === 0 && q.length > 3) {
      // Fuzzy fallback — match any word
      const words = lower.split(/\s+/).filter(w => w.length > 2);
      ERROR_DB.forEach(e => {
        if (words.some(w => e.patterns.some(p => p.includes(w)) || e.title.toLowerCase().includes(w))) {
          if (!matches.includes(e)) matches.push(e);
        }
      });
    }
    container.innerHTML = matches.slice(0, 4).map(m =>
      `<div class="error-match" onclick="navigate('${m.page}')">
        <div class="error-match-title">${m.title}</div>
        <div class="error-match-hint">${m.hint} → ${PAGES[m.page].title}</div>

    ).join('') || (q.length > 3 ? '<div style="font-size:.8125rem;color:var(--text-tertiary);padding:8px 0">No matches — try different keywords or <a href="' + mailHref() + '" style="color:var(--accent)">email support</a></div>' : '');

  function addGlossaryTooltips(container) {
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const replacements = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.parentElement.closest('.glossary-term, .hint, h1, h2, h3, a, code, pre, .term-tooltip, .faq-question, button, .tldr, .hero, .start-step, .feature-card, .ql-desc, .ql-title, .breadcrumb-trail, .page-toc, details.page-toc')) continue;
      for (const [term, def] of Object.entries(GLOSSARY_TERMS)) {
        const re = new RegExp(`\\b(${term})\\b`, 'i');
        const match = node.textContent.match(re);
        if (match) {
          replacements.push({ node, term: match[1], def, index: match.index });
          break; // One tooltip per text node
        }
      }
    }
    // Process in reverse to avoid node index shifting
    let glossaryUid = 0;
    replacements.reverse().forEach(({ node, term, def, index }) => {
      const before = node.textContent.slice(0, index);
      const after = node.textContent.slice(index + term.length);
      const span = document.createElement('span');
      span.className = 'term-tooltip';
      span.tabIndex = 0;
      span.textContent = term;
      const popup = document.createElement('span');
      popup.className = 'term-tooltip-popup';
      const tipId = 'glossary-tip-' + (glossaryUid++);
      popup.id = tipId;
      popup.setAttribute('role', 'tooltip');
      popup.textContent = def;
      span.setAttribute('aria-describedby', tipId);
      span.appendChild(popup);
      const parent = node.parentNode;
      if (before) parent.insertBefore(document.createTextNode(before), node);
      parent.insertBefore(span, node);
      if (after) parent.insertBefore(document.createTextNode(after), node);
      parent.removeChild(node);
    });
  }

  function copyArticleMarkdown(pageId) {
    const pc = document.getElementById('pageContent');
    if (!pc) return;
    // Simple HTML to markdown conversion
    let md = '';
    pc.querySelectorAll('h1, h2, h3, p, li, pre').forEach(el => {
      const text = el.textContent.trim();
      if (!text) return;
      if (el.tagName === 'H1') md += '# ' + text + '\n\n';
      else if (el.tagName === 'H2') md += '## ' + text + '\n\n';
      else if (el.tagName === 'H3') md += '### ' + text + '\n\n';
      else if (el.tagName === 'LI') md += '- ' + text + '\n';
      else if (el.tagName === 'PRE') md += '```\n' + text + '\n```\n\n';
      else md += text + '\n\n';
    });
    md += '\n---\nFrom Kaynos Docs: ' + location.origin + location.pathname + '#' + pageId;
    navigator.clipboard.writeText(md.trim()).then(() => showToast('Article copied as markdown')).catch(() => showToast('Copy failed — try selecting manually'));
  }

  function getHighlights() { return safeGet('highlights', {}); }

  document.addEventListener('mouseup', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.toString().trim().length < 5) return;
    const pc = document.getElementById('pageContent');
    if (!sel.anchorNode || !pc.contains(sel.anchorNode)) return;
    // Don't highlight inside interactive elements
    if (sel.anchorNode.parentElement.closest('.hint, .quick-link, a, button, .wizard-option, .checklist-item')) return;
    const text = sel.toString().trim();
    const pageId = (location.hash.slice(1).split(':')[0]) || 'welcome';
    if (pageId === 'welcome') return;
    const highlights = getHighlights();
    if (!highlights[pageId]) highlights[pageId] = [];
    if (highlights[pageId].some(h => h.text === text)) return;
    highlights[pageId].push({ text, ts: Date.now() });
    localStorage.setItem('highlights', JSON.stringify(highlights));
    showToast('Text highlighted — saved for this page');
    sel.removeAllRanges();
    applyHighlights(pc, pageId);
  });

  function applyHighlights(container, pageId) {
    const highlights = getHighlights();
    if (!highlights[pageId] || !highlights[pageId].length) return;
    highlights[pageId].forEach(h => {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.parentElement.closest('.user-highlight, .hint, h1, a, button, code, pre')) continue;
        const idx = node.textContent.indexOf(h.text);
        if (idx === -1) continue;
        const before = node.textContent.slice(0, idx);
        const after = node.textContent.slice(idx + h.text.length);
        const span = document.createElement('span');
        span.className = 'user-highlight';
        span.textContent = h.text;
        const tooltip = document.createElement('span');
        tooltip.className = 'highlight-tooltip';
        tooltip.innerHTML = IC.x + ' Remove';
        tooltip.onclick = (e) => {
          e.stopPropagation();
          const hl = getHighlights();
          hl[pageId] = hl[pageId].filter(x => x.text !== h.text);
          localStorage.setItem('highlights', JSON.stringify(hl));
          showToast('Highlight removed');
          navigate(pageId);
        };
        span.appendChild(tooltip);
        const parent = node.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(span, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);
        break;
      }
    });
  }

    fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    }).then(async (res) => {
      clearTimeout(timeout);
      if (res.status === 200) {
        localStorage.setItem(cfg.rateKey, String(Date.now()));
        form.hidden = true;
        form.style.display = 'none';
        const success = document.getElementById(cfg.successId);
        if (success) {
          success.style.display = '';
          success.setAttribute('role', 'alert');
        }
        return;
      }
      if (res.status === 429) {
        let msg = 'Too many submissions — please wait a minute and try again.';
        try {
          const body = await res.json();
          if (body && body.error) msg = body.error;
        } catch (_) { /* use default */ }
        showToast(msg);
        if (btn) { btn.disabled = false; btn.textContent = cfg.submitText; }
        return;
      }
      try {
        const body = await res.json();
        if (body && body.error) {
          showToast(body.error);
          if (btn) { btn.disabled = false; btn.textContent = cfg.submitText; }
          return;
        }
      } catch (_) { /* fall through */ }
      showFormError(res, cfg, btn);
    }).catch(err => {
      clearTimeout(timeout);
      if (err.name === 'AbortError') {
        showToast('Request timed out — check your connection and try again.');
      } else {
        showToast('Network error — check your connection and try again.');
      }
      if (btn) { btn.disabled = false; btn.textContent = cfg.submitText; }
    });
  });

  function getPageContent(pageId) {
    return PAGES[pageId];
  }

  /* ── WIZARD ESCALATION ─────────────────────────────── */
  function addWizardEscalation(container, stepId) {
    const step = WIZARD[stepId];
    if (!step || !step.result) return;
    const div = document.createElement('div');
    div.className = 'wizard-feedback';
    div.innerHTML = `<span>Did this fix your problem?</span>
      <button class="wizard-fb-btn" onclick="wizardFixed(this)">Yes</button>
      <button class="wizard-fb-btn" onclick="wizardNotFixed(this,'${stepId}')">No</button>`;
    const esc = document.createElement('div');
    esc.className = 'wizard-escalate';
    esc.id = 'wizardEscalate';
    const escSubject = encodeURIComponent('Help: ' + step.title);
    const escBody = encodeURIComponent('I tried the suggestion for "' + step.title + '" but it didn\'t work.\n\nBrowser: ' + navigator.userAgent.split(' ').slice(-2).join(' ') + '\n\nWhat happened:\n');
    esc.innerHTML = 'Still stuck? <a href="' + mailHref('?subject=' + escSubject + '&body=' + escBody) + '">Email support with this issue pre-filled \u2192</a>';
    container.appendChild(div);
    container.appendChild(esc);
  }
  function wizardFixed(btn) { btn.classList.add('selected'); showToast('Glad it helped!'); }
  function wizardNotFixed(btn, stepId) {
    btn.classList.add('selected');
    document.getElementById('wizardEscalate').classList.add('show');
  }

  /* ── SHAREABLE WIZARD LINKS ────────────────────────── */
  function getWizardShareLink(stepId) {
    return location.origin + location.pathname + '#troubleshoot:wizard-' + stepId;
  }
  function copyWizardLink(stepId) {
    navigator.clipboard.writeText(getWizardShareLink(stepId)).then(() => showToast('Link copied')).catch(() => showToast('Copy failed — try selecting manually'));
  }

  /* ── PRINT / EXPORT ────────────────────────────────── */
  function renderPrintBtn(container, pageId) {
    if (pageId === 'welcome') return;
    const bar = container.querySelector('.article-actions');
    if (!bar) return;
    const btn = document.createElement('button');
    btn.className = 'print-btn';
    btn.innerHTML = IC.print + ' Print';
    btn.onclick = () => window.print();
    bar.appendChild(btn);
  }

  /* ── UPLOAD TIME CALCULATOR ─────────────────────────── */
  function calcUpload() {
    const sizeMB = parseFloat(document.getElementById('calcSize')?.value);
    const speedMbps = parseFloat(document.getElementById('calcSpeed')?.value);
    const el = document.getElementById('calcResult');
    if (!el || !sizeMB || !speedMbps || sizeMB <= 0 || speedMbps <= 0 || sizeMB > 100000 || speedMbps > 10000) {
      if (el) el.classList.remove('show');
      return;
    }
    const seconds = (sizeMB * 8) / speedMbps;
    let timeStr;
    if (seconds < 60) timeStr = Math.round(seconds) + ' seconds';
    else if (seconds < 3600) timeStr = Math.round(seconds / 60) + ' minutes';
    else timeStr = (seconds / 3600).toFixed(1) + ' hours';
    el.textContent = `Estimated upload time: ~${timeStr}`;
    el.classList.add('show');
  }

  /* ── UPLOAD PREFLIGHT CHECKLIST ────────────────────── */
  const PREFLIGHT = [
    { id: 'pf-format', text: 'File is MP4, MOV, WebM, or MKV' },
    { id: 'pf-size', text: 'File is under 5 GB' },
    { id: 'pf-landscape', text: 'Recorded in landscape orientation' },
    { id: 'pf-1080', text: 'Resolution is 1080p or lower (recommended)' },
    { id: 'pf-codec', text: 'Video codec is H.264 with AAC audio (if you had a choice)' },
    { id: 'pf-trim', text: 'Trimmed dead air at start and end' },
    { id: 'pf-wifi', text: 'Connected to stable Wi-Fi or wired internet' },
    { id: 'pf-sync', text: 'Paused heavy sync tools (Dropbox, Google Drive)' },
  ];

  function renderPreflight() {
    const container = document.getElementById('preflightList');
    if (!container) return;
    const checked = safeSessionGet('preflight', []);
    container.innerHTML = '';
    PREFLIGHT.forEach(item => {
      const isDone = checked.includes(item.id);
      const el = document.createElement('div');
      el.className = 'preflight-item' + (isDone ? ' checked' : '');
      el.innerHTML = `<div class="preflight-box">${isDone ? IC.check : ''}</div><span class="pf-text">${item.text}</span>`;
      el.onclick = () => {
        let c = safeSessionGet('preflight', []);
        if (c.includes(item.id)) c = c.filter(x => x !== item.id);
        else c.push(item.id);
        sessionStorage.setItem('preflight', JSON.stringify(c));
        renderPreflight();
      };
      container.appendChild(el);
    });
    // Ready status
    if (checked.length === PREFLIGHT.length) {
      const status = document.createElement('div');
      status.className = 'preflight-status ready';
      status.textContent = 'All checks passed — you\'re ready to upload!';
      container.appendChild(status);
    }
  }

  /* ── BROWSER CHECK ─────────────────────────────────── */
  function checkBrowser() {
    const el = document.getElementById('browserResult');
    if (!el) return;
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    let browser = 'Unknown';
    let status = 'warn';
    let msg = '';
    if (isIOS) { browser = 'Safari (iOS)'; status = 'warn'; msg = 'Good support. All iOS browsers use WebKit — use MP4 with H.264 for best compatibility.'; }
    else if (ua.includes('Edg')) { browser = 'Edge'; status = 'good'; msg = 'Full support.'; }
    else if (ua.includes('Chrome')) { browser = 'Chrome'; status = 'good'; msg = 'Full support — recommended browser.'; }
    else if (ua.includes('Firefox')) { browser = 'Firefox'; status = 'good'; msg = 'Full support — great choice.'; }
    else if (ua.includes('Safari')) { browser = 'Safari'; status = 'warn'; msg = 'Good support. Use MP4 with H.264 for best compatibility.'; }
    else { msg = 'Unknown browser. If you run into issues, try Chrome.'; }
    el.className = 'browser-result ' + status;
    el.innerHTML = `${status === 'good' ? IC.check : IC.warn} <div><strong>You're using ${browser}.</strong> ${msg}</div>`;
  }

  /* ── SHARE BUTTON ──────────────────────────────────── */
  function renderShareBtn(container, pageId) {
    if (pageId === 'welcome') return;
    // Lazy-create the actions bar; it has no static markup. Renders for share,
    // print, and copy-article all append into it, so the first to run creates it.
    let bar = container.querySelector('.article-actions');
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'article-actions';
      const meta = container.querySelector('.article-meta');
      if (meta) meta.insertAdjacentElement('afterend', bar);
      else {
        const h1 = container.querySelector('h1');
        if (h1) h1.insertAdjacentElement('afterend', bar);
        else return;
      }
    }
    const btn = document.createElement('button');
    btn.className = 'share-btn';
    btn.innerHTML = IC.share + ' Share';
    btn.onclick = () => {
      const url = location.origin + location.pathname + '#' + pageId;
      if (navigator.share) {
        // iOS Safari rejects the promise with AbortError when the user
        // dismisses the share sheet — that's not an error worth surfacing.
        navigator.share({ title: PAGES[pageId].title + ' — Kaynos Docs', url })
          .catch(err => { if (err && err.name !== 'AbortError') showToast('Share failed — try copying the link'); });
      } else {
        navigator.clipboard.writeText(url).then(() => showToast('Link copied')).catch(() => showToast('Copy failed — try selecting manually'));
      }
    };
    bar.appendChild(btn);
  }

  /* ── OFFLINE DETECTION ───────────────────────────────
     Event listeners only fire on connectivity *change*. If the visitor
     loads (or reloads) while already offline — the SW serves cached
     HTML — neither 'offline' nor 'online' has fired yet, so the banner
     stays hidden despite navigator.onLine being false. Check initial
     state too. */
  function _setOfflineBanner(off) {
    document.getElementById('offlineBanner')?.classList.toggle('show', off);
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) _setOfflineBanner(true);
  window.addEventListener('offline', () => _setOfflineBanner(true));
  window.addEventListener('online',  () => _setOfflineBanner(false));

  /* ── THEME TOGGLE ───────────────────────────────────── */
  function applyTheme(mode) {
    document.documentElement.classList.toggle('light', mode === 'light');
    document.getElementById('themeIcon').innerHTML = mode === 'light'
      ? '<path d="M8 1v1M8 14v1M1 8h1M14 8h1M3.1 3.1l.7.7M12.2 12.2l.7.7M12.9 3.1l-.7.7M3.8 12.2l-.7.7"/><circle cx="8" cy="8" r="3"/>'
      : '<path d="M13.5 8a5.5 5.5 0 01-7.4 5.2A6.5 6.5 0 008.3 1 5.5 5.5 0 0113.5 8z"/>';
    document.querySelector('meta[name="theme-color"]').content = mode === 'light' ? '#ffffff' : '#060609';
  }
  function toggleTheme() {
    const isLight = document.documentElement.classList.contains('light');
    const next = isLight ? 'dark' : 'light';
    localStorage.setItem('theme', next);
    applyTheme(next);
  }
  (function initTheme() {
    const stored = localStorage.getItem('theme');
    const pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    applyTheme(stored || pref);
  })();

  /* ── PLATFORM-AWARE MODIFIER KEY ─────────────────────── */
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
  if (!isMac) {
    const modKey = document.getElementById('searchKbd')?.querySelector('kbd');
    if (modKey) modKey.textContent = 'Ctrl';
    document.querySelectorAll('.mod-key').forEach(el => { el.textContent = 'Ctrl'; });
  }

  /* ── INIT ───────────────────────────────────────────── */
  buildSidebar();
  const hash = location.hash.slice(1);
  const [initPage, initSection] = hash.split(':');
  const resolvedPage = REDIRECTS[initPage] || initPage;
  // Empty hash → welcome. Unknown hash → fall through to navigate() so its
  // "Page not found" handler renders with the preserved URL.
  navigate(resolvedPage || 'welcome');
  // ?q=<term> arrives from the 404 page's fallback search form. Prefill the
  // header search input and open the results panel so the user sees matches
  // immediately without re-typing.
  try {
    const params = new URLSearchParams(location.search);
    const initialQuery = (params.get('q') || '').trim();
    if (initialQuery) {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = initialQuery;
        requestAnimationFrame(() => {
          input.focus();
          handleSearch(initialQuery);
        });
      }
      // Strip the query string from the URL so reloads don't re-fire the search.
      history.replaceState(null, '', location.pathname + location.hash);
    }
  } catch (_) { /* URLSearchParams unsupported — ignore */ }
  if (initSection) {
    if (initSection.startsWith('wizard-')) {
      requestAnimationFrame(() => renderWizard(initSection.replace('wizard-', '')));
    } else {
      requestAnimationFrame(() => {
        const el = document.getElementById(initSection);
        if (el) el.scrollIntoView({ behavior: smoothBehavior(), block: 'start' });
      });
    }
  }
  // Expose needed functions to global scope for onclick handlers
  window.navigate = navigate;
  window.toggleTheme = toggleTheme;
  window.toggleSidebar = toggleSidebar;
  window.togglePollVote = typeof togglePollVote !== 'undefined' ? togglePollVote : function(){};
  window.submitPollIdea = typeof submitPollIdea !== 'undefined' ? submitPollIdea : function(){};
  window.setPollSort = typeof setPollSort !== 'undefined' ? setPollSort : function(){};
  window.setReleaseFilter = setReleaseFilter;
  window.calcUpload = calcUpload;
  window.lookupError = lookupError;
  window.renderWizard = renderWizard;
  window.wizardFixed = wizardFixed;
  window.wizardNotFixed = wizardNotFixed;
  window.mailLink = mailLink;
  window.mailHref = mailHref;
  window.showToast = showToast;
  window.openKbd = openKbd;
  window.closeKbd = closeKbd;
  window.escapeHtml = escapeHtml;
  window.addSearchHistory = addSearchHistory;
  window.tocJump = tocJump;
  window.copyWizardLink = copyWizardLink;
  window.toggleSection = toggleSection;
  window.hideRecent = hideRecent;
  window.showRecent = showRecent;
  // Search input uses inline oninput/onfocus handlers; both helpers were defined
  // inside this IIFE and never exported, so search has been broken on main for
  // a while. Exposing them here so search actually works.
  window.debouncedSearch = debouncedSearch;
  window.showSearchHistory = showSearchHistory;
  })();
  </script>

  <!-- Service worker — cache-first for fonts, network-first for HTML.
       Lets previously-visited pages load on flaky / no connection. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () { /* best-effort */ });
      });
    }
  </script>
</body>
</html>
