<p>Open your <strong>Profile</strong> (avatar in the header) and click <strong>Manage</strong> in the Billing section — admins only. This opens the Stripe billing portal where you can:</p>
<ul>
<li>Update your payment method (credit card)</li>
<li>View past invoices and receipts</li>
<li>Cancel your subscription</li>
</ul>
<p>Kaynos never sees your credit card number — all payment processing is handled by Stripe (PCI-DSS Level 1 certified).</p>
<h3>Can I pause my subscription?</h3>
<p>Not directly from the app. To take a break, cancel from the Stripe billing portal (Profile → Manage) — your account stays available through the end of the paid period, then deactivates. Re-subscribe any time to restore access. For a longer pause without losing data, email ${mailLink()} and we'll work something out.</p>
<hr>
<h2>Search and navigation</h2>
<h3>Is there a quick way to find things?</h3>
<p>Use the search bar at the top of every page. Type a keyword — matching pages and sections appear instantly. Press <kbd>Cmd+K</kbd> (Mac) or <kbd>Ctrl+K</kbd> (Windows) to jump into search from anywhere; arrow keys navigate results, Enter opens one.</p>
<hr>
<h2>Data</h2>
<h3>Can I export my data?</h3>
<p>Admins can export all school data from <strong>Admin → Reports &amp; Exports</strong>: full school data as JSON, plus CSV exports (members, session log). Individuals can request a personal data export from their profile — a download link is emailed when it's ready. Useful for backup, migration, or GDPR portability.</p>
<hr>
<h2>Remote coaching</h2>
<h3>Can I coach remotely with Kaynos?</h3>
<p>Yes. Many coaches use Kaynos for async video review with students worldwide. Tips:</p>
<ul>
<li>Use session types (drilling, sparring, comp prep) and consistent titles so each student's history reads at a glance.</li>
<li>Enable <strong>email notifications</strong> so students know when your review is ready.</li>
<li>Use keyboard shortcuts for speed: <kbd>J</kbd>/<kbd>L</kbd> to scrub the timeline, then <kbd>Cmd+Enter</kbd> (or <kbd>Ctrl+Enter</kbd>) once you're in the note editor to save.</li>
</ul>`},

    "developer-api": {
      title: "Developer API", section: "Admin",
      content: `
<h1>Developer API</h1>
<div class="tldr"><strong>TLDR:</strong> Kaynos does not offer a public developer API today — no tokens, no webhooks, no SDKs. The REST endpoints behind the app are internal and unversioned. For programmatic data access, use the admin exports.</div>
<h2>How the app's API works</h2>
<p>The web app talks to a set of internal REST endpoints (sessions, classes, members, notes, uploads, billing, and more), authenticated by the same session cookie as your login. These endpoints aren't documented for external use and aren't a stability contract — shapes and routes can change in any release without notice.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div><strong>Field naming:</strong> the role we call <strong>coach</strong> in the UI appears as <code>"instructor"</code> in API payloads (e.g. <code>role: "instructor"</code>) — you'll see this in the JSON export too.</div></div>
<h2>What is not available</h2>
<ul>
<li>Public API tokens or personal access tokens</li>
<li>OAuth apps or third-party clients</li>
<li>Customer-facing webhooks for real-time events</li>
<li>SDKs or client libraries</li>
</ul>
<h2>Getting data out today</h2>
<p>The supported programmatic surface is exports: full school data as <strong>JSON</strong> and members or session logs as <strong>CSV</strong> from <strong>Admin → Reports &amp; Exports</strong>, plus per-session transcript downloads (SRT/VTT/TXT) where transcripts exist. See <a href="#integrations" onclick="navigate('integrations');return false">Integrations &amp; exports</a>.</p>
<p>A public API may come later. If your use case needs programmatic access or webhooks, <a href="${mailHref()}">contact us</a> or visit the <a href="#contact" onclick="navigate('contact');return false">contact page</a> — demand drives priority. Follow the <a href="#release-notes" onclick="navigate('release-notes');return false">release notes</a> for updates.</p>`},

    integrations: {
      title: "Integrations & exports", section: "Admin",
      content: `
<h1>Integrations &amp; exports</h1>
<div class="tldr"><strong>TLDR:</strong> Kaynos is a focused tool — most things stay inside the app. Exports (JSON/CSV/transcripts), email and push notifications, Google Calendar availability, and SMS lesson alerts are the integration surface. Public API and webhooks aren't available yet.</div>

<h2>What's available</h2>
<dl>
<dt>Data export (admin)</dt>
<dd><strong>Admin → Reports &amp; Exports</strong>. Full school data as JSON; members and session log as CSV (Excel-friendly). Includes users, sessions, classes, notes, and video metadata. Useful for backups, migrations, and GDPR portability.</dd>

<dt>Transcript export</dt>
<dd>Where a class video has a transcript, download it as <strong>SRT</strong>, <strong>WebVTT</strong>, or plain <strong>TXT</strong> straight from the browser.</dd>

<dt>Google Calendar (coaches)</dt>
<dd>Coaches can connect Google Calendar so private-lesson booking checks their free/busy times and prevents double-booking. Read-only — Kaynos doesn't write events to your calendar yet. Connect or disconnect from the calendar settings; pause lookups any time.</dd>

<dt>SMS lesson notifications</dt>
<dd>Private-lesson requests and confirmations can go out by text message (via Twilio) so booking doesn't stall waiting on email.</dd>

<dt>Usage reports (admin)</dt>
<dd>Email reports of academy activity at a chosen cadence (off / weekly / monthly). Send a manual report on demand. Available once the school has 5+ sessions or classes.</dd>

<dt>Email &amp; push notifications</dt>
<dd>Per-event categories under Profile → Notifications, plus web push on installed mobile apps. Mention notifications include a deep link to the exact note timestamp.</dd>

<dt>In-app support</dt>
<dd>The <strong>Support</strong> page inside <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> files a ticket with a reference number; recent tickets stay visible for follow-up.</dd>

<dt>Add to home screen (PWA)</dt>
<dd>Both <a href="https://app.kaynos.net" target="_blank" rel="noopener">the app</a> and this help center support Add to Home Screen on iOS and Android — a full-screen icon-launched experience without browser chrome. See <a href="#using-on-mobile" onclick="navigate('using-on-mobile');return false">Using Kaynos on mobile</a>.</dd>
</dl>

<h2>What's not available (yet)</h2>
<ul>
<li><strong>Public API with tokens.</strong> No personal access tokens, no OAuth apps, no third-party API clients. Demand drives the roadmap — let us know via <a href="#feature-requests" onclick="navigate('feature-requests');return false">Feature requests</a>.</li>
<li><strong>Customer-facing webhooks</strong> for real-time events.</li>
<li><strong>SDKs / client libraries.</strong></li>
<li><strong>Calendar event sync.</strong> Google Calendar is free/busy-only; no event push to Google / Apple / Outlook yet.</li>
<li><strong>Slack, Discord, Teams</strong>, or chat-app bridges.</li>
<li><strong>Direct LMS integration</strong> (Canvas, Schoology, etc.).</li>
<li><strong>Public video links or external embeds.</strong> Video plays inside Kaynos accounts only — there are no share links and no download button.</li>
</ul>

<h2>Migrating from another platform</h2>
<p>Moving from a competitor:</p>
<ul>
<li>Export your videos from the source as files (not just URLs) and upload to Kaynos one at a time — the <a href="#uploading" onclick="navigate('uploading');return false">upload flow</a> doesn't import in bulk yet.</li>
<li>Re-build your organization in Kaynos as you go — session types plus consistent titles replace whatever taxonomy the source used.</li>
<li>Hundreds of videos to move? Email ${mailLink()} — we can help.</li>
</ul>

<h2>Backups</h2>
<p>Run the JSON export at the cadence your retention policy requires. Videos stay in Backblaze B2 within the retention window; the export is the metadata/notes/structure snapshot.</p>

<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Have an integration that would make Kaynos work better for you? Submit a <a href="#feature-requests" onclick="navigate('feature-requests');return false">feature request</a> with the specific workflow you'd want — that's how we prioritize.</div></div>`},

    glossary: {
      title: "Glossary", section: "Getting Started",
      content: `
<h1>Glossary</h1>
<p>Key terms used throughout Kaynos and this help center.</p>
<dl>
<div class="glossary-term"><dt>Session</dt><dd>A one-on-one recording assigned to a single student — private lessons, individual review, or competition footage. Only the assigned student, the creator, and admins can see it.</dd></div>
<div class="glossary-term"><dt>Class</dt><dd>An account-wide recording visible to everyone — group sessions, workshops, or shared recordings. All members, coaches, and admins can view classes.</dd></div>
<div class="glossary-term"><dt>Admin</dt><dd>The highest-permission role. Admins can do everything coaches can, plus manage the roster, send invites, change roles, and access the Admin area.</dd></div>
<div class="glossary-term"><dt>Coach</dt><dd>A staff role that can create sessions and classes, upload video, add notes, and view student progress. Coaches can invite students and parents but not other coaches.</dd></div>
<div class="glossary-term"><dt>Student <code>member</code></dt><dd>An end user who watches assigned sessions and all published classes, adds notes, and tracks their own progress. Students can't view other students' private sessions; the one place they can upload video is their own review request.</dd></div>
<div class="glossary-term"><dt>Parent</dt><dd>An optional guardian role linked to one or more students by invite. Parents see their linked students' published sessions; commenting is a per-school setting, off by default.</dd></div>
<div class="glossary-term"><dt>Note</dt><dd>A short text annotation pinned to a specific timestamp on the video timeline. Coaches and students can both create notes; coaches can edit any note.</dd></div>
<div class="glossary-term"><dt>Session type</dt><dd>A category set on each session or class — <code>private</code>, <code>drilling</code>, <code>sparring</code>, <code>comp prep</code>, or <code>class</code> — so list views stay scannable as the library grows.</dd></div>
<div class="glossary-term"><dt>Notebook</dt><dd>A coach's private scratchpad: free-form entries with personal tags and pins, separate from any session. Not visible to students.</dd></div>
<div class="glossary-term"><dt>Progress</dt><dd>A lightweight tracker that records playback position (for resume), completion status, and last-viewed time. Coaches see completion across their students; no invasive analytics.</dd></div>
<div class="glossary-term"><dt>Clip</dt><dd>One of several videos attached to the same session or class — extra angles, separate attempts, or sparring rounds. The player's clip rail switches between them; notes attach to the clip that was playing.</dd></div>
<div class="glossary-term"><dt>Review Request</dt><dd>A student-initiated request for a coach to review a video. The student picks a coach, adds context, and uploads to a draft session. The coach accepts or declines from their dashboard.</dd></div>
<div class="glossary-term"><dt>Highlight</dt><dd>A time-range bookmark on the video timeline, marking a start and end point. Used to call attention to a segment worth reviewing.</dd></div>
<div class="glossary-term"><dt>Annotation</dt><dd>A drawing overlay on a frozen video frame — pen, line, circle, or arrow — attached to a specific timestamp. Appears during playback to highlight technique details.</dd></div>
<div class="glossary-term"><dt>AI review</dt><dd>An optional analysis of a session video that suggests coaching notes from what the model sees (powered by Twelve Labs). Suggestions arrive flagged for coach review before students see them. <strong>Currently switched off platform-wide.</strong></dd></div>
<div class="glossary-term"><dt>Voice note</dt><dd>A recorded spoken note (up to 60 seconds) attached to a timestamp, automatically transcribed so it's readable and searchable.</dd></div>
<div class="glossary-term"><dt>Presigned URL</dt><dd>A short-lived, signed link to a video file in Backblaze B2 storage. Kaynos serves video through presigned URLs rather than a CDN — each request generates a fresh link scoped to that viewer.</dd></div>
</dl>
<h2>BJJ positions and movements</h2>
<p>New to martial arts? Here's what your coach means:</p>
<dl>
<dt>Guard</dt><dd>A position where one person is on their back, legs controlling the other. Many types: closed, half, open, butterfly.</dd>
<dt>Mount</dt><dd>A dominant position with one person sitting on the other's torso — very strong for the top.</dd>
<dt>Side control</dt><dd>A dominant position where one person pins the other from the side, chest-to-chest.</dd>
<dt>Back control</dt><dd>A dominant position behind the opponent, typically with hooks (legs wrapped around the waist).</dd>
<dt>Sweep</dt><dd>A technique to reverse positions — going from bottom (guard) to top.</dd>
<dt>Submission</dt><dd>A technique that forces the opponent to "tap out" — joint locks (armbar, kimura) or chokes (rear naked choke, guillotine, triangle).</dd>
<dt>Takedown</dt><dd>A technique to bring a standing opponent to the ground.</dd>
<dt>Drilling</dt><dd>Repetitive practice of a specific technique with a cooperative partner. Think of it like running drills in basketball.</dd>
<dt>Sparring / rolling</dt><dd>Live practice at varying intensity. "Rolling" is the BJJ term for sparring.</dd>
</dl>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>For role details see <a href="#roles" onclick="navigate('roles');return false">Understanding user roles</a>.</div></div>`},

    troubleshoot: {
      title: "Troubleshooting wizard", section: "Troubleshoot",
      content: `
<h1>Troubleshooting wizard</h1>
<div class="tldr"><strong>TLDR:</strong> Use the wizard below to diagnose your issue step by step. For a flat reference of every error message and how to fix it, see <a href="#errors" onclick="navigate('errors');return false">Error reference</a>.</div>
<p>Answer a few questions and we'll point you to the right fix.</p>
<div id="wizardContainer"></div>
<details><summary>Error code lookup</summary>
<p>Paste the error message or describe what you see, and we'll find the relevant help.</p>
<div class="error-lookup">
  <input class="error-input" id="errorInput" placeholder="e.g. 403, cannot be played, black screen..." oninput="lookupError(this.value)" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="search" enterkeyhint="search" aria-label="Paste error message or describe issue">
  <div class="error-results" id="errorResults"></div>
</div>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Can't find your error? Email ${mailLink()} with a screenshot and we'll help.</div></div>
</details>
<details><summary>Browser compatibility check</summary>
<p>Kaynos works in any modern browser. Here's what yours looks like:</p>
<div id="browserResult"></div>
<h2>Recommended browsers</h2>
<div class="shortcut-grid">
  <div class="shortcut-card"><span>Chrome (recommended)</span><span style="color:var(--success)">${IC.check} Full support</span></div>
  <div class="shortcut-card"><span>Firefox</span><span style="color:var(--success)">${IC.check} Full support</span></div>
  <div class="shortcut-card"><span>Safari</span><span style="color:var(--warning)">${IC.warn} Good (use MP4 with H.264 for best compatibility)</span></div>
  <div class="shortcut-card"><span>Edge</span><span style="color:var(--success)">${IC.check} Full support</span></div>
</div>
<h2>If something doesn't work</h2>
<ol>
<li>Try Chrome — it has the broadest codec and feature support</li>
<li>Hard refresh: <kbd>Ctrl+Shift+R</kbd> (Windows/Linux) or <kbd>Cmd+Shift+R</kbd> (Mac)</li>

</ol>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>More troubleshooting: <a href="#performance" onclick="navigate('performance');return false">Performance and loading</a></div></div>
</details>`},

    errors: {
      title: "Error reference", section: "Troubleshoot",
      content: `
<h1>Error reference</h1>
<div class="tldr"><strong>TLDR:</strong> Common errors, what they mean, and what to try first. For something not listed here, the <a href="#troubleshoot" onclick="navigate('troubleshoot');return false">troubleshooting wizard</a> walks step-by-step, or email ${mailLink()}.</div>

<h2>Sign-in errors</h2>
<dl>
<dt>Invalid email or password</dt>
<dd>The email or password didn't match. Check Caps Lock; paste the password to bypass typos. If you signed up with Google, click <strong>Sign in with Google</strong> rather than entering a password.</dd>
<dt>Too many attempts (HTTP 429)</dt>
<dd>Failed sign-ins escalate: 3 failures adds a CAPTCHA, 6 failures blocks that connection for ~15 minutes. On a corporate network where several people retry at once, the limit can trip — wait it out or try a different network. Reset your password if you're not sure of it.</dd>
<dt>Account suspended</dt>
<dd>The school's subscription is past due or canceled. The admin updates billing — see <a href="#billing" onclick="navigate('billing');return false">Billing &amp; subscription</a>.</dd>
</dl>

<h2>Upload errors</h2>
<dl>
<dt>"Please select a video file"</dt>
<dd>File type isn't supported. Convert to MP4 (H.264 video + AAC audio). Free tools: <a href="https://handbrake.fr" target="_blank" rel="noopener">HandBrake</a> or <a href="https://www.videolan.org/vlc/" target="_blank" rel="noopener">VLC</a>.</dd>
<dt>File too big (5 GB limit)</dt>
<dd>Trim the clip or re-export at 1080p H.264. Most coaching content fits comfortably under 5 GB at 1080p30.</dd>
<dt>Part upload failed: 403</dt>
<dd>The signed upload URL expired (URLs last 6 hours). The app detects this and asks you to start over with the original file. Most common when an upload sat paused for many hours.</dd>
<dt>Storage or video limit reached</dt>
<dd>Your school hit its storage (default 50 GB) or video count (default 100) quota. Delete old videos to free space, or an admin can request an increase — see <a href="#storage" onclick="navigate('storage');return false">Video storage and retention</a>.</dd>
<dt>500 server error during upload</dt>
<dd>Transient issue on our side. Cancel and retry. If it persists, email ${mailLink()} with the file size and the step it failed at.</dd>
<dt>Upload stuck at the same percent</dt>
<dd>A chunk is silently failing to retry. Cancel and re-upload. If your connection is unstable, switch to wired.</dd>
<dt>Status stuck on "uploading"</dt>
<dd>The browser closed mid-upload and the session didn't clean itself up. Email ${mailLink()} with the session name; we'll reset the status.</dd>
</dl>

<h2>Playback errors</h2>
<dl>
<dt>"This video cannot be played"</dt>
<dd>Codec mismatch — usually MKV or an unusual audio codec. Try a different browser, or re-export to MP4 with H.264 video and AAC audio.</dd>
<dt>Black screen with audio (or audio with no video)</dt>
<dd>Codec mismatch on one of the tracks. Re-export as standard MP4 H.264/AAC and re-upload.</dd>
<dt>Long buffering or stuttering</dt>
<dd>Check bandwidth (download speed). Very high-bitrate 4K sources can stutter on standard home networks — a 1080p H.264 export plays more reliably.</dd>
<dt>403 / "not authorized to view this video"</dt>
<dd>The playback URL expired (4-hour limit) or your role changed. Refresh the page; the player generates a fresh presigned link.</dd>
<dt>"This video has expired and is no longer available for playback" (410)</dt>
<dd>The video passed your school's retention window (default 6 months) and was removed. The session and its notes remain. See <a href="#storage" onclick="navigate('storage');return false">Video storage and retention</a>.</dd>
</dl>

<h2>Recording / camera errors</h2>
<dl>
<dt>"Camera permission denied"</dt>
<dd>iOS Safari: Settings → Safari → Camera → set Kaynos to Allow. Android Chrome: tap the lock icon in the address bar → Permissions → Camera → Allow.</dd>
<dt>"Microphone permission denied"</dt>
<dd>Same path as camera. Required for voice notes; not required for video upload.</dd>
<dt>"Could not access camera"</dt>
<dd>Another app or tab is holding the camera (FaceTime, Zoom, another open browser window). Close them, refresh, and try again.</dd>
</dl>

<h2>Payment errors</h2>
<dl>
<dt>"Your card was declined"</dt>
<dd>Stripe rejected the charge. Common reasons: expired card, insufficient funds, fraud-check from the issuing bank, or a country mismatch. Try a different card or contact your bank. Full detail in Profile → Billing → Manage.</dd>
<dt>"This card requires authentication" (3DS)</dt>
<dd>European cards trigger Strong Customer Authentication. Complete the bank prompt; Stripe retries automatically.</dd>
<dt>Subscription past due</dt>
<dd>One or more charges failed and the retry window has elapsed. Update your card in Profile → Billing → Manage. The account un-pauses on the next successful charge.</dd>
</dl>

<h2>Email errors</h2>
<dl>
<dt>Invite email never arrives</dt>
<dd>See <a href="#email-issues" onclick="navigate('email-issues');return false">Email and notification issues</a>. Usually: spam folder, address typo, or a corporate filter.</dd>
<dt>Password reset link expired</dt>
<dd>Reset links are valid for 1 hour. Request a new one from the login page (<strong>Forgot password?</strong>) or ask an admin to issue a manual reset.</dd>
<dt>Email change verification expired</dt>
<dd>Verification links live 24 hours. Re-request from Profile → Email → Send verification.</dd>
</dl>

<h2>Generic errors</h2>
<dl>
<dt>"Something went wrong"</dt>
<dd>Transient client-side error. Refresh once. If it persists, screenshot what you clicked and email ${mailLink()}.</dd>
<dt>Red error banner across the top</dt>
<dd>A network request failed. Check your internet, refresh, and retry. Persistent? <a href="https://www.netlifystatus.com/" target="_blank" rel="noopener noreferrer">netlifystatus.com</a> covers the hosting status; for the app itself, email ${mailLink()}.</dd>
</dl>

<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>If you have a specific code or message, paste it into the <a href="#troubleshoot" onclick="navigate('troubleshoot');return false">error code lookup</a> on Troubleshoot — same content, indexed for fast filtering.</div></div>`},

  </div>

    <label for="cfSubject">Subject <span class="required">*</span></label>

  </div>

    "release-notes": {
      title: "Release notes", section: "",
      content: `

</ul>

<li>Admin Remove button on student profile pages — a shortcut for taking a student off the roster without going back to the list.</li>
<li>Faster phone-clip uploads: chunked multipart now kicks in at 20 MB with parallel presigning.</li>
</ul>
<h3>April 2026</h3>
<ul>
<li>AI review (powered by Twelve Labs): video analysis that suggests coaching notes you can edit, keep, or delete. <em>(Temporarily disabled as of June 2026.)</em></li>

    "student-guide": {
      title: "Student guide", section: "",
      content: `
<h1>Student guide</h1>
<div class="tldr"><strong>TLDR:</strong> Sign in at <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>. Watch sessions assigned to you, watch class recordings, leave notes, ask for review. Everything is private to your academy.</div>

<p>This page is written for students — the people watching, learning, and getting reviewed. If you're a coach or admin, the <a href="#coach-handbook" onclick="navigate('coach-handbook');return false">coach handbook</a> or the <a href="#managing-members" onclick="navigate('managing-members');return false">admin pages</a> are a better fit.</p>

<h2>First sign-in</h2>
<ol>
<li>Open the welcome email from your coach. The temporary password is there.</li>
<li>Go to <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> and sign in.</li>
<li>Change the password under <a href="#profile" onclick="navigate('profile');return false">Profile</a>. Make it something only you know.</li>
</ol>

<h2>What's on your dashboard</h2>
<ul>
<li><strong>Sessions</strong> — private one-on-one recordings between you and a coach. Some hold several videos — switch between them in the player's clip rail.</li>
<li><strong>Classes</strong> — recordings shared with everyone in the academy.</li>
<li><strong>Notifications</strong> (bell icon, top of header) — opens when a coach leaves a note or replies to a thread.</li>
</ul>

<h2>Watching a session or class</h2>
<p>Click into one to open the player. Notes show up as markers on the timeline — hover (or tap on phone) to preview, click to jump. Use <kbd>Space</kbd> to play/pause, <kbd>J</kbd>/<kbd>L</kbd> to skip 10s. Full controls on <a href="#playback" onclick="navigate('playback');return false">Watching and reviewing</a>.</p>

<h2>Asking for review</h2>
<p>If you recorded yourself and want a coach to look at it:</p>
<ol>
<li>Click <strong>Request a review</strong> on your dashboard.</li>
<li>Pick a coach. Add a sentence on what you want feedback on ("technique on the closed-guard sweep — it feels off and I can't tell why").</li>
<li>Upload the video to the draft session that's created.</li>
<li>Submit. The coach gets an email.</li>
</ol>
<p>You'll get an email back when the coach responds. If they decline, the request stays in your history; if it sits unanswered, mention it to the coach at training or submit a new request to a different coach.</p>

<h2>Leaving notes</h2>
<p>While watching anything shared with you — your own session or a class — pause and click <strong>Add Note</strong>. Notes pin to the exact timestamp. Type a question for your coach, a reminder to yourself, whatever.</p>
<p>Mention a teammate or coach with <strong>@name</strong> — they get an email with a link to that specific moment.</p>

<h2>Tuning notifications</h2>
<p>Profile → Notifications. Three categories:</p>
<ul>
<li><strong>New sessions</strong> — when a coach creates a session for you.</li>
<li><strong>Class recordings</strong> — when a class recording is posted.</li>
<li><strong>Notes from instructors</strong> — when a coach adds a note on one of your sessions.</li>
</ul>
<p>Each one toggles independently. Password resets and invites always send regardless.</p>

<h2>What you can't do (by design)</h2>
<ul>
<li>Upload class recordings (only coaches/admins).</li>
<li>See other students' private sessions.</li>
<li>Invite people to the academy.</li>
<li>Change the academy logo or settings.</li>
</ul>
<p>You can always upload to your own session via a review request, and you can take notes on anything shared with you.</p>

<h2>On your phone</h2>
<p>Open <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in your phone's browser — no separate app to install. Or add it to your home screen (Share → Add to Home Screen on iOS; browser menu → Add to Home Screen on Android) for an app-like icon. See <a href="#using-on-mobile" onclick="navigate('using-on-mobile');return false">Using Kaynos on mobile</a>.</p>

<h2>Privacy</h2>
<p>Everything you do — recordings, notes, replies — is visible only inside your academy. Nothing is public. Full description on <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">Privacy on this site</a>, or the <a href="#parent-guide" onclick="navigate('parent-guide');return false">parent guide</a> for a less technical version.</p>

<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Stuck on something specific? The <a href="#faq" onclick="navigate('faq');return false">FAQ</a> answers most common questions, the <a href="#troubleshoot" onclick="navigate('troubleshoot');return false">troubleshooting wizard</a> walks fixes step-by-step, and ${mailLink()} reaches a human.</div></div>`},

    "parent-guide": {
      title: "Parent guide", section: "",
      content: `
<h1>Parent &amp; guardian guide</h1>
<div class="tldr"><strong>TLDR:</strong> Your child has a student account in Kaynos managed by their coach. They can watch recorded sessions and classes, read coaching notes, and request reviews. Coaches can also invite you to a <strong>parent account</strong> so you can see your child's published sessions yourself. All videos are private to the school — nothing is public.</div>
<p>This guide is for parents and guardians whose children train at an academy using Kaynos. You don't need any background in martial arts or the app — this page covers your child's experience and answers common questions. For the student's-eye view of the app itself, the <a href="#student-guide" onclick="navigate('student-guide');return false">student guide</a> walks through the actual screens.</p>

<h2>How your child's account works</h2>
<p>Your child's coach or academy admin creates and manages their student account.</p>
<ul>
<li>Your child logs in at <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> with credentials provided by the academy.</li>
<li>The coach or admin controls what content is available to students.</li>
<li>To see what your child sees, ask the academy for a parent account (below) — or ask the coach to walk you through it.</li>
</ul>

<h2>Parent accounts</h2>
<p>Kaynos has a dedicated <strong>parent role</strong>. A coach or admin sends an invite to your email; the link is valid for 14 days. You set your own password, and from then on you can sign in and watch your child's <strong>published</strong> sessions — the recordings and feedback the coach has shared with them.</p>
<ul>
<li>One parent login can be linked to more than one child at the same academy.</li>
<li>Parents view; they don't upload video or manage the account. Whether parents can comment on coaching notes is a setting each school chooses (off by default).</li>
<li>The academy can unlink a parent account at any time — access is always under the school's control.</li>
</ul>
<p>Ask your child's coach or the academy admin to send a parent invite if you'd like one.</p>

<h2>What your child can see and do</h2>
<ul>
<li><strong>Sessions:</strong> Private one-on-one recordings between your child and their coach. Only the coach, your child, and linked parents can view these once published.</li>
<li><strong>Classes:</strong> Group class recordings shared with students in the academy. Think of these as class replays your child can re-watch to practice at home.</li>
<li><strong>Notes:</strong> Timestamped coaching feedback attached to specific moments in a video. Your child can click a note to jump to that exact point in the recording.</li>
<li><strong>Review requests:</strong> Your child can upload a video and ask their coach for feedback on it.</li>
</ul>

<h2>Understanding the sport</h2>
<p>If your child trains Brazilian Jiu-Jitsu (BJJ) or another martial art, some terminology in coaching notes may be unfamiliar. Common terms:</p>
<ul>
<li><strong>Guard:</strong> A position where a person is on their back, using their legs to control or defend against the person on top.</li>
<li><strong>Mount:</strong> A dominant position where one person sits on top of the other's torso.</li>
<li><strong>Sweep:</strong> A technique used from the bottom to reverse positions and end up on top.</li>
<li><strong>Submission:</strong> A hold or lock (like an armbar or choke) that forces the opponent to "tap out" and concede.</li>
<li><strong>Rolling / sparring:</strong> Live practice with a partner, applying techniques at varying intensity.</li>
<li><strong>Drilling:</strong> Practicing a single technique repeatedly with a cooperative partner to build muscle memory.</li>
</ul>
<p>For a more complete list, see our <a href="#glossary" onclick="navigate('glossary');return false">glossary of BJJ terms</a> — written for people who don't train.</p>

<h2>Privacy and safety</h2>
<p>Video recordings of children require careful handling. How Kaynos protects your child's data:</p>
<ul>
<li><strong>Videos are private:</strong> Only people within your academy's Kaynos account can see recordings. Nothing is posted publicly or shared outside the school.</li>
<li><strong>Secure storage:</strong> Video is stored securely in the US (Backblaze B2) and delivered over encrypted connections (HTTPS).</li>
<li><strong>Links expire:</strong> Playback links are temporary and cannot be shared with or bookmarked by outsiders.</li>
<li><strong>No public profiles:</strong> Students do not have public-facing profiles, pages, or any content visible outside their academy.</li>
</ul>
<p>For the full privacy policy, see <a href="https://app.kaynos.net/privacy" target="_blank" rel="noopener">app.kaynos.net/privacy</a>. For details on COPPA and FERPA compliance, see <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">Privacy on this site</a>.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div><strong>Data requests:</strong> Parents can request access to or deletion of their child's data at any time. Email ${mailLink()} or ask your child's coach to connect you with academy administration.</div></div>

<h2>Questions or concerns?</h2>
<p>Beyond the parent account, the best way to stay informed is to talk to your child's coach or academy admin. They can:</p>
<ul>
<li>Show you what your child has been working on</li>
<li>Explain any coaching notes or feedback</li>
<li>Answer questions about class content or training</li>
<li>Help with any account or access issues</li>
</ul>
<p>You can also email ${mailLink()} with questions about Kaynos itself — privacy, data handling, or how the platform works.</p>
<p>For common questions, see the <a href="#faq" onclick="navigate('faq');return false">FAQ</a>.</p>`},

    "data-rights": {
      title: "Data & privacy rights", section: "Account",
      content: `
<h1>Data &amp; privacy rights</h1>
<div class="tldr"><strong>TLDR:</strong> Export, correct, or delete your data — from Profile or via ${mailLink()}. Verified formal requests are completed within 30 days. Parents act on a minor's behalf.</div>

<h2>What you can do yourself</h2>
<dl>
<dt>Export</dt>
<dd>Admins: <strong>Admin → Reports &amp; Exports</strong> for school data (JSON) or members (CSV). Individuals: request a personal data export from your profile — a download link (valid 7 days) is emailed when it's ready.</dd>
<dt>Correct</dt>
<dd>Profile → name, email, password. Coaches edit their own notes; admins can edit any.</dd>
<dt>Delete (your account)</dt>
<dd>Profile → schedule account deletion. Your access ends immediately and data is permanently removed after a <strong>30-day grace period</strong>; the confirmation email has a one-time cancel link. School admins delete the whole school from <strong>Admin → Danger Zone</strong> (also a 30-day grace, then permanent).</dd>
<dt>Opt out</dt>
<dd>Profile → Notifications toggles email categories off. Voice notes only record when you hold the mic button (browser permission required). AI video analysis is consent-based per user — and is currently switched off platform-wide regardless.</dd>
</dl>

<h2>What requires a request</h2>
<p>For anything we can't expose in the UI — full data subject access, certain corrections beyond what's editable, custom retention windows, or a copy of the operational logs touching your account — email ${mailLink()} from the address on file.</p>
<p>Include:</p>
<ul>
<li>The request type (access, deletion, correction, restriction, portability).</li>
<li>If you're acting on behalf of someone else (a parent/guardian for a minor; a school employee with delegated authority), describe the relationship.</li>
<li>For state-specific rights (CCPA/CPRA, VCDPA, CPA, CTDPA), the state you reside in.</li>
</ul>
<p>We acknowledge within 5 business days and complete verified requests within 30 days. If a request is unusually large we'll tell you up front, and we won't charge a fee for a reasonable first request.</p>

<h2>For parents / guardians of minors</h2>
<p>Kaynos isn't designed for direct use by children under 13 (COPPA) or under 16 in the EU (GDPR Article 8). When a school enrolls a minor, the school holds the consent obligation. As a parent:</p>
<ul>
<li>Request review, correction, or deletion of your child's data by emailing ${mailLink()} — we'll verify your relationship before acting.</li>
<li>You can also ask the academy directly; they have the same access via the admin panel.</li>
<li>For the day-to-day side, see the <a href="#parent-guide" onclick="navigate('parent-guide');return false">Parent &amp; guardian guide</a>.</li>
</ul>

<h2>For schools (FERPA)</h2>
<p>If you're a school or academic institution using Kaynos for graded performance review, FERPA may apply. We provide a FERPA-compliant Data Processing Agreement (DPA) on request — email ${mailLink()} from your administrative address.</p>

<h2>Data Processing Agreement (DPA)</h2>
<p>Available for any business customer who needs one — schools, gyms, training facilities, EU customers. Standard DPA with Standard Contractual Clauses for EU transfers. Email ${mailLink()} to start.</p>

<h2>Breach notification</h2>
<p>If a security incident is likely to put your rights or data at risk, you'll receive an email within 72 hours of confirmed discovery (sooner where we can). The notice covers what was affected, what's being done about it, and what you can do.</p>

<h2>Where the rest lives</h2>
<p>Full data-handling description, third-party subprocessor list, retention schedules, and compliance framework mappings (CCPA, CPRA, VCDPA, COPPA, FERPA, NY SHIELD, MA 201 CMR 17.00) are on <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">Privacy on this site</a>.</p>`},

    "privacy-on-this-site": {
      title: "Privacy on this site", section: "",
      content: `
<h1>Privacy on this site</h1>
<div class="tldr"><strong>TLDR:</strong> The help center stores a few preferences in your browser, makes no external requests during browsing, and never tracks you. The Kaynos application itself has its own <a href="https://app.kaynos.net/privacy" target="_blank" rel="noopener">privacy policy</a>; what's below covers both, with compliance frameworks (COPPA, FERPA, CCPA, etc.) collapsed under "Compliance frameworks".</div>

<h2>What stays in your browser</h2>
<p>We use <code>localStorage</code> and <code>sessionStorage</code> to remember your preferences. This data never leaves your device.</p>
<table class="comparison-table">
<thead><tr><th scope="col">Key</th><th scope="col">Purpose</th><th scope="col">Storage</th></tr></thead>
<tbody>
<tr><td>theme</td><td>Dark/light mode preference</td><td>localStorage</td></tr>
<tr><td>lang</td><td>Language preference (EN/ES)</td><td>localStorage</td></tr>
<tr><td>recent-pages</td><td>Recently viewed pages</td><td>localStorage</td></tr>
<tr><td>search-history</td><td>Recent search terms</td><td>localStorage</td></tr>
<tr><td>poll-votes, poll-voted, poll-custom</td><td>Feature poll votes (legacy, no longer used)</td><td>localStorage</td></tr>
<tr><td>highlights</td><td>Text highlights you've made</td><td>localStorage</td></tr>
<tr><td>scroll-pos</td><td>Scroll position per page</td><td>localStorage</td></tr>
<tr><td>sb-expanded</td><td>Which sidebar sections you've explicitly opened (default is collapsed)</td><td>localStorage</td></tr>
</tbody>
</table>

<h2>What is sent externally</h2>
<p>No analytics, tracking pixels, or cookies are used. The <strong>Contact support</strong> and <strong>Feature request</strong> forms — and the "Was this helpful?" article-feedback box — send what you type (and the email you provide, if any) to our support ticket system. That's the only time this site transmits anything you enter; if the send fails, feedback falls back to a <code>mailto:</code> link your own email client sends.</p>
<p>Fonts are self-hosted. No other external requests after the initial page load, except when you click external links.</p>
<div class="hint hint-info"><div class="hint-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r=".5" fill="currentColor"/></svg></div><div>This page describes the help center at docs.kaynos.net. The application has its own policy at <a href="https://app.kaynos.net/privacy" target="_blank" rel="noopener">app.kaynos.net/privacy</a>; sections below also cover the application.</div></div>

<h2>Third-party processors (the application)</h2>
<table class="comparison-table">
<thead><tr><th scope="col">Service</th><th scope="col">Purpose</th><th scope="col">Data</th></tr></thead>
<tbody>
<tr><td>Backblaze B2</td><td>Video storage and playback (via presigned URLs)</td><td>Uploaded video files (encrypted at rest)</td></tr>
<tr><td>Stripe</td><td>Payment processing</td><td>Billing name, email (not card numbers)</td></tr>
<tr><td>Resend</td><td>Transactional email delivery (invites, password resets, mention notifications, reports)</td><td>Recipient email addresses, message subject and body</td></tr>
<tr><td>Twelve Labs</td><td>AI video understanding for the optional AI review feature (currently disabled platform-wide)</td><td>Video file URLs (presigned) and the visual content the model analyzes</td></tr>
<tr><td>Deepgram</td><td>Transcription of voice notes and class videos. Deepgram processes audio in real time and doesn't keep it; the voice note itself is stored with your account data in Kaynos.</td><td>Audio for transcription</td></tr>
<tr><td>Twilio</td><td>SMS notifications for private-lesson booking</td><td>Phone numbers, message content</td></tr>
<tr><td>Google</td><td>Optional calendar connection (coaches) for free/busy availability; Google sign-in</td><td>Calendar free/busy times, Google account email</td></tr>
<tr><td>Neon</td><td>PostgreSQL database hosting</td><td>All structured account data (members, sessions, notes, etc.)</td></tr>
<tr><td>Netlify</td><td>Application hosting and serverless functions</td><td>Application requests, server logs</td></tr>
</tbody>
</table>
<p>All processors have signed Data Processing Agreements. Kaynos never sells your data.</p>

<h2>Data collection justification</h2>
<table class="comparison-table">
<thead><tr><th scope="col">Data</th><th scope="col">Purpose</th><th scope="col">Retention</th></tr></thead>
<tbody>
<tr><td>Name, email</td><td>Account identity, notifications</td><td>Until account deletion</td></tr>
<tr><td>Password (hashed)</td><td>Authentication</td><td>Until account deletion</td></tr>
<tr><td>Video recordings</td><td>Core coaching service</td><td>6 months default (configurable per school on request)</td></tr>
<tr><td>Coaching notes</td><td>Timestamped feedback</td><td>With associated session/class</td></tr>
<tr><td>Progress data</td><td>Resume playback, completion tracking</td><td>With associated session/class</td></tr>
<tr><td>IP address, browser</td><td>Security, rate limiting</td><td>90 days</td></tr>
<tr><td>Payment metadata</td><td>Billing (via Stripe — no card numbers)</td><td>Per Stripe retention policy</td></tr>
</tbody>
</table>

<h2>Security standards</h2>
<ul>
<li>Encryption in transit: TLS 1.2+ (HTTPS everywhere)</li>
<li>Encryption at rest: AES-256 for stored video</li>
<li>Passwords: bcrypt hashed (not reversible)</li>
<li>Role-based access controls enforced at API and database level</li>
<li>Playback URLs: time-limited and signed</li>
<li>Payment: PCI-DSS compliant via Stripe (Kaynos never handles card numbers)</li>
<li>Written information security program maintained (also covers NY SHIELD and MA 201 CMR 17.00 baselines)</li>
<li>72-hour breach notification protocol</li>
<li>Vendor security assessments conducted</li>
</ul>

<h2>Your rights</h2>
<p>Regardless of your state or country, you can:</p>
<ul>
<li>Access your data (Admin → Export or email support)</li>
<li>Correct inaccurate information (Profile settings)</li>
<li>Delete your account (Profile → Delete Account)</li>
<li>Opt out of optional features (voice notes, email notifications)</li>
</ul>
<p>Exercising your privacy rights will not result in service degradation, higher prices, or reduced functionality. Step-by-step flows for every action — including parent-on-behalf requests, DPA requests, and breach notification — are on <a href="#data-rights" onclick="navigate('data-rights');return false">Data &amp; privacy rights</a>.</p>

<h2>Biometric data</h2>
<p>Video recordings may contain biometric identifiers (faces, body structure). Kaynos does <strong>not</strong> perform facial recognition, age detection, gait analysis, or automated biometric processing. Video is stored and delivered as-is for coaching review only.</p>
<p>Biometric data in video follows the same retention period as the video itself (default 6 months). You may request earlier deletion by contacting support.</p>

<h2>Data breach notification</h2>
<p>If a security breach is likely to put your personal data at risk, we will notify you via email within 72 hours of discovery (sooner where we can). Notification will include: what data was affected, what we're doing about it, and steps you can take.</p>

<h2>Law enforcement requests</h2>
<p>Kaynos discloses user data only in response to valid legal process (subpoena, court order, or warrant). We notify affected users unless legally prohibited from doing so.</p>

<h2>Record-keeping</h2>
<p>Kaynos maintains records of all consumer privacy requests (access, deletion, correction) for 24 months per CCPA/CPRA requirements.</p>

<h2>Compliance frameworks</h2>
<p>Specific frameworks Kaynos aligns with. To exercise rights under any of them, email ${mailLink()} with your name, email, request type, and (for state-specific rights) which state you reside in. Verified requests are completed within 30 days.</p>

<h3>COPPA — children under 13</h3>
<p>Kaynos is not designed for direct use by children under 13. If your organization enrolls students under 13:</p>
<ul>
<li>Obtain verifiable parental consent before creating the student's account.</li>
<li>Ensure a parent email is registered so they can access their child's data.</li>
<li>Parents can request review or deletion of their child's data by emailing ${mailLink()}.</li>
</ul>

<h3>FERPA — schools</h3>
<p>If your school or academy uses Kaynos for student records (performance videos tied to grades or evaluations), FERPA may apply.</p>
<ul>
<li>Kaynos provides a FERPA-compliant Data Processing Agreement (DPA) upon request — email ${mailLink()}.</li>
<li>Admin and coach roles function as "school officials" with access limited to assigned students.</li>
<li>Parents and eligible students (18+) may request access to or deletion of education records.</li>
</ul>

<h3>California — CCPA / CPRA</h3>
<p>California residents have specific rights under the California Consumer Privacy Act:</p>
<ul>
<li><strong>Right to know</strong> what personal information is collected, used, and shared.</li>
<li><strong>Right to delete</strong> personal information (with limited exceptions).</li>
<li><strong>Right to correct</strong> inaccurate information.</li>
<li><strong>Right to opt-out</strong> of data sale or sharing. <em>Kaynos does not sell or share personal information with third parties for marketing.</em></li>
<li><strong>Right to non-discrimination</strong> for exercising these rights.</li>
</ul>
<p><strong>Data categories collected:</strong> identifiers (name, email), video recordings, professional information (role), internet activity (IP, browser, login times). <strong>Retention:</strong> account data until deletion; videos for 6 months (configurable); login/session data for 90 days.</p>

<h3>California — Age-Appropriate Design Code (CAADCA)</h3>
<p>Kaynos enforces privacy-protective defaults for users under 18:</p>
<ul>
<li>No invasive analytics or behavioral profiling</li>
<li>No targeted advertising</li>
<li>Opt-in only for audio processing (voice notes)</li>
<li>No dark patterns in consent flows</li>
<li>Parental consent required for users under 13 (COPPA)</li>
</ul>

<h3>Other US state privacy laws</h3>
<p>Kaynos complies with applicable state consumer privacy laws including Virginia (VCDPA), Colorado (CPA), Connecticut (CTDPA), Utah (UCPA), Texas (TDPSA), Montana, Iowa, Tennessee, Indiana, Oregon, Delaware, and others. Common rights across all states:</p>
<ul>
<li>Access, correct, and delete your personal data</li>
<li>Opt out of targeted advertising and data sale (Kaynos does neither)</li>
<li>Data portability (Admin → Export)</li>
<li>Non-discrimination for exercising rights</li>
</ul>

<h3>Student privacy — SOPIPA, NY Education Law 2-d</h3>
<p>For K-12 schools and educational institutions:</p>
<ul>
<li>Kaynos does not sell student personal information (SOPIPA compliance).</li>
<li>Kaynos does not share student data with third parties for marketing.</li>
<li>Student and parent access/deletion rights are supported.</li>
<li>Data security practices align with NY Education Law 2-d requirements.</li>
</ul>

<h3>State security laws — NY SHIELD, MA 201 CMR 17.00</h3>
<p>The Security standards section above (encryption, RBAC, incident response, vendor assessments) is the same baseline that satisfies NY SHIELD's "reasonable safeguards" and Massachusetts 201 CMR 17.00's written information security program requirement.</p>

<h3>Accessibility — ADA / Section 508</h3>
<p>Kaynos is built to WCAG 2.1 AA standards. Features include keyboard navigation, screen reader support, skip links, focus management, and prefers-reduced-motion support. For a detailed accessibility report (VPAT), contact ${mailLink()}.</p>`},

    "ai-inbox": {
      title: "AI inbox & bulk actions", section: "Sessions & Classes",
      content: `
<h1>AI inbox</h1>
<div class="tldr"><strong>TLDR:</strong> AI-generated note suggestions queue in your AI inbox. Accept the keepers, dismiss the rest — one at a time, or in bulk. Nothing is added to a student's timeline until you accept it.</div>
<div class="hint hint-warning"><div class="hint-icon">${IC.warn}</div><div><strong>AI review is currently disabled platform-wide</strong>, so the AI Inbox won't appear in the app right now. This page documents how it works for when it returns — watch the <a href="#release-notes" onclick="navigate('release-notes');return false">release notes</a> for status.</div></div>
<h2>Where it lives</h2>
<p>Coaches and admins see <strong>AI Inbox</strong> in the top-level nav after the first AI review completes. The badge count shows pending suggestions across every session and class you can review.</p>
<h2>What it shows</h2>
<ul>
<li>Each row is one AI-suggested note tied to a specific clip and timestamp.</li>
<li>The source pill on each row tells you which model generated it (e.g. <em>Pegasus 1.5</em>) so you can sanity-check the suggestion against the model's strengths.</li>
<li>Filters: status (pending / accepted / dismissed), scrutiny level used (minimal / balanced / thorough), session vs class, and the date range.</li>
</ul>
<h2>Single-row actions</h2>
<p>Open a suggestion to see the surrounding context (a few seconds before and after the timestamp). From there:</p>
<ul>
<li><strong>Accept</strong> — the suggestion becomes a normal note on the student's timeline, tagged "AI suggestion". You can edit the text before or after accepting.</li>
<li><strong>Dismiss</strong> — the suggestion is hidden from the inbox and never appears on the timeline. Students never see dismissed suggestions.</li>
</ul>
<h2>Bulk actions</h2>
<p>Use the checkboxes on the left of each row to multi-select. The bulk bar appears at the top once you have at least one row selected.</p>
<ol>
<li><strong>Select all on this page</strong> — checkbox in the column header. Pagination is preserved (changing pages doesn't clear the selection).</li>
<li><strong>Bulk accept</strong> — writes every selected suggestion to its student's timeline in one pass. The inbox refreshes when finished.</li>
<li><strong>Bulk dismiss</strong> — clears every selected suggestion. A confirmation modal lists the count and lets you back out before anything is changed.</li>
</ol>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Bulk actions are atomic per row — if one acceptance fails (e.g. the underlying clip was deleted), the rest still go through. Failures stay in the inbox so you can review them.</div></div>
<h2>Tips</h2>
<ul>
<li>Filter by <strong>scrutiny: minimal</strong> first — those rows are timestamp markers with no opinion, easiest to triage. Accept-all is usually safe.</li>
<li>For <strong>thorough</strong> rows (full suggested feedback), open each one before accepting. The AI is a draft, not the verdict.</li>
<li>Empty inbox? Either nothing has been reviewed yet, or you've already triaged everything. The "All caught up" empty state stays dismissed per-clip.</li>
</ul>
<h2>Related</h2>
<ul>
<li><a href="#scrutiny-picker" onclick="navigate('scrutiny-picker');return false">Scrutiny picker (AI review)</a></li>
<li><a href="#notes" onclick="navigate('notes');return false">Notes &amp; timestamps</a></li>
</ul>
`},

    "scrutiny-picker": {
      title: "Scrutiny picker (AI review)", section: "Sessions & Classes",
      content: `
<h1>Scrutiny picker</h1>
<div class="tldr"><strong>TLDR:</strong> Pick how opinionated the AI should be when it reviews a video. Lower scrutiny = fewer suggestions, higher trust threshold. Higher scrutiny = more suggestions, more drafting work for the AI.</div>
<div class="hint hint-warning"><div class="hint-icon">${IC.warn}</div><div><strong>AI review is currently disabled platform-wide</strong>, so <strong>Start AI Review</strong> and this picker won't appear in the app right now. This page documents how it works for when it returns — watch the <a href="#release-notes" onclick="navigate('release-notes');return false">release notes</a> for status.</div></div>
<h2>When you see it</h2>
<p>The scrutiny picker appears when you click <strong>Start AI Review</strong> on a session or class. The default is whatever you set at the school level (Admin → AI review settings); you can override it per session.</p>
<h2>The three levels</h2>
<dl>
<dt>Minimal</dt>
<dd>The AI marks moments it considers significant — no opinion, no suggested feedback. Each suggestion lands in the AI inbox as a blank-bodied note at a timestamp. You write the actual note.</dd>
<dt>Balanced (default)</dt>
<dd>The AI marks moments and adds a one-line observation (e.g. "weight shift forward on the left leg"). You review, edit, and accept or dismiss.</dd>
<dt>Thorough</dt>
<dd>The AI marks moments and drafts full coaching feedback in your voice — including suggested corrections and drills. Always treat as a draft: edit before accepting, especially when the suggestion relies on context the AI can't see.</dd>
</dl>
<h2>How to pick</h2>
<ul>
<li><strong>Tournament footage or long classes</strong> — start with Minimal. You'll get a tight set of timestamps to triage and write your own notes.</li>
<li><strong>Drill review for a focused technique</strong> — Balanced is the sweet spot. The one-line observation usually saves a writing step.</li>
<li><strong>Onboarding a new student or batch-reviewing back catalogue</strong> — Thorough drafts the feedback so you can edit fast instead of writing from scratch. Slowest to triage, fastest end-to-end.</li>
</ul>
<h2>Changing the default</h2>
<p>Admins set the school default at <strong>Admin → AI review settings</strong>. Anyone with coach access can override it per session at start-review time — the override doesn't change the school default.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Scrutiny only affects how the AI <em>writes</em>. The set of moments it flags is largely the same across levels. Higher scrutiny means more text per moment, not more moments.</div></div>
<h2>Cost &amp; quota</h2>
<p>Higher scrutiny uses more tokens per review and may count harder against your AI quota. Watch your monthly usage at <strong>Admin → AI usage</strong>. If you're near the limit, drop to Minimal for the rest of the cycle.</p>
<h2>Related</h2>
<ul>
<li><a href="#ai-inbox" onclick="navigate('ai-inbox');return false">AI inbox &amp; bulk actions</a></li>
<li><a href="#coach-handbook" onclick="navigate('coach-handbook');return false">Coach handbook → AI review</a></li>
</ul>
`},

      title: "Switching between schools", section: "Account",
      content: `
<h1>Switching between schools</h1>
<div class="tldr"><strong>TLDR:</strong> One Kaynos login can belong to several schools. Use the school switcher in the top-right of the app to jump between them. Your role and what you see are scoped to whichever school is active.</div>
<h2>Where it lives</h2>
<p>If your account belongs to two or more schools, the school name in the top header becomes a button. Click it (or press the keyboard shortcut shown in the modal) to open the switcher.</p>
<ul>
<li>Single-school accounts don't see the button — there's nothing to switch to.</li>
<li>The switcher modal lists every school you're a member of, with your role inside each one shown as a small pill.</li>
</ul>
<h2>What changes when you switch</h2>
<ul>
<li><strong>Roster, sessions, classes, notes</strong> — each school is fully isolated. You never see another school's data, even as an admin.</li>
<li><strong>Role</strong> — you can be a student in one school and a coach in another. The active role is whichever school is currently selected.</li>
<li><strong>Quota &amp; billing</strong> — each school has its own storage and AI quotas. Billing is also per-school.</li>
<li><strong>Notifications</strong> — the bell only shows alerts for the active school. Switch to surface another school's alerts.</li>
</ul>
<h2>Joining another school</h2>
<p>You don't add a school from inside the app — someone with admin rights at that school has to <a href="#inviting-members" onclick="navigate('inviting-members');return false">invite you</a>. Accept the invite from the email and the new school appears in your switcher on next sign-in.</p>
<h2>Leaving a school</h2>
<p>Ask an admin of that school to remove you from <strong>Admin → Members</strong>. The school disappears from your switcher; sessions and notes from that school are no longer accessible to you (the school's copy is unaffected).</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Multi-school setup beyond a single account is a <strong>tenant</strong> feature — useful for an organisation running several gyms under one billing umbrella. Tenant admin is a separate role and is not self-service: email ${mailLink()} to set it up.</div></div>
<h2>Related</h2>
<ul>
<li><a href="#managing-members" onclick="navigate('managing-members');return false">Managing members</a></li>
<li><a href="#roles" onclick="navigate('roles');return false">Understanding user roles</a></li>
</ul>
`}

  /* ── SAFE STORAGE ────────────────────────────────────── */
  function safeGet(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch { return fallback; }
  }
  function safeSessionGet(key, fallback) {
    try { return JSON.parse(sessionStorage.getItem(key)) || fallback; }
    catch { return fallback; }

  // Resolve scroll behavior at call time so the user toggling reduced-motion
  // takes effect immediately without a reload.
  function smoothBehavior() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  }
  function safeSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch { /* private browsing or quota exceeded */ }
  }

  /* ── SIDEBAR ─────────────────────────────────────────── */

    // Sidebar sections are collapsed by default. sb-expanded[name] === true

    const expanded = safeGet('sb-expanded', {});
    const recent = getRecent();

      return PAGES[cur] && PAGES[cur].section ? PAGES[cur].section : '';

    const recentHidden = safeGet('recent-hidden', false);

    NAV.forEach((g, i) => {

      const isCollapsed = g.section && !isExpanded;
      html += `<div class="sidebar-section${isCollapsed ? ' collapsed' : ''}" data-section="${g.section || ''}">`;
      if (g.section) html += `<button class="sidebar-section-title" type="button" onclick="toggleSection(this)" aria-expanded="${isExpanded ? 'true' : 'false'}">${sectionIcons[g.section] || ''}${g.section}<span class="chevron" style="margin-left:auto">▼</span></button>`;
