<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>New to the flow? Read <a href="#creating-sessions" onclick="navigate('creating-sessions');return false">Creating a session</a> and <a href="#creating-classes" onclick="navigate('creating-classes');return false">Creating a class</a> first.</div></div>
<ol>
<li>Create a new session or class, then pick <strong>Upload</strong> for the video source.</li>
<li>Drag your file onto the box, or click to choose from Finder / Files.</li>
<li>Watch the progress bar for speed and time remaining.</li>
<li>When the green check appears, fill in title, date, student, and save.</li>
</ol>
<h3>Recording tips</h3>
<ul>
<li><strong>Landscape orientation.</strong> Your TV and your phone both want it.</li>
<li><strong>Camera slightly high</strong> so the full training area is visible, not just lower legs.</li>
<li><strong>Even lighting</strong> makes small details easier to see on review.</li>
</ul>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Setting up a phone or camera for repeated recording? <a href="#recording-setup" onclick="navigate('recording-setup');return false">Recording setup</a> covers tripods, mics, lighting, and settings worth knowing.</div></div>
<h2>Large files</h2>
<p>Files over <strong>20 MB</strong> use chunked multipart upload (<strong>20 MB</strong> per chunk) with parallel connections. Failed parts retry automatically (up to <strong>3 attempts</strong> per chunk) with exponential backoff.</p>
<h2>Requirements</h2>
<ul>
<li>Formats: MP4, MOV, WebM, MKV (convert others before uploading).</li>
<li>Max 5 GB per video.</li>
<li>Coaches and admins upload to any session or class; students can upload only to their own review requests.</li>
</ul>
<h2>During upload</h2>
<p>The UI shows percent complete, current speed, time remaining, plus <strong>Pause</strong> and <strong>Cancel</strong> buttons (pause is available on chunked uploads). If your connection drops, the upload pauses itself and resumes automatically when you're back online.</p>
<h2>Resume an interrupted upload</h2>
<p>Chunked uploads are resumable — progress is saved on your device. If the page reloads or the browser closes mid-upload, reopen the same session or class and select the <strong>same file</strong>: the upload picks up from the last completed chunk instead of starting over. If the saved upload has expired on the server, the app tells you to start over with the original file.</p>
<h2>Replace a video</h2>
<p>There's no in-place "replace" — sessions and classes support <a href="#creating-sessions" onclick="navigate('creating-sessions');return false">multiple videos</a>, so the usual fix is to upload the corrected take as another video and delete the bad one from the clip rail.</p>
<div class="hint hint-danger"><div class="hint-icon">${IC.danger}</div><div><strong>Deleting a video is destructive.</strong> The file is removed from storage with no undo, and notes attached to that video go with it — they don't migrate to other videos in the session. Copy any notes you want to keep before deleting.</div></div>
<details><summary>Upload troubleshooting</summary>
<h2>Video upload problems</h2>
<p>Large uploads depend on stable internet and a supported format. Work through the checks below before assuming a bug.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Reference: <a href="#formats" onclick="navigate('formats');return false">Supported formats and limits</a>.</div></div>
<h3>Fails immediately</h3>
<p><strong>"Please select a video file":</strong> the file isn't MP4, MOV, WebM, or MKV. Convert to MP4 with <a href="https://handbrake.fr" target="_blank" rel="noopener">HandBrake</a> or <a href="https://www.videolan.org/vlc/" target="_blank" rel="noopener">VLC</a>, then try again.</p>
<p><strong>File too big:</strong> the limit is 5 GB. Trim the clip or export at 1080p — HandBrake's "Fast 1080p30" preset works well.</p>
<h3>Progress appears stuck</h3>
<ol>
<li>Large files can pause between chunks for 30–60 seconds — normal.</li>
<li>Confirm the network works (open another site).</li>
<li>Cancel and start again if it doesn't advance after 2 minutes.</li>
</ol>
<h3>Fails partway through</h3>
<ul>
<li><strong>Network error during part upload:</strong> reconnect — the upload auto-pauses offline and resumes when the connection returns.</li>
<li><strong>Part upload failed: 403:</strong> the signed upload URLs last 6 hours; a very long pause can outlive them. The app detects an expired upload and asks you to start over with the original file.</li>
<li><strong>500 server error:</strong> wait briefly and retry; if it persists, email ${mailLink()}.</li>
</ul>
<h3>Slow uploads</h3>
<p>Measure your <strong>upload</strong> speed, not download. <a href="https://fast.com" target="_blank" rel="noopener">fast.com</a> shows upload speed after the initial result.</p>
<table><thead><tr><th scope="col">Upload speed</th><th scope="col">500 MB</th><th scope="col">1 GB</th><th scope="col">2 GB</th></tr></thead><tbody>
<tr><td>10 Mbps</td><td>~7 min</td><td>~14 min</td><td>~28 min</td></tr>
<tr><td>25 Mbps</td><td>~3 min</td><td>~5 min</td><td>~11 min</td></tr>
<tr><td>50 Mbps</td><td>~1.5 min</td><td>~3 min</td><td>~5 min</td></tr>
<tr><td>100 Mbps</td><td>~45 sec</td><td>~1.5 min</td><td>~3 min</td></tr>
</tbody></table>
<p>A wired connection often beats crowded Wi-Fi. Pause heavy sync tools (Dropbox, Google Drive) and upload at a quieter time.</p>
<h3>Status stuck on "uploading"</h3>
<p>If the browser closed mid-upload, email ${mailLink()} with the session or class name and we'll reset the status.</p>
<h3>Still failing</h3>
<p>Email ${mailLink()} with: account name, browser, file type and size, and a screenshot if you have one.</p>
</details>
<details><summary>Upload preflight checklist</summary>
<h2>Upload pre-flight checklist</h2>
<p>Run through this before uploading to dodge common issues.</p>
<div class="preflight" id="preflightList"></div>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Full format details: <a href="#formats" onclick="navigate('formats');return false">Supported formats and limits</a>.</div></div>
</details>`},

    playback: {
      title: "Watching and reviewing", section: "Video",
      content: `
<h1>Watching and reviewing</h1>
<div class="tldr"><strong>TLDR:</strong> Open a session or class and press play. Use <kbd>Space</kbd> to pause, <kbd>J</kbd>/<kbd>L</kbd> to skip 10s, <kbd>F</kbd> for fullscreen. Click <strong>Add Note</strong> to leave timestamped feedback.</div>
<p>Playback runs in the browser — no app install needed. Open recordings at <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Problems playing video? See the troubleshooting section below.</div></div>
<h2>Playback speed</h2>
<p>Preset speeds run <strong>0.5×</strong>–<strong>2×</strong> for slow-motion analysis or faster skimming. On mobile, the speed sheet adds a fine-grained slider from <strong>0.25×</strong> to <strong>3×</strong>.</p>
<h2>Timeline markers</h2>
<p>Markers on the timeline are notes. Hover to preview, click to jump to that moment.</p>
<h2>Add a note while watching</h2>
<ol>
<li>Pause the video.</li>
<li>Click <strong>Add Note</strong>, enter your text, then <strong>Save</strong>.</li>
</ol>
<p>The note saves at the current playhead position.</p>
<details><summary>Keyboard shortcuts</summary>
<p><strong>Player controls</strong> (when the video has focus):</p>
<div class="shortcut-grid">
  <div class="shortcut-card"><span>Play / Pause</span><kbd>Space</kbd> or <kbd>K</kbd></div>
  <div class="shortcut-card"><span>Skip back / forward 10s</span><kbd>J</kbd> / <kbd>L</kbd></div>
  <div class="shortcut-card"><span>Skip back / forward 5s</span><kbd>←</kbd> / <kbd>→</kbd></div>
  <div class="shortcut-card"><span>Frame step back / forward</span><kbd>,</kbd> / <kbd>.</kbd></div>
  <div class="shortcut-card"><span>Speed down / up</span><kbd>&lt;</kbd> / <kbd>&gt;</kbd></div>
  <div class="shortcut-card"><span>Jump to 0–90% of video</span><kbd>0</kbd>–<kbd>9</kbd></div>
  <div class="shortcut-card"><span>A–B loop (set start → end → clear)</span><kbd>R</kbd></div>
  <div class="shortcut-card"><span>Fullscreen</span><kbd>F</kbd></div>
  <div class="shortcut-card"><span>Picture-in-picture</span><kbd>P</kbd></div>
  <div class="shortcut-card"><span>Captions (when available)</span><kbd>C</kbd></div>
  <div class="shortcut-card"><span>Mute / unmute</span><kbd>M</kbd></div>
  <div class="shortcut-card"><span>Volume up / down</span><kbd>↑</kbd> / <kbd>↓</kbd></div>
</div>
<p><strong>Inside the note editor</strong> (after clicking Add Note):</p>
<div class="shortcut-grid">
  <div class="shortcut-card"><span>Save note</span><kbd>⌘</kbd>/<kbd>Ctrl</kbd> <kbd>Enter</kbd></div>
  <div class="shortcut-card"><span>Cancel</span><kbd>Esc</kbd></div>
</div>
</details>
<h2>A–B loop</h2>
<p>Loop a segment to study one exchange on repeat: press <kbd>R</kbd> (or the loop button) once to set the start, again to set the end, a third time to clear. Pair it with a slow playback speed for detail work.</p>
<h2>Mobile playback</h2>
<p>Kaynos runs in the mobile browser — no app install needed.</p>
<ul>
<li><strong>Skip:</strong> Double-tap the left half to skip back 10 seconds, the right half to skip forward.</li>
<li><strong>Scrub:</strong> Drag along the timeline — a floating time bubble shows where you'll land.</li>
<li><strong>Zoom:</strong> Pinch to zoom in on a detail (up to 5×), then drag to pan around the frame.</li>
<li><strong>Landscape:</strong> Rotate your phone for a wider view, especially with the notes panel open.</li>
<li><strong>Resume:</strong> Playback position syncs across devices — start on your phone, continue on your laptop.</li>
<li><strong>Add to Home Screen:</strong> iOS: Share → Add to Home Screen. Android: browser menu → Add to Home Screen.</li>
</ul>
<h2>Progress tracking</h2>
<p>Playback position saves automatically. Coaches see completion percentage and last-viewed time without heavy analytics.</p>
<h2>Multiple videos in one session</h2>
<p>A session or class can hold more than one video — extra angles, attempt 1 vs attempt 2, or several sparring rounds. The player shows a <strong>clip rail</strong>: jump between videos without leaving the page. Notes attach to the specific video that was playing when they were written. Adding and reordering videos is covered in <a href="#creating-sessions" onclick="navigate('creating-sessions');return false">Creating a session</a>.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Videos play inside Kaynos only — there are no public share links or downloads. Everyone who should see a recording gets access through their account (<a href="#roles" onclick="navigate('roles');return false">roles</a>).</div></div>
<details><summary>Playback troubleshooting</summary>
<p>If the player is blank or showing errors, work through these checks in order.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Codecs: <a href="#formats" onclick="navigate('formats');return false">Supported formats and limits</a>.</div></div>
<h3>Player blank or broken controls</h3>
<p><strong>Black screen / no controls:</strong> refresh, then hard refresh or clear cache, then try <a href="https://www.google.com/chrome/" target="_blank" rel="noopener">Chrome</a>. Confirm the upload finished (not stuck on "uploading" or showing "failed").</p>
<p><strong>"Cannot be played":</strong> often a codec or browser issue. MKV files use codecs that vary by browser — try <a href="https://www.google.com/chrome/" target="_blank" rel="noopener">Chrome</a> or <a href="https://www.mozilla.org/firefox/" target="_blank" rel="noopener">Firefox</a>, or re-export to MP4 with H.264 video and AAC audio.</p>
<h3>Buffering or long spinners</h3>
<ul>
<li>Check your bandwidth (upload and download can differ dramatically by network).</li>
<li>Close other streaming tabs or heavy downloads.</li>
<li>High-bitrate 4K sources can stutter on typical home connections — a 1080p H.264 export plays more reliably and is enough for coaching review.</li>
</ul>
<h3>Sound but no picture (or the reverse)</h3>
<p>Usually a codec mismatch. Try another browser; if it persists, re-export with standard H.264/AAC.</p>
<h3>Resume position wrong</h3>
<p>Progress saves shortly after pausing. Closing the tab immediately can skip the save.</p>
</details>`},

    formats: {
      title: "Supported formats and limits", section: "Video",
      content: `
<h1>Supported formats and limits</h1>
<div class="tldr"><strong>TLDR:</strong> MP4 (H.264 video + AAC audio) is the safe default. MOV, WebM, and MKV also work. Maximum file size is 5&nbsp;GB.</div>
<p>Use common codecs your devices and browsers handle well. When in doubt, export to MP4 (H.264 + AAC). Free converters: <a href="https://handbrake.fr" target="_blank" rel="noopener">HandBrake</a>, <a href="https://www.videolan.org/vlc/" target="_blank" rel="noopener">VLC</a>.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Where files live and how long they're kept: <a href="#storage" onclick="navigate('storage');return false">Video storage and retention</a>.</div></div>
<table><thead><tr><th scope="col">Format</th><th scope="col">Extension</th><th scope="col">Support level</th></tr></thead><tbody>
<tr><td>MP4</td><td><code>.mp4</code></td><td>Recommended default</td></tr>
<tr><td>MOV</td><td><code>.mov</code></td><td>Supported</td></tr>
<tr><td>WebM</td><td><code>.webm</code></td><td>Supported</td></tr>
<tr><td>MKV</td><td><code>.mkv</code></td><td>Matroska container; works on most modern browsers</td></tr>
</tbody></table>
<p><strong>MP4</strong> is the most predictable for uploads and playback. iPhone MOV usually works well. AVI is not supported &mdash; convert to MP4 first.</p>
<h2>File size</h2>
<ul>
<li>Maximum <strong>5 GB</strong> per file.</li>
<li>Files under <strong>2 GB</strong> upload faster on home or gym Wi-Fi (5 GB is the hard cap).</li>
</ul>
<h2>Smaller files, same teaching value</h2>
<ul>
<li><strong>1080p</strong> is enough for most instruction — high bitrates slow uploads without visible benefit.</li>
<li>Prefer <strong>H.264</strong> video and <strong>AAC</strong> audio when your export tool offers a choice.</li>
<li>Trim dead air at the start or end before uploading.</li>
</ul>
<details><summary>Upload time calculator</summary>
<h2>Upload time calculator</h2>
<p>Estimate upload time from file size and internet speed.</p>
<div class="calc-wrap">
  <div class="calc-row">
    <span class="calc-label">File size</span>
    <input class="calc-input" id="calcSize" type="number" placeholder="500" min="1" inputmode="decimal" enterkeyhint="done" oninput="calcUpload()" aria-label="File size in MB">
    <span class="calc-unit">MB</span>
  </div>
  <div class="calc-row">
    <span class="calc-label">Upload speed</span>
    <input class="calc-input" id="calcSpeed" type="number" placeholder="25" min="1" inputmode="decimal" enterkeyhint="done" oninput="calcUpload()" aria-label="Upload speed in Mbps">
    <span class="calc-unit">Mbps</span>
  </div>
  <div class="calc-result" id="calcResult"></div>
</div>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Don't know your upload speed? Go to <a href="https://fast.com" target="_blank" rel="noopener">fast.com</a> — after the download test, click <strong>Show more info</strong> to see your upload speed.</div></div>
<h3>Tips for faster uploads</h3>
<ul>
<li>Use a <strong>wired connection</strong> instead of Wi-Fi when possible</li>
<li>Pause cloud sync tools (Dropbox, Google Drive, iCloud)</li>
<li>Upload during off-peak hours</li>
<li><strong>1080p</strong> is enough — 4K files are much larger with little benefit for coaching review</li>
</ul>
</details>`},

    "recording-setup": {
      title: "Recording setup", section: "Video",
      content: `
<h1>Recording setup</h1>
<div class="tldr"><strong>TLDR:</strong> A modern phone in landscape covers 95% of coaching footage. Recording 30+ minutes regularly? Add a tripod and an external mic. Skip a "real camera" unless slow-motion or low light is actually a problem.</div>

<h2>The honest minimum</h2>
<p>Start with the phone in your pocket. Any iPhone or Pixel from the last 4–5 years records 1080p at 30 fps that looks great on a laptop screen. Don't go shopping until you've felt the limits.</p>
<ul>
<li>Phone in landscape, propped against a wall or on a tripod.</li>
<li>Camera at chest height of the action, not floor level — full bodies visible.</li>
<li>Even lighting; avoid backlighting (windows behind subjects).</li>
<li>Quiet space, or accept that ambient noise is part of the recording.</li>
</ul>

<h2>Phones that work well</h2>
<p>Anything that records 1080p H.264 at 30 fps with usable autofocus. Specifically:</p>
<ul>
<li><strong>iPhone:</strong> iPhone 11 forward. Default Camera app at 1080p30, or 1080p60 if you'll slow-mo in post. Switch <strong>Settings → Camera → Formats</strong> to "Most Compatible" rather than "High Efficiency" so the resulting file plays back in every browser.</li>
<li><strong>Pixel:</strong> Pixel 4 forward. Default Camera at 1080p.</li>
<li><strong>Samsung Galaxy:</strong> S20 forward. Set the codec to H.264 in Camera settings if it's offering HEVC.</li>
</ul>

<h2>Tripods &amp; mounts</h2>
<p>The single highest-ROI accessory. A stable shot makes a 30-minute review watchable; handheld shake makes it unusable.</p>
<ul>
<li><strong>Mini tripod / tabletop ($15–25)</strong> — Joby GripTight ONE or a generic equivalent. Good for individual lessons in tight spaces.</li>
<li><strong>Full-height tripod ($30–60)</strong> — Manfrotto Compact or any 60" travel tripod with a phone clamp. Easiest setup for a class recording.</li>
<li><strong>Wall mount</strong> — phone clamp on a high shelf with a suction cup or screw mount. Great for academies recording every class from the same angle.</li>
</ul>

<h2>Audio</h2>
<p>Phone mics are fine inside 10 ft. Past that, voice gets muddy and ambient noise dominates.</p>
<ul>
<li><strong>Lapel/lavalier mic ($20–50)</strong> — Rode SmartLav+ or a generic. Plugs into the headphone port (USB-C with adapter for newer phones). Big jump in clarity for verbal instruction.</li>
<li><strong>Wireless mic ($60–150)</strong> — Rode Wireless GO or DJI Mic. Lets the coach move around. Worth it for voiceover commentary.</li>
<li><strong>Skip:</strong> shotgun mics on a phone are awkward and on-camera condensers rarely beat a phone in a noisy gym.</li>
</ul>

<h2>Lighting</h2>
<p>Most academies have plenty of overhead light. Trouble spots:</p>
<ul>
<li><strong>Mixed light sources</strong> — daylight from a window plus warm interior light shifts color across the frame. Close blinds or kill the interior lights.</li>
<li><strong>Strong backlight</strong> — subject silhouetted against a bright window. Move the camera or cover the window.</li>
<li><strong>Dim corner</strong> — a $20 LED panel or clip-on ring light fills it. Don't overspend.</li>
</ul>

<h2>When to move past a phone</h2>
<p>Only if you need one of these:</p>
<ul>
<li><strong>Slow motion</strong> at usable resolution (120–240 fps). GoPro Hero, Sony ZV-1, or any recent mirrorless.</li>
<li><strong>Low light</strong> in a poorly lit gym. Larger sensor wins — mirrorless beats phone here.</li>
<li><strong>Wide shots from far back.</strong> Action cams (GoPro) have wider field of view; useful for tournament footage.</li>
<li><strong>Long sessions (60+ minutes)</strong> where phone overheating becomes a problem. A camera with active cooling outlasts a phone in summer.</li>
</ul>

<h2>Settings that matter</h2>
<ul>
<li><strong>Resolution:</strong> 1080p is enough; 4K is overkill and slower to upload.</li>
<li><strong>Frame rate:</strong> 30 fps for normal review; 60 fps if you'll slow-mo in post.</li>
<li><strong>Codec:</strong> H.264 ("Most Compatible" on iPhone). H.265/HEVC saves space but plays inconsistently across browsers.</li>
<li><strong>Stabilization:</strong> on, if your phone offers it.</li>
<li><strong>Auto-focus tracking:</strong> on for moving subjects. Lock focus only for stationary instruction footage.</li>
</ul>

<h2>Storage on the phone</h2>
<p>1080p H.264 is roughly 1 GB per 10 minutes. A 60-minute class is ~6 GB. Free up space before a long recording, or upload between classes so the camera roll doesn't fill.</p>

<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>The only wrong rig is the one that's too complicated to set up before class. Start with what you have, add the tripod first, then the mic. Skip the camera unless slow-mo or low light is forcing your hand.</div></div>`},

    storage: {
      title: "Video storage and retention", section: "Video",
      content: `
<h1>Video storage and retention</h1>
<h2>Where video is stored</h2>
<p>Videos live in <a href="https://www.backblaze.com/b2/cloud-storage.html" target="_blank" rel="noopener">Backblaze B2</a> (US-hosted). Playback uses short-lived presigned URLs issued directly from B2 — no third-party CDN sits in front of video delivery.</p>
<h2>Retention</h2>
<p>Default retention is <strong>6 months per school</strong>, with a <strong>30-day grace period</strong> before deletion. Expiring videos surface one month before the limit. Admins can view expiring videos from the Admin panel; to change the retention limit, email support — the limit is set per school by Kaynos staff, not from the Admin UI.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Upload limits and codecs: <a href="#formats" onclick="navigate('formats');return false">Supported formats and limits</a>.</div></div>
<h2>Default quotas</h2>
<ul>
<li><strong>100 videos</strong> per school.</li>
<li><strong>50 GB storage</strong> per school.</li>
<li>Admins can request increases via the Admin panel.</li>
</ul>
<h2>Security</h2>
<ul>
<li>HTTPS for all data in transit.</li>
<li>Account data is isolated — your files are not mixed with other organizations' storage.</li>
<li>Playback URLs are time-limited (<strong>4 hours</strong>); upload URLs last <strong>6 hours</strong>. Share access inside Kaynos rather than passing direct links — if a link stops working partway through, re-open the video in the app to fetch a fresh one.</li>
</ul>
<h2>Data residency</h2>
<p>Videos are stored in Backblaze B2 (US) and streamed directly via short-lived presigned URLs. For EU customers: Backblaze offers Standard Contractual Clauses (SCCs) in its Data Processing Agreement. Contact <a href="https://app.kaynos.net/terms" target="_blank" rel="noopener">support</a> for SCC documentation.</p>`},

    "creating-sessions": {
      title: "Creating a session", section: "Sessions & Classes",
      content: `
<div class="tldr"><strong>TLDR:</strong> Sessions are private (one student). Classes are shared (everyone). Create either from the dashboard after signing in.</div>
<h2>Session vs Class</h2>
<p>The most common question from new users: when do I create a session vs. a class?</p>
<div class="compare-grid">
  <div class="compare-card">
    <div class="compare-label private">Private</div>
    <h3>Session</h3>
    <p>One-on-one content for a single student.</p>
    <ul>
      <li>Assigned to one specific student</li>
      <li>Only that student, the creator, and admins can see it</li>
      <li>Private lessons, individual feedback, competition footage</li>
      <li>Notes stay between coach and student</li>
    </ul>
  </div>
  <div class="compare-card">
    <div class="compare-label shared">Shared</div>
    <h3>Class</h3>
    <p>Account-wide content for everyone.</p>
    <ul>
      <li>Visible to all members, coaches, and admins</li>
      <li>Group sessions, workshops, technique breakdowns</li>
      <li>Great for shared curriculum and team training</li>
      <li>Everyone can leave notes</li>
    </ul>
  </div>
</div>
<h3>Quick decision</h3>
<ul>
<li><strong>Is this for one person?</strong> → Create a <strong>session</strong></li>
<li><strong>Should everyone see it?</strong> → Create a <strong>class</strong></li>
</ul>
<h1>Creating a session</h1>
<p>A <strong>session</strong> is one-on-one content: private lessons, individual review, or competition footage for a single student. Only that student and staff who need access can see it.</p>
<h2>Workflow</h2>
<ol>
<li>Go to <strong>Sessions</strong> → <strong>New Session</strong>.</li>
<li>Choose your video source: <strong>Upload</strong> or <strong>Notes Only</strong>.</li>
<li>Fill in title and date, assign the student from your roster, and pick a session type (<strong>private</strong>, <strong>drilling</strong>, <strong>sparring</strong>, or <strong>comp prep</strong>).</li>
<li>Click <strong>Create Session</strong>.</li>
</ol>
<h2>Draft and publish</h2>
<p>A new session starts as a <strong>draft</strong> — visible to coaches and admins but not yet to the student. Publish it when the video and notes are ready; the student gets an email (if their notifications are on) and the session appears on their dashboard. You can unpublish to pull it back to draft. Linked parents see published sessions only.</p>
<h2>Who sees it</h2>
<p>Once published: the assigned student, the creator, staff, and any linked parents. Other students can't open someone else's private session.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>First upload walkthrough: <a href="#uploading" onclick="navigate('uploading');return false">Your first upload</a> on the Uploading videos page. Visibility model: <a href="#faq" onclick="navigate('faq');return false">FAQ</a>.</div></div>
<h2>Scheduling</h2>
<p>The <strong>Schedule</strong> page shows a calendar with daily, weekly, and monthly views. To schedule a session:</p>
<ol>
<li>Go to <strong>Schedule</strong> and click a time slot.</li>
<li>Fill in the session details and assign a student.</li>
<li>The system checks for conflicts with existing sessions and school hours.</li>
</ol>
<p>Admins set operating hours under <strong>Admin</strong> → <strong>School hours</strong>. Scheduling outside those hours is still allowed.</p>
<h2>Review requests</h2>
<p>Students can request a video review from any coach. A request creates a draft session the student fills out.</p>
<h3>How students submit a request</h3>
<ol>
<li>Click <strong>Request a review</strong> in the student dashboard.</li>
<li>Select a coach and describe what they want feedback on.</li>
<li>Upload the video to the draft session.</li>
<li>Submit the request — the coach receives a notification.</li>
</ol>
<h3>How coaches respond</h3>
<p>Pending requests appear in the coach's review queue. Coaches <strong>accept</strong> or <strong>decline</strong> each request. Accepting converts the request into a full session — the coach watches the video and adds notes and annotations as usual. The queue also shows each coach's pending count, the age of the oldest request, and their average response time, so nothing sits forgotten.</p>
<h3>If a coach declines or doesn't respond</h3>
<ul>
<li>Declined requests stay in the student's history for reference; the student is notified.</li>
<li>Pending requests don't auto-expire — they wait until the coach acts. If a request is stuck, the student's quickest path is to ask the coach directly or submit a new request to another coach.</li>
</ul>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Review requests are the main way students initiate feedback. Coaches who enable <a href="#profile" onclick="navigate('profile');return false">email notifications</a> get alerted as soon as a request comes in.</div></div>
<h2>Multiple videos per session</h2>
<p>A session isn't limited to one video. Attach multiple clips to the same session — useful when a student sends two angles of a drill, or to compare "attempt 1" and "attempt 2" side-by-side.</p>
<ul>
<li><strong>Add another video:</strong> open the session and click <strong>Add video</strong>. Same upload flow as the first.</li>
<li><strong>Switch between videos:</strong> the player has a clip rail — jump from one to the next without leaving the session.</li>
<li><strong>Reorder:</strong> drag clips in the rail or use the up/down controls. The order students see updates immediately.</li>
<li><strong>Notes</strong> stay tied to the clip that was active when you wrote them — switching videos doesn't move existing notes.</li>
</ul>
<p>The same Add/Reorder/Switch flow applies to <a href="#creating-classes" onclick="navigate('creating-classes');return false">classes</a> with multiple recordings.</p>`},

    "creating-classes": {
      title: "Creating a class", section: "Sessions & Classes",
      content: `
<h1>Creating a class</h1>
<p>A <strong>class</strong> is account-wide: group sessions, workshops, or any recording for all students.</p>
<h2>Workflow</h2>
<ol>
<li>Go to <strong>Classes</strong> → <strong>New Class</strong>.</li>
<li>Choose your video source: <strong>Upload</strong> or <strong>Notes Only</strong>.</li>
<li>Fill in title and date, plus an optional description.</li>
<li>Click <strong>Create Class</strong>.</li>
</ol>
<h2>Who sees it</h2>
<p>All members, coaches, and admins in your account. This broad visibility is intentional — it's what separates a class from a private session. There's no draft step: when the class is created, students with the <strong>Class recordings</strong> email preference on get a notification.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Upload options and limits: <a href="#uploading" onclick="navigate('uploading');return false">Uploading videos</a> and <a href="#formats" onclick="navigate('formats');return false">Supported formats and limits</a>.</div></div>`},

    notes: {
      title: "Notes and timestamps", section: "Sessions & Classes",
      content: `
<h1>Notes and timestamps</h1>
<div class="tldr"><strong>TLDR:</strong> Pause the video, click <strong>Add Note</strong>, type (or record) your note. It saves with the timestamp. @mention teammates, reply in threads, and react with emoji.</div>
<p>Attach short notes to exact moments on the timeline so everyone lands on the same frame.</p>
<h2>Adding a note from the player</h2>
<ol>
<li>Pause the video.</li>
<li>Click <strong>Add Note</strong>, type your text, then <strong>Save</strong> (or press <kbd>Cmd/Ctrl</kbd>+<kbd>Enter</kbd>).</li>
</ol>
<p>The note saves at the current playhead position. Markers appear on the scrub bar; click any to jump.</p>
<h2>Who can edit</h2>
<p>Coaches can edit any note. Students can edit only notes they created.</p>
<h2>Pinned notes</h2>
<p>Coaches can <strong>pin</strong> up to three top-level notes per session or class to keep the most important feedback at the top of the list. Replies can't be pinned.</p>
<h2>@Mentions</h2>
<p>Type <strong>@</strong> followed by a name to mention a teammate. Mentioned users get an email with a link straight to the note.</p>
<p>Use mentions to loop in a coach ("@Marco take a look at this sweep attempt") or prompt a student to review ("@Sofia check the guard retention at 2:14").</p>
<h2>Threaded replies</h2>
<p>Reply to any note to start a thread. Click <strong>Reply</strong>, type your response, and save. The original author and anyone @mentioned get an email notification.</p>
<p>Threads keep feedback organized — coach observation, student question, and follow-up all stay tied to the same timestamp.</p>
<h2>Tips</h2>
<ul>
<li>Short, specific lines (technique name + brief observation) scan better later than long paragraphs.</li>
<li>Students can leave questions on their own sessions for coach follow-up.</li>
<li>Use the coach filter to review your notes across recordings.</li>
</ul>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Playback shortcuts and the full note workflow: <a href="#playback" onclick="navigate('playback');return false">Watching and reviewing</a>.</div></div>
<h2>Note types</h2>
<p>When creating a note, choose a type:</p>
<ul>
<li><strong>Note</strong> — general observation (default)</li>
<li><strong>Highlight</strong> — a time-range bookmark on the timeline (start and end points)</li>
<li><strong>Annotation</strong> — a drawing overlay on a paused frame (see the <em>Annotations</em> section)</li>
</ul>
<h2>Voice notes</h2>
<p>Record a spoken note instead of typing — handy mid-review or on a phone.</p>
<ol>
<li>The first time, grant microphone access when prompted.</li>
<li>Press and hold the microphone button to record (up to <strong>60 seconds</strong>). On mobile, slide up to lock hands-free, slide left to cancel.</li>
<li>Release to attach the voice note at the current timestamp.</li>
</ol>
<p>Voice notes are stored with the session and playable by anyone who can see the note. They're transcribed automatically (powered by Deepgram) so the content is searchable and readable without headphones; Deepgram processes the audio in real time and doesn't keep it.</p>
<h2>Organizing content</h2>
<p>Sessions and classes are organized by <strong>session type</strong> (private, drilling, sparring, comp prep, class) plus consistent naming — see <a href="#coach-handbook" onclick="navigate('coach-handbook');return false">the coach handbook</a> for naming conventions that hold up months later. Coaches also get a personal <strong>Notebook</strong> for free-form entries with their own tags and pins, separate from any session.</p>
<h2>Annotations</h2>
<p>Draw on a video frame to highlight technique details.</p>
<ol>
<li>Pause the video at the moment you want to annotate.</li>
<li>Click the annotation tool in the note editor.</li>
<li>Draw with pen, line, circle, or arrow on the frozen frame. Pick stroke colour and width; undo/redo are available.</li>
<li>Save — the annotation attaches to that timestamp and appears during playback.</li>
</ol>
<h2>AI review (currently unavailable)</h2>
<p>Kaynos has an AI review feature that analyzes video and suggests coaching notes (powered by Twelve Labs). <strong>It is currently switched off platform-wide</strong> — you won't see AI options in the app right now. If it returns, AI suggestions arrive as clearly flagged notes that coaches review and edit before students see them; students never see raw AI output. Watch the <a href="#release-notes" onclick="navigate('release-notes');return false">release notes</a> for status.</p>
<h2>Reactions</h2>
<p>React to any note with an emoji: 👍 ❤️ 🔥 👀 ✅ 👏 🔖. Click the reaction button under a note. Two of them carry meaning beyond a nod: <strong>✅</strong> marks a correction as worked, and <strong>🔖</strong> adds the note to your drill list so you can pull up everything you've bookmarked across sessions.</p>
`},

    "coach-handbook": {
      title: "Coach handbook", section: "Sessions & Classes",
      content: `
<h1>Coach handbook</h1>
<div class="tldr"><strong>TLDR:</strong> Advanced patterns for getting the most out of Kaynos as a coach — naming conventions, session types, multi-video sessions, the coach notebook, and the feedback loops that move students fastest.</div>

<p>Read the <a href="#setup" onclick="navigate('setup');return false">setup guide</a> first if you're brand new. This page is for coaches who've got the basics and want to move faster.</p>

<h2>Naming sessions and classes</h2>
<p>A name you write today is a search query in three months. Patterns that scale:</p>
<ul>
<li><strong>Session:</strong> <code>{Student}, {Date}, {Focus}</code> — "Maya, 2026-05-04, guard retention".</li>
<li><strong>Class:</strong> <code>{Day}, {Topic}, {Level}</code> — "Mon, scissor sweeps, intermediate".</li>
<li>Be consistent across coaches — a shared convention compounds.</li>
</ul>

<h2>Session types and the coach notebook</h2>
<p>Two organizing tools, used differently:</p>
<ul>
<li><strong>Session type</strong> (private, drilling, sparring, comp prep) is set on every session — pick it deliberately so a student's history reads at a glance.</li>
<li><strong>The Notebook</strong> is your private scratchpad: free-form entries with your own tags and pins, separate from any session. Lesson plans, curriculum ideas, per-student observations that aren't ready to be a note yet. Students never see it.</li>
</ul>

<h2>Class structure that gets watched</h2>
<p>A 60-minute class recording, posted untouched, has a brutally low completion rate. What works:</p>
<ul>
<li><strong>Upload the full class</strong> so it exists in the archive.</li>
<li><strong>Pin the key moments.</strong> Drop a timestamped note at each important segment ("12:40 — the grip detail everyone missed") and <strong>pin</strong> the most important one. Students jump straight to the markers instead of scrubbing 60 minutes.</li>
<li><strong>Use a highlight note</strong> (start + end time) to bracket the one exchange worth re-watching on loop.</li>
</ul>

<h2>Notes that students act on</h2>
<p>Three habits that turn passive watching into actual change:</p>
<ul>
<li><strong>Question, not statement:</strong> "What's happening with your right hand here?" beats "Your right hand is wrong." Students engage with questions.</li>
<li><strong>Reference earlier work:</strong> @mention a previous session note when the same issue recurs. The pattern becomes visible.</li>
<li><strong>One thing per note:</strong> timestamped notes are scannable. Don't write paragraphs — write three short notes at three moments instead.</li>
</ul>

<h2>Review requests</h2>
<p>Encourage students to submit short clips (under 2 minutes) with one specific question. Long unfocused requests sit in your queue; short specific ones get fast responses and create a virtuous loop.</p>

<h2>AI review</h2>
<p>AI review (powered by Twelve Labs) is <strong>currently switched off platform-wide</strong> — you won't see AI options in the app today. When active, it surfaces moments worth attention as flagged suggestions you edit, keep, or delete before students see anything. Track its status in the <a href="#release-notes" onclick="navigate('release-notes');return false">release notes</a>.</p>

<h2>Voice notes</h2>
<p>For long review sessions where typing slows you down: hold the mic button and talk (up to 60 seconds per note). The audio attaches to the timestamp and is transcribed automatically, so students can listen <em>or</em> read. Tone survives in a voice note in a way text can't — corrections land softer.</p>

<h2>Progress reviews</h2>
<p>Run a quick pass on the <a href="#progress" onclick="navigate('progress');return false">progress dashboard</a> weekly — who watched what, who hasn't. Reach out directly to students who haven't watched anything for two weeks. The intervention is small; the retention impact compounds.</p>

<h2>Multi-coach gyms</h2>
<p>Each coach has their own student roster, but classes are visible to everyone. Conventions worth aligning on at a team level:</p>
<ul>
<li>Naming conventions (above).</li>
<li>Who owns class recordings (one person, or the coach who taught).</li>
<li>How to handle review requests when the student picked another coach.</li>
<li>Whether assistant coaches add notes to a head coach's sessions (most do — clarify expectations).</li>
</ul>

<h2>Tournament footage</h2>
<p>If you record competition footage for review:</p>
<ul>
<li>Upload to a <strong>session</strong> assigned to the competitor — it's their performance, even if you debrief in class later. Set the type to <strong>comp prep</strong>.</li>
<li>Bracket the key match moment with a <strong>highlight note</strong> (start + end) — the bracketed exchange gets re-watched; the full match doesn't.</li>
<li>Put the event name in the session title so it's searchable later.</li>
</ul>

<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>The single highest-impact habit: write at least one note per video. Notes you write are notes students return to. Notes you don't write fade.</div></div>`},

    progress: {
      title: "Progress tracking", section: "Sessions & Classes",
      content: `
<h1>Progress tracking</h1>
<div class="tldr"><strong>TLDR:</strong> For each session and class we record last playback position, completion status, and last-viewed time. Members resume where they left off. Coaches and owners filter by student and time range — Week, Month, or Quarter.</div>
<p>Progress is simple on purpose: enough to see whether someone finished a recording and when they last opened it.</p>
<h2>What we store</h2>
<p>For each session and class, we track last playback position (for resume), whether the full video was completed, and the last-viewed time. Coaches and admins can filter progress reports by student and time range: <strong>Week</strong> (7 days), <strong>Month</strong> (30 days), or <strong>Quarter</strong> (90 days).</p>
<h2>For members</h2>
<p>Members resume where they left off. Overviews show items that still need a full watch versus completed items.</p>
<h2>For coaches and owners</h2>
<p>Coach and admin views show completion and recency. No fine-grained analytics or viewer heatmaps.</p>
<h2>What we intentionally avoid</h2>
<p>No invasive watch analytics or third-party ad-style tracking. The product stores only what it needs for resume and high-level completion.</p>
<h2>Dashboard metrics</h2>
<p>The progress dashboard shows three headline numbers for the selected period:</p>
<ul>
<li><strong>Watch rate</strong> — percentage of assigned sessions the student has viewed.</li>
<li><strong>Session count</strong> — total published sessions for the student in the period.</li>
<li><strong>Note count</strong> — notes and replies the student wrote themselves (a signal of engagement, not coach output).</li>
</ul>
<h2>Weekly email digest</h2>
<p>Coaches and admins with the <strong>Progress reports</strong> email preference on receive a weekly summary: per-student watch rates, school-wide totals, and which students haven't engaged recently. Quiet weeks send nothing — no activity, no email. Toggle it under <a href="#profile" onclick="navigate('profile');return false">Profile → Notifications</a>.</p>
<h2>Time-period filtering</h2>
<p>Filter buttons narrow the view to the <strong>last 7, 30, or 90 days</strong>. Default is 30 days.</p>
<h2>Per-session details</h2>
<p>Each row in the recent-sessions list shows session title, date, a check icon if the full video was watched, and the note count. Resume position and last-viewed timestamp are tracked behind the scenes so playback picks up where it left off.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Roster and access control: <a href="#managing-members" onclick="navigate('managing-members');return false">Managing members</a>.</div></div>`},

    "managing-members": {
      title: "Managing members", section: "Admin",
      content: `
<h1>Managing members</h1>
<div class="tldr"><strong>TLDR:</strong> Admins manage the full roster from <strong>Admin</strong>. Coaches manage their own students from <strong>Students</strong>. Use the role dropdown to change permissions and the <strong>Remove</strong> button to revoke access — notes the member created stay for history.</div>
<p>Admins use <strong>Admin</strong> for the full roster. Coaches use <strong>Students</strong> to manage their own student invites. Everything happens in <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>.</p>
<h2>Add someone</h2>
<p>See <a href="#inviting-members" onclick="navigate('inviting-members');return false">Inviting your team</a> for the invite flow.</p>
<h2>Change roles</h2>
<p><strong>Admin</strong> → select the member → role dropdown → save. Changes apply immediately. Details: <a href="#roles" onclick="navigate('roles');return false">Understanding user roles</a>.</p>
<h2>Remove access</h2>
<p><strong>Remove Member</strong> ends access immediately. Notes they created remain for history. You can also remove a student from their profile page (<code>/students/&lt;id&gt;</code>) with the <strong>Remove</strong> button — admin only, mirrors the roster flow.</p>
<div class="hint hint-warning"><div class="hint-icon">${IC.warn}</div><div>Removal is immediate — the person loses login access to your account on <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> right away.</div></div>
<h2>Activity indicator and email privacy</h2>
<p>Student avatars in the roster show an activity dot: <strong>green</strong> when the student had a session in the last 30 days, <strong>dim</strong> when activity is older than 30 days, no dot when they have no sessions yet.</p>
<p>For screen-sharing or recording, toggle <strong>Hide emails</strong> in the Members section. Addresses are masked to first letter + domain (<code>j****@example.com</code>); search still works against the full address.</p>
<h2>Common questions</h2>
<p><strong>One person in two schools?</strong> The same email can hold an account in more than one school — at sign-in, Kaynos shows a school picker when the credentials match multiple accounts.</p>
<p><strong>Member limits?</strong> No headcount cap.</p>
<p><strong>Student-to-student invites?</strong> Only staff roles can invite; students cannot.</p>
<h2>Multiple schools</h2>
<p>One login can belong to several schools, each with its own roster, sessions, classes, and storage quota — see <a href="#school-switcher" onclick="navigate('school-switcher');return false">Switching between schools</a>. Running several gyms under one billing umbrella is a <strong>tenant</strong> feature handled by Kaynos staff: email ${mailLink()}.</p>
<h2>Branding</h2>
<p>Upload a custom logo for your academy under <strong>Admin → Branding</strong>. Members see it in the header after they log in. PNG or SVG, square, at least 200×200px.</p>
<h2>School hours</h2>
<p>Set operating hours under <strong>Admin → School hours</strong>. Default is 6 AM to 9 PM. The schedule view uses these hours for the daily/weekly grids; sessions can still be booked outside the window.</p>
<h2>Usage reports</h2>
<p>Once your school has at least five sessions or classes, admins can receive automated email reports summarizing activity.</p>
<ol>
<li>Go to <strong>Admin → Reports &amp; Exports</strong>.</li>
<li>Choose frequency: <strong>off</strong>, <strong>weekly</strong>, or <strong>monthly</strong>.</li>
<li>Reports cover the previous period — sessions and classes created, active students, storage usage.</li>
</ol>
<p>Click <strong>Send now</strong> to trigger an immediate report.</p>
<h2>Admin panel overview</h2>
<p>The Admin panel has several sections. Here's what each does, in order:</p>
<dl>
<dt>Academy</dt><dd>School name and subscription status (active, trialing, past due, cancelled). Edit the academy name from here.</dd>
<dt>Members</dt><dd>View roster, add/remove members, change roles, reset passwords, filter by role, and toggle email privacy mode for screen sharing.</dd>
<dt>School hours</dt><dd>Set operating hours used by the schedule view (default 6 AM–9 PM).</dd>
<dt>Branding</dt><dd>Upload a custom logo for the in-app header.</dd>
<dt>Storage</dt><dd>Monitor video count and storage usage against your limits (default: 100 videos, 50 GB). View expiring videos. Request a storage increase.</dd>
<dt>Reports &amp; Exports</dt><dd>Configure automated usage reports (off/weekly/monthly), send a manual report, and export school data as JSON or members as CSV. Visible once your school has at least 5 sessions or classes.</dd>
<dt>Danger Zone</dt><dd>Schedule account deletion (30-day grace period) or cancel a pending deletion. Collapsed by default; auto-expanded if a deletion is already scheduled.</dd>
</dl>
<p>Billing (manage subscription, update payment method) lives on the signed-in admin's <strong>Profile</strong> page, not under Admin.</p>`},

    profile: {
      title: "Profile and password", section: "Account",
      content: `
<h1>Profile and password</h1>
<div class="tldr"><strong>TLDR:</strong> Open your profile from the sidebar (desktop) or the avatar in the top-right (mobile). Update your name, email, and password from there. Notification preferences and admin-only billing live on the same page.</div>
<h2>Open your profile</h2>
<p>Desktop: click your name in the sidebar. Mobile: tap the avatar in the top-right of the header, then choose <strong>Profile</strong>.</p>
<h2>Name and details</h2>
<p>Update your display name, then click <strong>Save changes</strong>. You can also add a short <strong>bio</strong> and a <strong>signature</strong> (appended to your notes), and upload an <strong>avatar</strong> — JPEG, PNG, or WebP up to 2 MB.</p>
<h2>Email address</h2>
<p>Your email is your sign-in identifier. To change it:</p>
<ol>
<li>In the <strong>Email address</strong> section, click <strong>Change</strong>.</li>
<li>Enter the new address and click <strong>Send verification</strong>. Kaynos emails a verification link to it.</li>
<li>Open the link to confirm. Your sign-in email updates only after the link is opened.</li>
</ol>
<p>While a change is pending, the new address shows as <strong>Pending</strong> with a <strong>Cancel pending change</strong> button. Verification links expire after <strong>24 hours</strong> — request a new one if it lapses.</p>
<h2>Change password</h2>
<ol>
<li>Click <strong>Change Password</strong>.</li>
<li>Enter your current password.</li>
<li>Enter your new password (minimum <strong>8 characters</strong>) and confirm it.</li>
<li>Click <strong>Update Password</strong>.</li>
</ol>
<p>Locked out? Ask an admin for a reset, or email ${mailLink()}. Login help: <a href="#login-issues" onclick="navigate('login-issues');return false">Login and access issues</a>.</p>
<h2>Two-factor authentication</h2>
<p>Add a second factor to your sign-in from the profile security section:</p>
<ol>
<li>Click <strong>Set up two-factor authentication</strong> and scan the QR code with an authenticator app (Google Authenticator, 1Password, Authy — any TOTP app).</li>
<li>Enter the 6-digit code to confirm.</li>
<li>Save the <strong>recovery codes</strong> shown once — they're your way in if you lose the phone. Each works one time.</li>
</ol>
<p>With 2FA on, sign-in asks for a code (or a recovery code) after your password. Disabling 2FA requires your password plus a current code. SMS and email codes aren't offered — authenticator apps only.</p>
<h2>Billing (admins only)</h2>
<p>Admins see a <strong>Billing</strong> section with the current subscription status and a <strong>Manage</strong> button that opens the Stripe billing portal in a new tab. Update payment methods, download invoices, or change plans there. Full reference on <a href="#billing" onclick="navigate('billing');return false">Billing &amp; subscription</a>.</p>
<h2>Notifications</h2>
<p>Email notifications live in the profile <strong>Notifications</strong> section. A master <strong>Email notifications</strong> toggle sits at the top, with per-event toggles underneath:</p>
<ul>
<li><strong>New sessions</strong> — when a coach publishes a session for you.</li>
<li><strong>Class recordings</strong> — when a class recording is posted to your school.</li>
<li><strong>Notes from instructors</strong> — notes on your sessions, @mentions, and thread replies.</li>
<li><strong>Progress reports</strong> (coaches/admins) — the weekly engagement digest.</li>
<li><strong>Usage reports</strong> (admins) — scheduled academy activity summaries.</li>
</ul>
<p>Turning the master switch off silences all of them. With the master on, flip each sub-toggle individually — for example, keep <strong>Notes from instructors</strong> on but turn off class-recording emails if you only want personal coaching alerts.</p>
<p><strong>Always sends regardless of toggles:</strong> welcome emails, password resets, invites, email-change verification links, deletion notices, and support form confirmations.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Delivery problems? See <a href="#email-issues" onclick="navigate('email-issues');return false">Email and notification issues</a>.</div></div>
<h2>In-app notifications</h2>
<p>The bell icon in the header shows unread notifications: mentions, note replies, review requests, and other activity. Click to view, or mark all as read. On mobile, dismiss the panel with the close button.</p>
<p>If you've installed Kaynos to your home screen (or allowed notifications in the browser), the same events can arrive as <strong>push notifications</strong> on your device — see <a href="#using-on-mobile" onclick="navigate('using-on-mobile');return false">Using Kaynos on mobile</a>.</p>
<h2>Delete your account</h2>
<p>From the profile you can schedule deletion of your own account. Access ends immediately and data is permanently removed after a <strong>30-day grace period</strong> — the confirmation email contains a one-time cancel link if you change your mind. School admins can't self-delete this way; they close the whole school from <strong>Admin → Danger Zone</strong> instead. You can also request a <strong>personal data export</strong>; a download link (valid 7 days) is emailed when it's ready.</p>
<h3>Not receiving mail</h3>
<ol>
<li>Check spam or promotions folders.</li>
<li>Confirm the profile email address is correct.</li>
<li>Confirm notifications are enabled in your profile settings.</li>
<li>If it still fails, contact ${mailLink()} with the expected address.</li>
</ol>`},

    billing: {
      title: "Billing & subscription", section: "Account",
      content: `
<h1>Billing &amp; subscription</h1>
<div class="tldr"><strong>TLDR:</strong> See <a href="https://www.kaynos.net/#pricing" target="_blank" rel="noopener noreferrer">current pricing</a>. Manage card, invoices, and cancellation from <strong>Profile → Billing → Manage</strong> (admin only). A failed payment gets one-time automatic retries before access pauses.</div>
<h2>Where billing lives</h2>
<p>Billing is admin-only. Sign in as an admin, open your <strong>Profile</strong> (avatar in the header), then click <strong>Manage</strong> in the Billing section. That opens the Stripe billing portal — every billing change happens there.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Coaches and students can't see billing, even if they're paying for it personally — admins only. If you're paying for the academy from outside the school account, ask the school owner to add you as an admin first.</div></div>
<h2>What you can do in the portal</h2>
<ul>
<li>Update card, expiration, and billing address.</li>
<li>Download every past invoice (Stripe also emails a PDF after each charge).</li>
<li>See your next-charge date and amount.</li>
<li>Cancel — see "Cancel" below for what that means.</li>
</ul>
<h2>Free trial</h2>
<p>Every account starts with a free trial. Card required to begin so we don't have to interrupt you on day one to take payment. The exact trial length lives on the <a href="https://www.kaynos.net/#pricing" target="_blank" rel="noopener noreferrer">pricing page</a>; the in-app countdown sits in Profile → Billing.</p>
<p><strong>Cancel before the trial ends → no charge.</strong> Cancel after → you're charged through the current period and access continues until that period ends.</p>
<h2>Failed payment</h2>
<p>If a charge fails (expired card, insufficient funds, fraud check), Stripe retries automatically over the next few days and emails you on each attempt. While retries are pending, your account stays active.</p>
<p>If every retry fails, the account moves to <strong>past due</strong>: read-only access stays for a short grace window so you can update the card. After that, the account suspends — data preserved, no upload/notes/share until billing is fixed.</p>
<p>To recover: Profile → Billing → Manage → update the card. Stripe retries on the spot and the account restores.</p>
<h2>Invoices &amp; receipts</h2>
<p>Every charge emails a Stripe receipt to the billing address. Downloadable PDF invoices are in the portal. Need a custom invoice for accounting (specific school name, tax ID, PO number)? Email ${mailLink()} and we'll add the line items.</p>
<h2>Tax &amp; VAT</h2>
<p>Stripe calculates tax from your billing address — VAT for EU customers, sales tax for applicable US states. The invoice line items show the breakdown. With a VAT ID or tax-exempt status, add it in the billing portal before your next renewal; it applies going forward.</p>
<h2>Refunds</h2>
<p>We refund pro-rata for mid-period cancellations if you're unhappy with the service. Email ${mailLink()} with your school name — refunds usually clear in 5–10 business days back to the original card.</p>
<h2>Cancel</h2>
<p>Profile → Billing → Manage → Cancel subscription. Access stays available through the end of the period you've already paid for, then the account deactivates. Data is preserved for the standard <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">retention window</a> after that — re-subscribe anytime to restore full access without losing recordings or notes.</p>
<h2>Pausing</h2>
<p>There's no in-app pause. The functional equivalent: cancel via the portal (no next-period charge, data preserved during retention), re-subscribe when you're ready. For a longer pause where you're worried about hitting the retention window, email ${mailLink()} and we'll work something out.</p>
<h2>Adding coaches / changing seats</h2>
<p>The plan is a flat rate per school — there are no seat counts to manage and no per-member charges. Invite as many coaches and students as you need from <a href="#managing-members" onclick="navigate('managing-members');return false">Members</a>; the invoice doesn't change. Current price and inclusions: <a href="https://www.kaynos.net/#pricing" target="_blank" rel="noopener noreferrer">kaynos.net pricing</a>.</p>
<h2>Account deletion vs cancellation</h2>
<p>Two different things:</p>
<ul>
<li><strong>Cancel</strong> stops the recurring charge. Data stays in retention; resume by re-subscribing.</li>
<li><strong>Delete</strong> (Admin → Delete School) schedules account-wide deletion with a 30-day grace period. After 30 days, all data is permanently removed and re-subscribing won't recover it.</li>
</ul>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Stripe never sends Kaynos your card number — payment processing happens at PCI-DSS Level 1 inside Stripe. We see the receipt, the customer email, and the brand and last-4 of the card.</div></div>`},

    "login-issues": {
      title: "Login and access issues", section: "Troubleshoot",
      content: `
<h1>Login and access issues</h1>
<p>Most issues come down to the wrong email, typos, or Caps Lock. Repeated failed attempts from the same IP trigger a brief rate limit (see "Too many attempts" below). Sign in at <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>.</p>
<h2>Password problems</h2>
<ul>
<li>Use the same email the invite was sent to.</li>
<li>Check Caps Lock; paste the password once to catch hidden typos.</li>
<li>Ask an admin for a reset or email ${mailLink()}.</li>
</ul>
<h2>"Too many attempts"</h2>
<p>Repeated failed sign-ins escalate in two steps: after <strong>3 failures</strong> a CAPTCHA appears on the login form; after <strong>6 failures</strong> sign-in from that connection is blocked for about <strong>15 minutes</strong> (HTTP 429). The counter clears on a successful sign-in or after the wait. Use the pause to reset your password if you're unsure of it. Still stuck? Contact ${mailLink()}.</p>
<h2>Two-factor codes</h2>
<p>If your account has 2FA enabled, sign-in asks for a 6-digit authenticator code after the password. Lost the device? Use one of your <strong>recovery codes</strong> (each works once). Out of recovery codes too? Email ${mailLink()} from your account address.</p>
<h2>Blank page or "no access"</h2>
<p>The account may have been removed, or the browser cached an old session. Try a private/incognito window. If that works, clear site data for <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in your normal browser.</p>
<h2>Still locked out</h2>
<p>Email ${mailLink()} with your name, account name, and email address.</p>
<h3>Reset link expired</h3>
<p>Password reset links expire after <strong>1 hour</strong>. If yours no longer works, request a new one from the login page (<strong>Forgot password?</strong>) or ask your admin to resend from <strong>Admin → Members → Reset Password</strong>.</p>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>Profile and password changes: <a href="#profile" onclick="navigate('profile');return false">Profile and password</a>.</div></div>`},

    "email-issues": {
      title: "Email and notification issues", section: "Troubleshoot",
      content: `
<h1>Email and notification issues</h1>
<p>Most delivery problems come from spam filtering, address typos, or disabled notification settings. Preferences live under <strong>Profile</strong> in <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>What we send: <a href="#profile" onclick="navigate('profile');return false">Email notifications</a>. Invites: <a href="#inviting-members" onclick="navigate('inviting-members');return false">Inviting your team</a>.</div></div>
<h2>Not receiving messages</h2>
<ol>
<li>Check spam or promotions folders (Gmail often sorts automated mail here).</li>
<li>Add the sender to your contacts or safe-senders list.</li>
<li>Confirm the profile email is correct and notifications are enabled.</li>
</ol>
<h2>Invite missing</h2>
<ul>
<li>Check spam first.</li>
<li>Confirm the address has no typo (e.g., .gmail vs .googlemail).</li>
<li>Resend from <strong>Admin</strong> or use Reset Password.</li>
<li>Corporate filters may require IT allowlisting; an admin can issue a manual password reset in the meantime.</li>
</ul>
<h2>Too many emails</h2>
<p><strong>Profile</strong> → turn off the master <strong>Email notifications</strong> toggle to silence everything, or use the per-event toggles (New sessions, Class recordings, Notes from instructors — plus Progress reports and Usage reports for staff) to mute some and keep others. Security email (password resets, invites, email-change verifications) always sends.</p>`},

    performance: {
      title: "Performance and loading", section: "Troubleshoot",
      content: `
<h1>Performance and loading</h1>
<p>Slow loads usually come from local network conditions, browser cache, or extensions — not a full outage.</p>
<h2>General slowness</h2>
<ol>
<li>Aim for about 5 Mbps down for smooth 1080p playback. Upload speeds: see <a href="#uploading" onclick="navigate('uploading');return false">Uploading videos</a>.</li>
<li>Clear cache and site data for <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a>.</li>
<li>Try Chrome or Firefox if Safari misbehaves.</li>
<li>Disable strict ad or script blockers to test.</li>
<li>Close excess tabs to free memory.</li>
</ol>
<h2>Unstyled or broken layout</h2>
<p>CSS likely failed to load. Hard refresh: <strong>Ctrl+Shift+R</strong> (Windows/Linux) or <strong>Cmd+Shift+R</strong> (Mac).</p>
<h2>Red error messages</h2>
<ul>
<li>Refresh once — a single failed request can trigger an error.</li>
<li>If it repeats, screenshot it, note what you clicked, and email ${mailLink()}.</li>
</ul>
<h2>Mobile tips</h2>
<p>Kaynos runs in the mobile browser — no app store install. Open <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in your phone's browser.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Upload troubleshooting: <a href="#uploading" onclick="navigate('uploading');return false">Uploading videos</a>.</div></div>
<h3>Supported mobile browsers</h3>
<ul>
<li>iPhone / iPad: Safari or Chrome</li>
<li>Android: Chrome or Firefox</li>
</ul>
<h3>Upload from a phone</h3>
<p>Tap upload and choose from Photos or Files. Keep the screen on and stay on the tab — backgrounding the browser pauses uploads.</p>
<h3>Watching video on mobile</h3>
<ul>
<li>Tap the video to play/pause; controls hide after a few seconds.</li>
<li>Landscape often fits the frame better than portrait.</li>
<li>Playback speed, notes, and timeline markers match desktop.</li>
</ul>
<h3>Add to home screen</h3>
<ul>
<li><strong>iOS:</strong> Share button → Add to Home Screen</li>
<li><strong>Android:</strong> browser menu → Add to Home Screen</li>
</ul>
<h3>Mobile limits</h3>
<ul>
<li>Very large files on older phones can be slow or unstable — a laptop is more reliable.</li>
<li>Landscape helps when the notes panel is open on a small display.</li>
</ul>
<div class="hint hint-tip"><div class="hint-icon">${IC.tip}</div><div>For everything mobile-specific — installing as an app, granting permissions, push setup — see <a href="#using-on-mobile" onclick="navigate('using-on-mobile');return false">Using Kaynos on mobile</a>.</div></div>`},

    "using-on-mobile": {
      title: "Using Kaynos on mobile", section: "Troubleshoot",
      content: `
<h1>Using Kaynos on mobile</h1>
<div class="tldr"><strong>TLDR:</strong> Kaynos runs in any modern mobile browser — no app-store download. Install it to your home screen for an app-like experience. This page covers install, permissions (camera, mic, photos), notifications, and the realities of recording and uploading on a phone.</div>

<h2>Install Kaynos as a home-screen app</h2>
<p>Kaynos is a Progressive Web App (PWA). Once installed, it opens full-screen with no browser chrome and shows up as its own icon — same as a native app.</p>
<h3>iOS (Safari)</h3>
<ol>
<li>Open <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in Safari (it must be Safari, not Chrome on iOS).</li>
<li>Tap the <strong>Share</strong> button (square with an up-arrow) at the bottom of the screen.</li>
<li>Scroll the share sheet and tap <strong>Add to Home Screen</strong>.</li>
<li>Edit the name if you want, then tap <strong>Add</strong>. The Kaynos icon appears on your home screen.</li>
</ol>
<h3>Android (Chrome)</h3>
<ol>
<li>Open <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in Chrome.</li>
<li>Tap the <strong>⋮</strong> menu in the top-right.</li>
<li>Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong> on newer versions).</li>
<li>Confirm. The icon appears in your launcher.</li>
</ol>

<h2>Permissions</h2>
<p>Kaynos asks for permissions only when you use a feature that needs them. If you denied one earlier, grant it from your device settings — the in-app prompt won't reappear.</p>

<h3>Camera and microphone (recording from the app)</h3>
<p>Granted on first use. If you denied by accident:</p>
<ul>
<li><strong>iOS Safari:</strong> Settings app → Safari → Camera (and Microphone) → set Kaynos to <strong>Allow</strong>. If Kaynos isn't listed, open the site once first.</li>
<li><strong>iOS PWA installed to home screen:</strong> Settings app → scroll to <strong>Kaynos</strong> in the app list → toggle Camera / Microphone.</li>
<li><strong>Android Chrome:</strong> in Chrome, tap the <strong>⋮</strong> menu → Settings → Site settings → Camera (or Microphone) → find <code>app.kaynos.net</code> → set to Allow.</li>
</ul>

<h3>Microphone (voice notes)</h3>
<p>Hold the mic button in the note composer to record a voice note (up to 60 seconds); it's transcribed automatically by Deepgram. Same permission path as Camera/Microphone above. Deepgram processes the audio in real time and doesn't keep it — see <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">Privacy on this site</a>.</p>

<h3>Photos / files (selecting a video to upload)</h3>
<ul>
<li><strong>iOS:</strong> tapping <strong>Upload</strong> shows the iOS picker — choose <strong>Photo Library</strong>, <strong>Take Photo or Video</strong>, or <strong>Choose Files</strong>. iOS may ask for photo-library access on first use.</li>
<li><strong>Android:</strong> a similar system picker appears — Files, Photos, or your gallery app.</li>
</ul>

<h2>Notifications</h2>
<p>Kaynos supports <strong>push notifications</strong> on mobile: notes from your coach, @mentions, replies, and review-request updates can pop on your phone like any app notification.</p>
<ul>
<li><strong>iOS:</strong> install Kaynos to your home screen first (push requires the installed PWA, iOS 16.4+), open it, and allow notifications when prompted.</li>
<li><strong>Android:</strong> allow notifications when Chrome asks, or enable them from the site settings for <code>app.kaynos.net</code>.</li>
</ul>
<p>Email remains the fallback for everything — configure per-event toggles under <a href="#profile" onclick="navigate('profile');return false">Profile → Notifications</a>. Staff can verify their setup with the notification test in the app, which reports delivery per channel (bell, push, email).</p>

<h2>Recording and uploading from a phone</h2>

<h3>What works well</h3>
<ul>
<li>Short clips (under a few minutes) record and upload reliably on most phones from 2020 onward.</li>
<li>Multipart upload kicks in at <strong>20 MB</strong> with parallel parts and automatic retry, so a brief signal hiccup doesn't restart the whole upload.</li>
<li>Uploads continue while the app is in the foreground or backgrounded briefly. <strong>Long uploads work best with the screen on.</strong></li>
</ul>

<h3>What to watch out for</h3>
<ul>
<li><strong>Screen lock pauses uploads.</strong> If a 30-minute class video is uploading and your phone sleeps, the upload pauses. Progress isn't lost — reopen the page and reselect the same file and it resumes from the last completed chunk (upload URLs stay valid for 6 hours). Plug in and disable auto-lock for long uploads anyway.</li>
<li><strong>Hot phone during recording.</strong> Long recordings heat the phone, which can throttle the camera. For 30+ minutes of footage, a dedicated camera or a laptop-tethered phone is more reliable.</li>
<li><strong>Storage on the phone.</strong> A 1080p video at typical bitrates is roughly 1 GB per 10 minutes. Check free space before recording — you can upload from the camera roll later.</li>
<li><strong>Cellular data.</strong> Uploading a 1 GB video on cellular eats your plan. Default to Wi-Fi. The <a href="#uploading" onclick="navigate('uploading');return false">upload time calculator</a> on the Uploading page helps you sanity-check before starting.</li>
</ul>

<h2>Mobile playback tips</h2>
<ul>
<li><strong>Skip:</strong> double-tap the left half of the player to skip back 10 seconds, the right half to skip forward.</li>
<li><strong>Landscape:</strong> rotate to widen the player when the notes panel is open.</li>
<li><strong>Resume:</strong> playback position syncs across devices — start on your phone at the gym, finish on your laptop at home.</li>
<li><strong>Picture-in-picture (iOS Safari, Android Chrome):</strong> tap the PiP button to keep watching while reading notes in another tab.</li>
</ul>

<h2>Battery and data</h2>
<ul>
<li>Recording and uploading both drain the battery fast. Plug in for anything over 15 minutes.</li>
<li>Streaming playback uses 0.5–2 GB per hour of 1080p. The player adapts to bandwidth, so slower connections get a lower bitrate automatically.</li>
<li>On a strict cellular plan, load the video over Wi-Fi first, then watch later from the same browser session.</li>
</ul>

<h2>Troubleshooting</h2>
<ul>
<li><strong>"This site can't be reached" after install:</strong> stale PWA cache. Remove the home-screen shortcut and re-add it from the current app URL.</li>
<li><strong>Permission prompt won't reappear:</strong> you denied earlier. Use the device settings paths above.</li>
<li><strong>Upload stuck:</strong> see the <a href="#troubleshoot" onclick="navigate('troubleshoot');return false">troubleshooting wizard</a> — pick "Upload won't finish".</li>
<li><strong>Browser shows the old version:</strong> hard-refresh (long-press refresh on Safari iOS; pull-to-refresh on Chrome Android), or clear site data for app.kaynos.net.</li>
</ul>

<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Need a desktop-class flow? See <a href="#uploading" onclick="navigate('uploading');return false">Uploading videos</a> and <a href="#playback" onclick="navigate('playback');return false">Watching and reviewing</a> for the full workflow.</div></div>`},

    faq: {
      title: "Frequently asked questions", section: "Getting Started",
      content: `
<h1>Frequently asked questions</h1>
<div class="tldr"><strong>TLDR:</strong> Common pre-purchase and account questions, grouped: signup &amp; what you're getting, day-to-day running, trust &amp; minors on camera, devices &amp; integrations, support, billing &amp; pricing, search &amp; navigation, data, remote coaching, and the API question. For account-specific issues, ${mailLink('email support')} or use the in-app support form.</div>
<p>Kaynos is built for coaches who use video review: publish sessions and classes, add timestamped notes, and members watch on their own time.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div><strong>Quick links:</strong> App: <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> · Support: ${mailLink()} · Setup: <a href="#setup" onclick="navigate('setup');return false">Setting up your account</a></div></div>
<h2>What you're signing up for</h2>
<h3>What is Kaynos, in plain language?</h3>
<p>It replaces ad-hoc clip sharing in chat. Upload session footage to a <strong>session</strong> (one student) or a <strong>class</strong> (everyone in your account), add timeline notes, and students review on their own time. Everything runs in the browser at <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> — no app install.</p>
<h3>Do my students need to install something?</h3>
<p>No. They open <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> in any phone or laptop browser. Practical bandwidth: <strong>5 Mbps down for smooth 1080p playback</strong>, <strong>10 Mbps up for a 1080p upload</strong>. The <a href="#uploading" onclick="navigate('uploading');return false">Uploading videos</a> page has a calculator for larger files and slower connections.</p>
<h3>What types of coaching does this work for?</h3>
<p>Kaynos works for any coaching practice that reviews video: personal training, sports coaching, music lessons, dance instruction, or any skill-based teaching.</p>
<hr>
<h2>Running your account</h2>
<h3>Do you cap how many students or coaches I can add?</h3>
<p>No. The product does not enforce a member or coach limit.</p>
<h3>Can students watch each other's private lessons?</h3>
<p><strong>No.</strong> A <strong>session</strong> is visible only to that student, the staff who created or need it, and admins. <strong>Classes</strong> are shared with everyone in your account.</p>
<h3>Can people download my class video?</h3>
<p>There's no download button. Playback uses expiring streaming links, making your curriculum harder to copy as a casual file share.</p>
<hr>
<h2>Trust, minors on camera, and policy</h2>
<h3>How serious are you about security?</h3>
<p>HTTPS in transit, hashed passwords, and video in cloud storage served via short-lived presigned URLs. See <a href="#storage" onclick="navigate('storage');return false">Video storage and retention</a> for details.</p>
<h3>Which third parties process my data?</h3>
<p>The full subprocessor list is on the <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">privacy page</a>. Headline subprocessors: <strong>Stripe</strong> (billing), <strong>Resend</strong> (transactional email), <strong>Backblaze B2</strong> (video storage), and <strong>Neon</strong> (Postgres). Optional features use <strong>Twelve Labs</strong> (AI video review — currently disabled platform-wide), <strong>Deepgram</strong> (voice note transcription), <strong>Twilio</strong> (SMS lesson notifications), and <strong>Google</strong> (calendar availability, sign-in). Audio sent to Deepgram is processed in real time and is not stored by Deepgram.</p>
<h3>What about minors on the footage?</h3>
<p>Kaynos is not designed for users under 13 (COPPA) or under 16 in the EU (GDPR Article 8). Organizations using Kaynos with minors must obtain appropriate parental or guardian consent. Schools using Kaynos for student records can request a FERPA-compliant data processing agreement.</p>
<p>Read the <a href="https://app.kaynos.net/terms" target="_blank" rel="noopener">Terms of Service</a> in the app. For legal questions, consult qualified counsel.</p>
<h3>Do you comply with state privacy laws?</h3>
<p>Yes. Kaynos complies with applicable US privacy laws including CCPA/CPRA (California), VCDPA (Virginia), CPA (Colorado), CTDPA (Connecticut), and others. We do not sell personal information. See our <a href="#privacy-on-this-site" onclick="navigate('privacy-on-this-site');return false">privacy page</a> for details on your rights.</p>
<hr>
<h2>Devices and integrations</h2>
<h3>Which browsers are supported?</h3>
<p>Current Chrome, Firefox, Safari, and Edge. If upload or playback fails, try Chrome first.</p>
<h3>Do you expose an API?</h3>
<p>No — there's no public developer API, API keys, or webhooks today. The REST endpoints behind the app are internal and can change between releases. For getting data out, use the admin exports (JSON and CSV). Details on the <a href="#developer-api" onclick="navigate('developer-api');return false">Developer API</a> page.</p>
<hr>
<h2>Support</h2>
<h3>How do I contact you?</h3>
<p>Email ${mailLink()} with what happened, what you expected, your account name, and your browser. A screenshot or short screen recording speeds up diagnosis. Signed in? The <strong>Support</strong> page in <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> files a ticket with a reference number — replies within 1 business day.</p>
<h3>Can I delete my account?</h3>
<p>Yes. Delete your own account from <strong>Profile → Delete Account</strong>. Admins can schedule school deletion from <strong>Admin → Delete School</strong> — a 30-day grace period lets you cancel. After 30 days, all data is permanently removed.</p>
<hr>
<h2>Billing and pricing</h2>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Full coverage of refunds, invoices, taxes, failed payment, pausing, and cancellation lives on the dedicated <a href="#billing" onclick="navigate('billing');return false">Billing &amp; subscription</a> page.</div></div>
<h3>How much does Kaynos cost?</h3>
<p>Plan pricing, what's included, and free-trial terms live on the <a href="https://www.kaynos.net/#pricing" target="_blank" rel="noopener noreferrer">Kaynos pricing page</a> — the single source of truth, so this help center never drifts. A card is required to start the trial; cancel before it ends and you won't be charged.</p>
<h3>What happens when my trial ends?</h3>
<p>Billing starts automatically when the trial ends. Cancel before it ends and you won't be charged. Your data stays available while your subscription is active.</p>
<h3>Where do I see how many trial days are left?</h3>
<p>Sign in as an admin and open your <strong>Profile</strong> (avatar in the header). The Billing section shows your status (trialing, active, past due, or cancelled) and, during a trial, when it ends.</p>
<h3>How do I manage my subscription?</h3>
