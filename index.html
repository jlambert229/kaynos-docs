  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #060609;
      --bg-elevated:  #111115;
      --bg-secondary: #1a1a20;
      --bg-tertiary:  #252530;
      --bg-glass:     rgba(6,6,9,0.88);
      --bg-hover:     rgba(255,255,255,0.04);
      --bg-active:    rgba(255,255,255,0.07);
      --text-primary:   #f0f0f6;
      --text-secondary: rgba(240,240,246,0.65);
      --text-tertiary:  rgba(255,255,255,.62);
      --border:         rgba(255,255,255,0.07);
      --border-strong:  rgba(255,255,255,0.12);
      --accent:         #2184f3;
      --accent-hover:   #4da3f7;
      --accent-soft:    rgba(33,132,243,0.10);
      --accent-border:  rgba(33,132,243,0.25);
      --success:        #40c057;
      --success-soft:   rgba(64,192,87,0.10);
      --warning:        #fd7e14;
      --warning-soft:   rgba(253,126,20,0.10);
      --danger:         #fa5252;
      --danger-soft:    rgba(250,82,82,0.10);
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      --sidebar-w: 268px;
      /* 56px header + iOS notch / status-bar inset so .layout, .sidebar,
         scroll-margin offsets all stay synced when the inset is non-zero. */
      --header-h: calc(56px + env(safe-area-inset-top));
      --radius:    10px;
      --radius-sm: 7px;
      --radius-xs: 4px;
      --shadow:    0 1px 12px rgba(0,0,0,.35), 0 0 1px rgba(255,255,255,.04);
      --shadow-lg: 0 8px 40px rgba(0,0,0,.50), 0 0 1px rgba(255,255,255,.05);
      --ease: cubic-bezier(0.22,0.61,0.36,1);
      --dur: 0.14s;
      color-scheme: dark;
    }

    /* ── LIGHT MODE ─── */
    :root.light {
      --bg:           #ffffff;
      --bg-elevated:  #f8f9fa;
      --bg-secondary: #f1f3f5;
      --bg-tertiary:  #e9ecef;
      --bg-glass:     rgba(255,255,255,0.92);
      --bg-hover:     rgba(0,0,0,0.03);
      --bg-active:    rgba(0,0,0,0.06);
      --text-primary:   #1a1a2e;
      --text-secondary: rgba(26,26,46,0.72);
      --text-tertiary:  rgba(0,0,0,.65);
      --border:         rgba(0,0,0,0.08);
      --border-strong:  rgba(0,0,0,0.14);
      --accent:         #1a6fdb;
      --accent-hover:   #1560c2;
      --accent-soft:    rgba(26,111,219,0.08);
      --accent-border:  rgba(26,111,219,0.22);
      --success:        #2b8a3e;
      --success-soft:   rgba(43,138,62,0.08);
      --warning:        #e8590c;
      --warning-soft:   rgba(232,89,12,0.08);
      --danger:         #e03131;
      --danger-soft:    rgba(224,49,49,0.08);
      --shadow:    0 1px 8px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.12);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.12), 0 0 1px rgba(0,0,0,.08);
      color-scheme: light;
    }

    html {
      font-size: 16px; scroll-behavior: smooth;
      text-size-adjust: 100%; -webkit-text-size-adjust: 100%;
      /* Block the iOS-Safari pull-to-refresh / rubber-band that constantly
         interrupts touch scrolling on a SPA. `none` on the doc element kills
         the pull-to-refresh; descendants opt back into normal overflow. */
      overscroll-behavior-y: none;
      /* Subtle accent-tinted tap flash — replaces iOS Safari's default dark
         square, which is invisible on the dark theme and ugly on light. */
      -webkit-tap-highlight-color: rgba(33, 132, 243, 0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      html { scroll-behavior: auto; }
    }

    /* Suppress the iOS long-press copy/share callout on icon-only controls.
       Text content (paragraphs, code, headings) keeps the default callout
       so users can still select and copy article text. */
    button, .menu-btn, .theme-toggle, .mobile-nav-btn, .header-logo,
    .heading-anchor, .copy-btn, .copy-code-btn, .copy-article-btn,
    .share-btn, .print-btn, .back-top, #back-top,
    .preflight-item, .wizard-option, .wizard-fb-btn, .wizard-restart,
    .release-filter-btn, .search-chip, .article-feedback-btn,
    .article-feedback-submit, .form-submit, .form-another, .contact-submit,
    .quick-link .ql-icon, .feature-card, .related-card, .footer-nav-btn,
    .sidebar-section-title, .next-step {
      -webkit-touch-callout: none;
    }

    /* Default to no double-tap-zoom + no 300ms click delay on every
       interactive control. Pinch-zoom (browser-level) still works for
       accessibility — this only suppresses the per-element double-tap. */
    button, a { touch-action: manipulation; }

    * { scrollbar-width: thin; scrollbar-color: var(--bg-tertiary) transparent; }
    *::-webkit-scrollbar { width: 5px; height: 5px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 9999px; }

    ::selection { background: rgba(33,132,243,.28); color: var(--text-primary); }

    /* Strip iOS Safari's default chrome on text-like inputs — rounded corners,
       inner shadow, the search-input X button — so our custom styling is the
       only one applied. textarea gets resize control kept on purpose. */
    input[type="text"], input[type="search"], input[type="email"], input[type="url"],
    input[type="tel"], input[type="number"], input[type="password"], textarea, select {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0; /* let component classes set their own radius */
    }
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { display: none; }

    body {
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--bg);
      line-height: 1.6;
      font-size: .9375rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── READING PROGRESS ─── */
    #progress-bar,
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: var(--accent);
      z-index: 9999; transition: width .1s linear; pointer-events: none;
    }

    /* ── HEADER ─── */
    /* --header-h already includes env(safe-area-inset-top), so this height
       covers the notch / status bar in PWA mode and landscape. padding-top
       pushes the controls down below the system UI. Left/right padding
       consumes any horizontal inset on landscape iPhones with a notch so
       buttons don't disappear under the cutout. */
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      padding-top: env(safe-area-inset-top);
      padding-left: calc(20px + env(safe-area-inset-left));
      padding-right: calc(20px + env(safe-area-inset-right));
      background: var(--bg-glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      z-index: 100; gap: 12px;
    }

    .header-logo {
      font-weight: 600; font-size: .9063rem; letter-spacing: -.025em;
      color: var(--text-primary); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0; white-space: nowrap;
    }
    .header-logo-icon {
      width: 26px; height: 26px; background: #050508;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .header-logo-sep { color: var(--text-tertiary); font-weight: 400; margin: 0 1px; }
    .header-logo-sub { color: var(--text-tertiary); font-weight: 400; font-size: 13px; }

    .header-search { flex: 1; max-width: 380px; position: relative; }
    .header-search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-tertiary); pointer-events: none; display: flex;
    }
    .header-search input {
      width: 100%; height: 34px;
      padding: 0 72px 0 34px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      font-family: var(--font-body); font-size: .875rem; color: var(--text-primary);
      outline: none; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .header-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(33,132,243,.10);
    }
    .header-search input::placeholder { color: var(--text-tertiary); }
    .search-kbd {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 2px; pointer-events: none;
    }
    .search-kbd kbd {
      font-family: var(--font-body); font-size: 10px;
      color: var(--text-tertiary); border: 1px solid var(--border-strong);
      border-radius: 3px; padding: 1px 4px; background: var(--bg-tertiary);
    }

    .search-results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius); max-height: 400px; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: none; box-shadow: var(--shadow-lg); z-index: 110;
    }
    .search-results.active { display: block; }
    .search-result {
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border); font-size: .875rem;
      transition: background var(--dur);
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover, .search-result.focused { background: var(--bg-hover); }
    .search-result .sr-title { font-weight: 500; margin-bottom: 2px; }
    .search-result .sr-section { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .05em; }
    .search-result .sr-snippet { font-size: .8125rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
    .search-result mark { background: rgba(33,132,243,.20); color: var(--accent-hover); border-radius: 2px; padding: 0 2px; }
    .sr-badge { display: inline-flex; margin-left: 6px; vertical-align: middle; }
    .sr-badge svg { width: 11px; height: 11px; }
    .search-empty { padding: 24px 14px; text-align: center; color: var(--text-tertiary); font-size: .875rem; }
    .search-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .search-chip {
      padding: 3px 10px; font-size: .75rem; font-family: inherit;
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-strong); border-radius: 9999px; cursor: pointer;
      transition: background var(--dur), color var(--dur), border-color var(--dur);
    }
    .search-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
    .search-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .header-spacer { flex: 1; }

    .header-app-link {
      flex-shrink: 0; font-size: .875rem; font-weight: 500;
      color: var(--text-secondary); text-decoration: none;
      white-space: nowrap; padding: 5px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      transition: all var(--dur) var(--ease);
      display: flex; align-items: center; gap: 5px;
    }
    .header-app-link:hover {
      color: var(--text-primary); border-color: var(--accent);
      background: var(--accent-soft); text-decoration: none;
    }

    .menu-btn {
      display: none; background: none; border: none;
      color: var(--text-secondary); cursor: pointer;
      padding: 6px; border-radius: var(--radius-sm);
      transition: color var(--dur), background var(--dur); flex-shrink: 0;
    }
    .menu-btn:hover { color: var(--text-primary); background: var(--bg-hover); }

    .theme-toggle {
      background: none; border: 1px solid var(--border-strong);
      color: var(--text-secondary); cursor: pointer;
      padding: 5px 8px; border-radius: var(--radius-sm);
      transition: all var(--dur); display: flex; align-items: center;
      flex-shrink: 0; font-size: 14px; line-height: 1;
    }
    .theme-toggle:hover { color: var(--text-primary); border-color: var(--accent); background: var(--accent-soft); }

    /* ── LAYOUT ─── */
    .layout {
      margin-top: var(--header-h);
      margin-left: var(--sidebar-w);
      min-height: calc(100vh - var(--header-h));
      min-height: calc(100dvh - var(--header-h));
    }

    /* ── SIDEBAR ─── */
    .sidebar {
      position: fixed; top: var(--header-h); left: 0;
      width: var(--sidebar-w);
      height: calc(100vh - var(--header-h));
      height: calc(100dvh - var(--header-h));
      background: var(--bg-elevated); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 16px 0 32px; z-index: 90;
      transition: transform .22s var(--ease);
    }
    .sidebar-section { margin-bottom: 4px; }
    .sidebar-section-title {
      padding: 10px 16px 4px; font-size: .6563rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .09em; color: var(--text-tertiary);
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; transition: color var(--dur); gap: 6px;
      width: 100%; background: none; border: 0; text-align: left; font: inherit;
      touch-action: manipulation;
    }
    @media (max-width: 768px) {
      .sidebar-section-title { padding: 12px 16px; min-height: 44px; }
    }
    .sidebar-section-title svg { width: 12px; height: 12px; flex-shrink: 0; opacity: .6; }
    .sidebar-section-title:hover { color: var(--text-secondary); }
    .sidebar-section-title .chevron {
      transition: transform .18s var(--ease); font-size: 9px; opacity: .5;
    }
    .sidebar-section.collapsed .chevron { transform: rotate(-90deg); }
    .sidebar-section.collapsed .sidebar-links { display: none; }
    .sidebar-link {
      display: block; padding: 6px 16px 6px 20px;
      font-size: .875rem; color: var(--text-secondary);
      text-decoration: none; transition: color var(--dur), background var(--dur);
      cursor: pointer; border-left: 2px solid transparent;
      margin: 1px 0; touch-action: manipulation;
    }
    @media (max-width: 768px) {
      .sidebar-link { display: flex; align-items: center; min-height: 44px; padding: 8px 16px 8px 20px; }
    }
    .sidebar-link:hover { color: var(--text-primary); background: var(--bg-hover); }
    .sidebar-link.active {
      color: var(--accent); border-left-color: var(--accent);
      font-weight: 500; background: var(--accent-soft);
    }

    /* ── CONTENT ─── */
    .content { min-width: 0; display: flex; justify-content: center; }
    .content-with-toc {
      width: 100%; display: flex; justify-content: center;
      padding: 40px 48px 96px;
    }
    .content-wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; }

    /* ── PAGE TRANSITION ───
       Opacity-only fade — no transform, so descendant positions don't shift
       during the .18s animation. fadeUp (below) keeps the upward-translate
       feel for smaller in-page elements where layout stability isn't fragile. */
    .content-inner { animation: fadeIn .18s var(--ease); }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── TYPOGRAPHY ─── */
    .content-inner h1 {
      font-size: 2rem; font-weight: 700; letter-spacing: -.035em;
      line-height: 1.15; margin-bottom: 6px; color: var(--text-primary);
    }
    .article-meta {
      font-size: .8125rem; color: var(--text-tertiary); margin-bottom: 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .article-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-tertiary); }
    .breadcrumb-trail {
      font-size: .75rem; color: var(--text-tertiary); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      text-transform: uppercase; letter-spacing: .08em; font-weight: 500;
    }
    .breadcrumb-section { color: var(--text-tertiary); }
    .breadcrumb-sep { color: var(--text-tertiary); opacity: .55; }
    .breadcrumb-current { color: var(--text-secondary); text-transform: none; letter-spacing: 0; font-weight: 400; }
    .read-time {
      font-size: .75rem;
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .content-inner h2 {
      font-size: 1.1875rem; font-weight: 600; letter-spacing: -.015em;
      margin-top: 44px; margin-bottom: 14px;
      padding-top: 28px; border-top: 1px solid var(--border);
      line-height: 1.3; scroll-margin-top: calc(var(--header-h) + 16px);
    }
    .content-inner h2:first-of-type { border-top: none; padding-top: 0; margin-top: 28px; }
    .heading-anchor {
      opacity: 0; margin-left: 6px; color: var(--text-tertiary);
      text-decoration: none; font-weight: 400; transition: opacity var(--dur), color var(--dur);
      cursor: pointer; font-size: .85em;
    }
    .content-inner h2:hover .heading-anchor,
    .content-inner h3:hover .heading-anchor,
    .heading-anchor:focus { opacity: 1; }
    .heading-anchor:hover { color: var(--accent); }
    /* On touch devices there's no hover, so the anchor is invisible by default.
       Show it at low opacity so the affordance is discoverable. */
    @media (hover: none) {
      .heading-anchor { opacity: .45; }
    }
    .content-inner h3 {
      font-size: 1rem; font-weight: 600; margin-top: 28px; margin-bottom: 10px;
      color: var(--text-primary); scroll-margin-top: calc(var(--header-h) + 16px);
    }
    /* Disclosure widgets share the same scroll offset so clicking an in-page
       link to a <details> doesn't land it underneath the sticky header. */
    .content-inner > details, .content-inner > details > summary {
      scroll-margin-top: calc(var(--header-h) + 16px);
    }
    .content-inner p { margin-bottom: 16px; color: var(--text-secondary); line-height: 1.7; }
    .content-inner ul, .content-inner ol { margin-bottom: 16px; padding-left: 22px; }
    .content-inner li { margin-bottom: 7px; color: var(--text-secondary); line-height: 1.65; }
    .content-inner strong { font-weight: 600; color: var(--text-primary); }
    .content-inner code {
      font-family: var(--font-mono); font-size: .8125rem;
      background: var(--bg-secondary); padding: 2px 6px;
      border-radius: var(--radius-xs); color: var(--accent-hover);
      border: 1px solid var(--border);
    }
    .content-inner a { color: var(--accent); text-decoration: none; transition: color var(--dur); }
    .content-inner a:hover { color: var(--accent-hover); text-decoration: underline; text-decoration-color: rgba(33,132,243,.4); }
    .content-inner hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }

    /* ── CODE BLOCKS ─── */
    .code-block-wrap { position: relative; margin-bottom: 20px; }
    .content-inner pre {
      background: var(--bg-secondary); padding: 16px 18px;
      border-radius: var(--radius-sm); font-family: var(--font-mono);
      font-size: .8125rem; overflow-x: auto;
      border: 1px solid var(--border); line-height: 1.65;
      color: var(--text-secondary); margin-bottom: 0;
    }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 9px; background: var(--bg-tertiary);
      border: 1px solid var(--border-strong); border-radius: var(--radius-xs);
      color: var(--text-tertiary); font-size: 11px; font-family: var(--font-body);
      cursor: pointer; transition: all var(--dur); opacity: 0;
    }
    .code-block-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text-primary); background: var(--bg-active); }
    .copy-btn.copied { color: var(--success); border-color: rgba(64,192,87,.4); }

    pre, .code-block { position: relative; }
    .copy-code-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 4px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-tertiary);
      font-size: .7rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    pre:hover .copy-code-btn, .code-block:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-code-btn.copied { color: var(--success); border-color: var(--success); }
    /* On touch (no hover), keep copy buttons partly visible so the affordance
       is discoverable without first tapping the code block. */
    @media (hover: none) {
      .copy-code-btn { opacity: .65; }
      .copy-btn { opacity: .65; }
    }

    .open-in-app {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff !important;
      border-radius: var(--radius);
      text-decoration: none !important;
      font-size: .8125rem;
      font-weight: 600;
      margin: 8px 0 16px;
      transition: background var(--dur) var(--ease);
    }
    .open-in-app:hover { background: var(--accent-hover); color: #fff !important; }
    .open-in-app svg { width: 14px; height: 14px; }

    /* ── TABLES ─── */
    .table-wrap { overflow-x: auto; margin-bottom: 24px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .content-inner table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .content-inner th {
      text-align: left; padding: 10px 14px;
      background: var(--bg-secondary); font-weight: 600;
      font-size: .8125rem; color: var(--text-secondary);
      border-bottom: 1px solid var(--border-strong); white-space: nowrap;
    }
    .content-inner td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-secondary); }
    .content-inner tr:last-child td { border-bottom: none; }
    .content-inner tr:hover td { background: var(--bg-hover); }

    /* ── HINTS ─── */
    .hint {
      padding: 13px 16px; border-radius: var(--radius-sm);
      margin-bottom: 20px; font-size: .875rem;
      display: flex; gap: 10px; line-height: 1.65;
    }
    .hint-icon { flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; }
    .hint-icon svg { width: 16px; height: 16px; }
    .hint-warning  { background: var(--warning-soft); border: 1px solid rgba(253,126,20,.28); border-left: 3px solid var(--warning); }
    .hint-info     { background: var(--accent-soft);  border: 1px solid var(--accent-border); border-left: 3px solid var(--accent); }
    .hint-tip      { background: var(--success-soft); border: 1px solid rgba(64,192,87,.28); border-left: 3px solid var(--success); }
    .hint-danger   { background: var(--danger-soft);  border: 1px solid rgba(250,82,82,.28); border-left: 3px solid var(--danger); }
    .hint-info a, .hint-warning a, .hint-tip a, .hint-danger a { color: var(--accent); font-weight: 500; }
    .hint > div:last-child { flex: 1; }

    /* ── TL;DR BOXES ─── */
    .tldr {
      background: var(--accent-soft, rgba(33,132,243,.08));
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      margin: 12px 0 20px;
      border-radius: var(--radius-sm);
      font-size: .875rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .tldr strong { color: var(--text-primary); }
    .light .tldr { background: rgba(33,132,243,.06); }

    /* ── QUICK LINKS ─── */
    .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
    @media (min-width: 640px) { .quick-links { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    .quick-link.featured { border-color: var(--accent-border); background: var(--accent-soft); }
    .quick-link.featured:hover { border-color: var(--accent); background: var(--bg-secondary); }
    .quick-link {
      padding: 14px 16px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      text-decoration: none; color: var(--text-primary);
      transition: border-color var(--dur), box-shadow var(--dur), background var(--dur), transform var(--dur);
      cursor: pointer; font-size: .875rem; display: flex; flex-direction: column; gap: 3px;
    }
    .quick-link:hover {
      border-color: var(--accent); background: var(--bg-secondary);
      box-shadow: 0 0 0 1px rgba(33,132,243,.12), var(--shadow);
      text-decoration: none;
    }
    /* The lift transform sticks on iOS Safari after a tap until the user
       taps elsewhere — gate it on real hover so phones don't show a
       "stuck up" card after navigation. */
    @media (hover: hover) {
      .quick-link:hover { transform: translateY(-1px); }
    }
    .quick-link .ql-icon { margin-bottom: 6px; display: flex; color: var(--accent); }
    .quick-link .ql-icon svg { width: 22px; height: 22px; }
    .quick-link .ql-title { font-weight: 500; color: var(--text-primary); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .quick-link .ql-aud {
      font-size: .6875rem; font-weight: 500; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-tertiary);
      border: 1px solid var(--border); border-radius: 9999px;
      padding: 1px 7px; background: var(--bg-secondary);
    }
    .quick-link .ql-desc { font-size: .8125rem; color: var(--text-secondary); line-height: 1.4; }

    /* ── FEATURE OVERVIEW ─── */
    .feature-overview { margin: 16px 0 24px; }
    .feature-overview summary { cursor: pointer; font-size: .9375rem; color: var(--text-secondary); padding: 10px 0; }
    .feature-overview summary:hover { color: var(--accent); }
    .feature-overview[open] summary { margin-bottom: 12px; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .feature-card { display: block; background: var(--bg-secondary); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease); text-decoration: none !important; color: inherit !important; cursor: pointer; }
    .feature-card:hover { border-color: var(--accent); color: inherit !important; }
    @media (hover: hover) { .feature-card:hover { transform: translateY(-1px); } }
    .feature-card h4 { margin: 8px 0 6px; font-size: .875rem; color: var(--text-primary); }
    .feature-card p { font-size: .8125rem; color: var(--text-secondary); line-height: 1.5; margin: 0; }
    .feature-icon { width: 28px; height: 28px; color: var(--accent); }
    .feature-icon svg { width: 100%; height: 100%; }

    /* ── BREADCRUMB ─── */
    .breadcrumb {
      font-size: .8125rem; color: var(--text-tertiary);
      margin-bottom: 20px; display: flex; align-items: center; gap: 6px;
    }
    .breadcrumb a { color: var(--text-tertiary); text-decoration: none; transition: color var(--dur); cursor: pointer; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb-sep { opacity: .4; }
    .breadcrumb-current { color: var(--text-secondary); }

    /* ── FOOTER NAV ─── */
    .footer-nav {
      display: flex; justify-content: space-between;
      margin-top: 56px; padding-top: 24px;
      border-top: 1px solid var(--border); gap: 12px;
    }
    .footer-nav-btn {
      text-decoration: none; padding: 12px 16px;
      border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
      background: var(--bg-elevated); transition: all var(--dur);
      display: flex; flex-direction: column; gap: 3px;
      min-width: 0; flex: 1; max-width: 240px; cursor: pointer;
    }
    .footer-nav-btn.next { align-items: flex-end; margin-left: auto; }
    .footer-nav-btn:hover { border-color: var(--accent); background: var(--bg-secondary); }
    .fn-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .05em; }
    .fn-title { font-size: .875rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── INLINE "ON THIS PAGE" CALLOUT ─── */
    /* Renders only on long pages (≥6 H2s). Up to 10 items: comma-flowing       */
    /* horizontal layout. Above 10: switches to a vertical list and wraps in    */
    /* <details> so the reader can collapse it.                                 */
    .page-toc {
      margin: 0 0 24px; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg-secondary);
      font-size: .8125rem; color: var(--text-tertiary);
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
    }
    .page-toc-label {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .09em; color: var(--text-tertiary); margin-right: 6px;
      flex-shrink: 0;
    }
    .page-toc a {
      color: var(--text-secondary); text-decoration: none;
      transition: color var(--dur);
    }
    .page-toc a:hover { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(33,132,243,.4); }
    .page-toc-sep { color: var(--text-tertiary); user-select: none; }

    /* Dense mode: vertical list, wrapped in <details> for collapse. */
    details.page-toc { display: block; padding: 0; }
    details.page-toc > summary {
      list-style: none; cursor: pointer; padding: 10px 14px;
      display: flex; align-items: center; gap: 8px;
      color: var(--text-tertiary); font-size: 10.5px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    }
    details.page-toc > summary::-webkit-details-marker { display: none; }
    details.page-toc > summary::before {
      content: '▸'; font-size: 10px; transition: transform .15s var(--ease);
      color: var(--text-tertiary);
    }
    details.page-toc[open] > summary::before { transform: rotate(90deg); }
    details.page-toc > summary .page-toc-count {
      margin-left: auto; font-weight: 400; text-transform: none;
      letter-spacing: 0; font-size: .75rem; color: var(--text-tertiary);
    }
    details.page-toc > .page-toc-list {
      padding: 0 14px 10px 26px; display: grid; gap: 4px;
      grid-template-columns: 1fr 1fr; column-gap: 18px;
    }
    @media (max-width: 720px) {
      details.page-toc > .page-toc-list { grid-template-columns: 1fr; }
    }
    details.page-toc > .page-toc-list a {
      color: var(--text-secondary); font-size: .8125rem;
      text-decoration: none; transition: color var(--dur);
    }
    details.page-toc > .page-toc-list a:hover { color: var(--accent); }

    /* Page-level opt-in for wider content (tables, comparison grids).
       Use <main class="content-inner" data-wide> or set data-wide on the wrap. */
    .content-wrap[data-wide], .content-inner[data-wide] { max-width: 960px !important; }
    .content-wrap[data-wide] { max-width: 960px; }

    /* ── TABLET ─── */
    @media (min-width: 769px) and (max-width: 1199px) {
      .content-with-toc { padding: 32px 28px 80px; }
      .sidebar { width: 220px; }
      .layout { margin-left: 220px; }
    }

    /* ── BACK TO TOP ─── */
    #back-top {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      right: calc(28px + env(safe-area-inset-right, 0px));
      width: 44px; height: 44px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); cursor: pointer; box-shadow: var(--shadow);
      transition: all var(--dur) var(--ease);
      opacity: 0; pointer-events: none; z-index: 50;
    }
    #back-top.visible { opacity: 1; pointer-events: auto; }
    #back-top:hover { color: var(--text-primary); border-color: var(--accent); background: var(--bg-secondary); }

    /* ── TOAST ─── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); padding: 8px 16px;
      font-size: .875rem; color: var(--text-primary);
      box-shadow: var(--shadow-lg); z-index: 150;
      opacity: 0; transition: all .2s var(--ease); pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── OVERLAY ─── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.60); z-index: 85;
      backdrop-filter: blur(2px);
    }
    .overlay.active { display: block; }

    /* ── WELCOME HERO ─── */
    .hero { padding: 32px 0 36px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 500; color: var(--accent);
      background: var(--accent-soft); border: 1px solid var(--accent-border);
      border-radius: 9999px; padding: 3px 10px; margin-bottom: 18px;
      text-transform: uppercase; letter-spacing: .07em;
    }
    .hero h1 {
      font-size: 2.375rem !important; font-weight: 700;
      letter-spacing: -.04em !important; line-height: 1.1;
      margin-bottom: 14px !important;
    }
    .hero p { font-size: 1.0625rem; color: var(--text-secondary); line-height: 1.65; max-width: 520px; margin-bottom: 0; }

    /* ── SUPPORT CARD ─── */
    .support-card {
      padding: 18px 20px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      margin-top: 4px; display: flex; flex-direction: column; gap: 10px;
    }
    .support-item { display: flex; align-items: flex-start; gap: 10px; font-size: .875rem; color: var(--text-secondary); }
    .support-item-icon {
      width: 28px; height: 28px; background: var(--bg-secondary);
      border-radius: var(--radius-sm); display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; color: var(--accent);
    }
    .support-item-icon svg { width: 14px; height: 14px; }
    .support-item strong { color: var(--text-primary); font-weight: 500; }
    .support-item a { color: var(--accent); font-weight: 500; }

    /* ── MOBILE ─── */
    @media (max-width: 768px) {
      /* Body text bumps to 16px on mobile so paragraphs read at a comfortable
         size on phones without zoom — the desktop 15px feels cramped here. */
      body { font-size: 1rem; }
      .content-inner p, .content-inner li { font-size: 1rem; line-height: 1.65; }
      .sidebar { transform: translateX(-100%); z-index: 95; }
      .sidebar.open { transform: translateX(0); }
      .layout { margin-left: 0; }
      /* On landscape iPhone with a notch, env(safe-area-inset-left/right) is
         non-zero. Pad content away from the notch so paragraphs don't run
         under the cutout. */
      .content-with-toc {
        padding: 24px calc(20px + env(safe-area-inset-right))
                 80px calc(20px + env(safe-area-inset-left));
      }
      .quick-links { grid-template-columns: 1fr; }
      .menu-btn { display: flex; }
      .header-search { max-width: none; }
      .header-app-link span { display: none; }
      .footer-nav { flex-direction: column; }
      .footer-nav-btn { max-width: none; }
      .footer-nav-btn.next { align-items: flex-start; }
      .hero h1 { font-size: 1.75rem !important; }
      .share-btn, .print-btn,
      .copy-article-btn, .wizard-option, .checklist-item,
      .preflight-item { min-height: 44px; display: inline-flex; align-items: center; }
      .feature-grid { grid-template-columns: 1fr; }
      .next-steps-nav { flex-direction: column; gap: 8px; }
      .next-step { text-align: center; }
      .feature-form { max-width: 100%; }
      .open-in-app { padding: 12px 20px; font-size: .875rem; }
      .tldr { font-size: .8125rem; padding: 8px 12px; }
      .menu-btn, .theme-toggle, .header-app-link { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      .share-btn, .copy-article-btn, .print-btn { min-width: 44px; min-height: 44px; }
      input, textarea, select { font-size: 16px !important; }
      .mobile-nav { padding-bottom: env(safe-area-inset-bottom, 0); }
    }

    @media (max-width: 480px) {
      .feature-card { padding: 12px; }
      .feature-icon { width: 22px; height: 22px; }
    }

    :focus-visible { outline: 2px solid rgba(33,132,243,.6); outline-offset: 2px; }
    .sidebar-link:focus-visible, .quick-link:focus-visible, .header-logo:focus-visible {
      outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(33,132,243,.55);
    }
    .menu-btn:focus-visible, .theme-toggle:focus-visible,
    .share-btn:focus-visible,
    .print-btn:focus-visible, .copy-article-btn:focus-visible,
    .wizard-option:focus-visible,
    .mobile-nav-btn:focus-visible, .header-app-link:focus-visible {
      outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(33,132,243,.55);
    }
    .open-in-app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .next-step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .feature-overview summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .form-submit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .form-another:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .copy-code-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }

    .open-in-app:active { transform: scale(0.98); }
    .next-step:active { transform: scale(0.98); }
    .form-submit:active { transform: scale(0.98); }
    .feature-overview summary:active { opacity: 0.8; }

    /* ── SKIP LINK ─── */
    .skip-link {
      position: fixed; top: -100%; left: 16px; z-index: 999;
      background: var(--accent); color: #fff; padding: 8px 16px;
      border-radius: var(--radius-sm); font-size: .875rem; font-weight: 500;
      text-decoration: none; transition: top .15s var(--ease);
    }
    .skip-link:focus { top: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    /* ── PRINT STYLES ─── */
    @media print {
      .header, .sidebar, .toc, #back-top, #toast, #progress-bar,
      .footer-nav, .skip-link, .overlay, .menu-btn, .copy-btn,
      .mobile-nav,
      .kbd-modal-overlay, .offline-banner,
      .article-actions, .share-btn, .print-btn,
      .heading-anchor, .wizard-feedback, .wizard-escalate,
      .wizard-restart, .checklist, .related-articles,
      .step-tips, .preflight, .calc-wrap,
      .breadcrumb, .error-lookup,
      .theme-toggle, .search-kbd,
      .welcome-back,
      .copy-article-btn, .user-highlight,
      .feature-overview, .feature-form, .open-in-app, .next-steps,
      .scroll-progress, .copy-code-btn,
      .form-submit, .form-another, .contact-form, .contact-submit { display: none !important; }
      .layout { margin-left: 0 !important; }
      .content-with-toc { padding: 0 !important; }
      body { background: #fff; color: #111; font-size: 12pt; }
      .content-inner h1 { color: #111; }
      .content-inner h2, .content-inner h3 { color: #222; border-color: #ccc; }
      .content-inner p, .content-inner li { color: #333; }
      .content-inner a { color: #111; text-decoration: underline; }
      .content-inner a[href]::after { content: " (" attr(href) ")"; font-size: 9pt; color: #666; }
      .content-inner a[onclick]::after { content: none; }
      .hint { border: 1px solid #ccc; background: #f5f5f5 !important; }
      .quick-link { border: 1px solid #ccc; background: #f9f9f9 !important; }
      .content-inner pre { border: 1px solid #ccc; background: #f5f5f5 !important; }
      .content-inner code { background: #f0f0f0 !important; border-color: #ccc; color: #333; }
      .table-wrap { border-color: #ccc; }
      .content-inner th { background: #eee !important; color: #222; border-color: #ccc; }
      .content-inner td { color: #333; border-color: #ddd; }
    }

    /* ── KEYBOARD SHORTCUTS MODAL ─── */
    .kbd-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    .kbd-modal-overlay.active { display: flex; }
    .kbd-modal {
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius); padding: 24px 28px;
      max-width: 400px; width: 90%; box-shadow: var(--shadow-lg);
    }
    .kbd-modal h3 { margin: 0 0 16px; font-size: 1rem; font-weight: 600; color: var(--text-primary); }
    .kbd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .kbd-row span { font-size: .875rem; color: var(--text-secondary); }
    .kbd-row kbd {
      font-family: var(--font-body); font-size: 11px; color: var(--text-tertiary);
      border: 1px solid var(--border-strong); border-radius: 4px;
      padding: 2px 7px; background: var(--bg-tertiary); min-width: 24px; text-align: center;
    }
    .kbd-modal-close {
      margin-top: 16px; width: 100%; padding: 8px;
      background: var(--bg-secondary); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); color: var(--text-secondary);
      font-size: .8125rem; cursor: pointer; transition: all var(--dur);
    }
    .kbd-modal-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }

    /* ── RELATED ARTICLES ─── */
    .related-articles { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
    .related-title {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .09em; color: var(--text-tertiary); margin-bottom: 12px;
    }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .related-card {
      padding: 12px 14px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      text-decoration: none; transition: all var(--dur); cursor: pointer;
      display: flex; flex-direction: column; gap: 3px;
    }
    @media (max-width: 768px) {
      .related-card { min-height: 48px; justify-content: center; }
    }
    .related-card:hover { border-color: var(--accent); background: var(--bg-secondary); text-decoration: none; }
    @media (hover: hover) { .related-card:hover { transform: translateY(-1px); } }
    .related-card-title { font-size: .875rem; font-weight: 500; color: var(--text-primary); }
    .related-card-section { font-size: .75rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .04em; }
    .next-steps { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
    .next-steps-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); margin-bottom: 10px; }
    .next-steps-nav { display: flex; justify-content: space-between; gap: 12px; }
    .next-step { padding: 10px 16px; border-radius: var(--radius); background: var(--bg-secondary); color: var(--text-primary); text-decoration: none; font-size: .875rem; font-weight: 500; transition: background var(--dur) var(--ease), transform var(--dur) var(--ease); }
    .next-step:hover { background: var(--accent-soft, rgba(33,132,243,.12)); color: var(--accent); }
    @media (hover: hover) { .next-step:hover { transform: translateY(-1px); } }
    .next-step.prev { text-align: left; }
    .next-step.next { text-align: right; margin-left: auto; }

    /* ── SIDEBAR RECENT ─── */
    .sidebar-dynamic { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }
    .sidebar-dynamic:empty { display: none; border: none; padding: 0; margin: 0; }
    .sidebar-dynamic .sidebar-section-title { cursor: default; display: flex; align-items: center; gap: 6px; }
    .sidebar-dynamic .sidebar-section-title svg { width: 12px; height: 12px; flex-shrink: 0; }
    .sidebar-dynamic .sidebar-link { font-size: .8125rem; }
    .sidebar-recent-hide {
      margin-left: auto; background: none; border: none; color: var(--text-tertiary);
      font-size: 14px; line-height: 1; cursor: pointer; padding: 2px 6px;
      border-radius: var(--radius-xs);
    }
    .sidebar-recent-hide:hover { color: var(--text-primary); background: var(--bg-hover); }
    .sidebar-recent-show {
      display: flex; align-items: center; gap: 6px;
      width: calc(100% - 16px); margin: 6px 8px 8px;
      background: none; border: 1px dashed var(--border); border-radius: var(--radius-xs);
      color: var(--text-tertiary); font-size: .75rem;
      padding: 6px 10px; cursor: pointer; transition: all var(--dur);
      font-family: var(--font-body);
    }
    .sidebar-recent-show:hover { color: var(--accent); border-color: var(--accent); }
    .sidebar-recent-show svg { width: 11px; height: 11px; flex-shrink: 0; }

    /* ── ARTICLE ACTIONS BAR ─── */
    .article-actions {
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }

    /* ── GLOSSARY ─── */
    .glossary-term {
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .glossary-term:last-child { border-bottom: none; }
    .glossary-term dt {
      font-weight: 600; font-size: .9375rem; color: var(--text-primary);
      margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
    }
    .glossary-term dt code {
      font-family: var(--font-mono); font-size: .75rem; background: var(--bg-secondary);
      padding: 1px 6px; border-radius: var(--radius-xs); color: var(--accent);
      border: 1px solid var(--border); font-weight: 400;
    }
    .glossary-term dd { color: var(--text-secondary); line-height: 1.65; font-size: .875rem; }

    .content-inner dl { margin: 16px 0; }
    .content-inner dt { font-weight: 600; font-size: .9375rem; color: var(--text-primary); margin-top: 14px; }
    .content-inner dt:first-child { margin-top: 0; }
    .content-inner dd { color: var(--text-secondary); line-height: 1.6; font-size: .875rem; margin: 2px 0 0 0; padding-left: 0; }

    /* ── SHARE BUTTON ─── */
    .share-btn {
      background: none; border: 1px solid var(--border-strong);
      color: var(--text-tertiary); padding: 4px 10px;
      border-radius: var(--radius-sm); font-size: .75rem;
      cursor: pointer; transition: all var(--dur);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .share-btn:hover { color: var(--accent); border-color: var(--accent); }
    .share-btn svg { width: 12px; height: 12px; }

    /* ── OFFLINE BANNER ─── */
    .offline-banner {
      display: none; position: fixed; top: var(--header-h); left: 0; right: 0;
      background: var(--warning-soft); border-bottom: 1px solid rgba(253,126,20,.3);
      color: var(--warning); text-align: center; padding: 6px;
      font-size: .8125rem; font-weight: 500; z-index: 99;
    }
    .offline-banner.show { display: block; }

    /* ── PULSE HINT ─── */
    /* ── TROUBLESHOOT WIZARD ─── */
    .wizard-step { animation: fadeUp .18s var(--ease); }
    .wizard-question {
      font-size: 1.0625rem; font-weight: 600; color: var(--text-primary);
      margin-bottom: 16px; line-height: 1.4;
    }
    .wizard-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .wizard-option {
      padding: 12px 16px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      cursor: pointer; transition: all var(--dur); font-size: .875rem;
      color: var(--text-secondary); display: flex; align-items: center; gap: 10px;
      touch-action: manipulation;
    }
    @media (max-width: 768px) {
      .wizard-option { min-height: 44px; }
    }
    .wizard-option:hover { border-color: var(--accent); color: var(--text-primary); background: var(--accent-soft); }
    .wizard-option svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
    .wizard-restart {
      font-size: .8125rem; color: var(--text-tertiary); cursor: pointer;
      background: none; border: none; padding: 8px 10px; margin-top: 8px;
      transition: color var(--dur); display: inline-flex; align-items: center;
    }
    @media (max-width: 768px) { .wizard-restart { min-height: 44px; min-width: 44px; } }
    .wizard-restart:hover { color: var(--accent); }
    .wizard-result {
      padding: 16px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .wizard-result p { margin-bottom: 8px; }

    /* ── ERROR LOOKUP ─── */
    .error-lookup { margin-bottom: 24px; }
    .error-input {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary);
      font-family: var(--font-mono); font-size: .8125rem;
      outline: none; transition: border-color var(--dur); margin-bottom: 10px;
    }
    .error-input:focus { border-color: var(--accent); }
    .error-input::placeholder { color: var(--text-tertiary); font-family: var(--font-body); }
    .error-results { display: flex; flex-direction: column; gap: 8px; }
    .error-match {
      padding: 10px 14px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      cursor: pointer; transition: all var(--dur); font-size: .8125rem;
      touch-action: manipulation;
    }
    @media (max-width: 768px) {
      .error-match { min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
    }
    .error-match:hover { border-color: var(--accent); background: var(--accent-soft); }
    .error-match-title { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .error-match-hint { color: var(--text-secondary); font-size: .75rem; }

    /* ── GLOSSARY TOOLTIP ─── */
    .term-tooltip {
      border-bottom: 1px dotted var(--accent); cursor: help;
      position: relative; color: var(--accent);
    }
    .term-tooltip-popup {
      display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%); width: 260px; padding: 10px 12px;
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
      font-size: .8125rem; color: var(--text-secondary); line-height: 1.5;
      z-index: 200; pointer-events: none;
    }
    .term-tooltip:hover .term-tooltip-popup,
    .term-tooltip:focus .term-tooltip-popup { display: block; }
    .term-tooltip-popup::after {
      content: ''; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%); border: 6px solid transparent;
      border-top-color: var(--border-strong);
    }

    /* ── CONTACT FORM ─── */
    .contact-form { margin-top: 16px; }
    .contact-field {
      width: 100%; padding: 8px 12px; margin-bottom: 8px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary);
      font-family: var(--font-body); font-size: .8125rem; outline: none;
      transition: border-color var(--dur); resize: vertical;
    }
    .contact-field:focus { border-color: var(--accent); }
    .contact-field::placeholder { color: var(--text-tertiary); }
    .contact-submit {
      padding: 8px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm); cursor: pointer;
      font-size: .8125rem; font-weight: 500; transition: background var(--dur);
    }
    .contact-submit:hover { background: var(--accent-hover); }

    /* ── SPEED CALCULATOR ─── */
    .calc-wrap { margin-bottom: 24px; }
    .calc-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .calc-label { font-size: .8125rem; color: var(--text-secondary); min-width: 80px; }
    .calc-input {
      width: 120px; padding: 7px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary);
      font-family: var(--font-body); font-size: .875rem; outline: none;
      transition: border-color var(--dur);
    }
    .calc-input:focus { border-color: var(--accent); }
    .calc-unit { font-size: .8125rem; color: var(--text-tertiary); }
    .calc-result {
      padding: 14px 16px; background: var(--accent-soft);
      border: 1px solid var(--accent-border); border-radius: var(--radius-sm);
      font-size: .9375rem; font-weight: 600; color: var(--text-primary);
      display: none;
    }
    .calc-result.show { display: block; }

    /* ── COMPARISON TABLE ─── */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    @media (max-width: 520px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-card {
      padding: 18px; background: var(--bg-elevated);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
    }
    .compare-card h3 { font-size: 1rem; margin-bottom: 8px; color: var(--text-primary); }
    .compare-card p { font-size: .8125rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 8px; }
    .compare-card ul { padding-left: 18px; margin: 0; }
    .compare-card li { font-size: .8125rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 4px; }
    .compare-label {
      display: inline-block; font-size: .6875rem; font-weight: 600;
      padding: 2px 8px; border-radius: 9999px; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .compare-label.private { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
    .compare-label.shared { background: var(--success-soft); color: var(--success); border: 1px solid rgba(64,192,87,.28); }

    /* ── PREFLIGHT CHECKLIST ─── */
    .preflight { margin-bottom: 24px; }
    .preflight-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 6px; font-size: .875rem; color: var(--text-secondary);
      cursor: pointer; transition: all var(--dur); user-select: none;
    }
    .preflight-item:hover { border-color: var(--accent); background: var(--bg-hover); }
    .preflight-item.checked { color: var(--text-tertiary); }
    .preflight-item.checked .pf-text { text-decoration: line-through; }
    .preflight-box {
      width: 18px; height: 18px; border-radius: 4px;
      border: 2px solid var(--border-strong); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--dur);
    }
    .preflight-item.checked .preflight-box {
      background: var(--success); border-color: var(--success); color: #fff;
    }
    .preflight-item.checked .preflight-box svg { width: 10px; height: 10px; }
    .preflight-status {
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: .875rem; font-weight: 500; margin-top: 8px; display: none;
    }
    .preflight-status.ready { display: block; background: var(--success-soft); color: var(--success); border: 1px solid rgba(64,192,87,.28); }

    /* ── BROWSER CHECK ─── */
    .browser-result {
      padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: .875rem; margin-bottom: 20px; display: flex;
      align-items: center; gap: 10px;
    }
    .browser-result svg { width: 18px; height: 18px; flex-shrink: 0; }
    .browser-result.good { background: var(--success-soft); color: var(--success); border: 1px solid rgba(64,192,87,.28); }
    .browser-result.warn { background: var(--warning-soft); color: var(--warning); border: 1px solid rgba(253,126,20,.28); }

    /* ── SHORTCUT CARD ─── */
    .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    @media (max-width: 520px) { .shortcut-grid { grid-template-columns: 1fr; } }
    .shortcut-card {
      padding: 10px 14px; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      display: flex; justify-content: space-between; align-items: center;
      font-size: .8125rem;
    }
    .shortcut-card span { color: var(--text-secondary); }
    .shortcut-card kbd {
      font-family: var(--font-mono); font-size: .75rem; color: var(--text-tertiary);
      border: 1px solid var(--border-strong); border-radius: 4px;
      padding: 2px 7px; background: var(--bg-tertiary);
    }

    /* ── WIZARD ESCALATION ─── */
    .wizard-feedback { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .8125rem; color: var(--text-tertiary); }
    .wizard-fb-btn {
      padding: 4px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--bg-elevated);
      color: var(--text-secondary); font-size: .8125rem; cursor: pointer; transition: all var(--dur);
    }
    .wizard-fb-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .wizard-fb-btn.selected { border-color: var(--success); color: var(--success); background: var(--success-soft); pointer-events: none; }
    .wizard-escalate {
      margin-top: 10px; padding: 12px 14px; background: var(--warning-soft);
      border: 1px solid rgba(253,126,20,.28); border-radius: var(--radius-sm);
      font-size: .8125rem; color: var(--text-secondary); display: none;
    }
    .wizard-escalate.show { display: block; }
    .wizard-escalate a { color: var(--accent); font-weight: 500; }

    /* ── WHATS NEW BADGE ─── */
    .new-badge {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); margin-left: 6px; vertical-align: middle;
      animation: pulse-ring 2s ease-out infinite;
    }

    /* ── PRINT BUTTON ─── */
    .print-btn {
      background: none; border: 1px solid var(--border-strong);
      color: var(--text-tertiary); padding: 4px 10px;
      border-radius: var(--radius-sm); font-size: .75rem;
      cursor: pointer; transition: all var(--dur);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .print-btn:hover { color: var(--accent); border-color: var(--accent); }
    .print-btn svg { width: 12px; height: 12px; }
    @media print { .print-btn { display: none !important; } }

    /* ── STEP TIPS ─── */
    .step-tips { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .step-tip {
      display: flex; gap: 14px; padding: 16px;
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius); transition: all var(--dur);
    }
    .step-tip:hover { border-color: var(--accent-border); }
    .step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff; font-weight: 700;
      font-size: .875rem; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .step-body { flex: 1; }
    .step-body h4 { font-size: .9375rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .step-body p { font-size: .8125rem; color: var(--text-secondary); line-height: 1.55; margin: 0; }

    /* ── TIMELINE ─── */
    .timeline { position: relative; padding-left: 28px; margin-bottom: 28px; }
    .timeline::before {
      content: ''; position: absolute; left: 11px; top: 0; bottom: 0;
      width: 2px; background: var(--border-strong);
    }
    .timeline-item { position: relative; margin-bottom: 24px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-dot {
      position: absolute; left: -28px; top: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--bg-elevated); border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }
    .timeline-dot svg { width: 10px; height: 10px; color: var(--accent); }
    .timeline-week {
      font-size: .6875rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--accent); margin-bottom: 4px;
    }
    .timeline-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .timeline-body { font-size: .8125rem; color: var(--text-secondary); line-height: 1.6; }
    .timeline-body ul { padding-left: 18px; margin: 6px 0 0; }
    .timeline-body li { margin-bottom: 3px; }
    .timeline-body a { color: var(--accent); font-weight: 500; cursor: pointer; }

    /* ── RELEASE NOTES ─── */
    .release-entry {
      padding: 20px 0; border-bottom: 1px solid var(--border);
    }
    .release-entry:last-child { border-bottom: none; }
    .release-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .release-version {
      font-size: 1.125rem; font-weight: 700; color: var(--text-primary);
      letter-spacing: -.02em;
    }
    .release-date {
      font-size: .75rem; color: var(--text-tertiary); font-weight: 400;
    }
    .release-status {
      display: inline-flex; font-size: .6875rem; font-weight: 600;
      padding: 2px 8px; border-radius: 9999px;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .release-status.shipped { background: var(--success-soft); color: var(--success); border: 1px solid rgba(64,192,87,.28); }
    .release-status.in-progress { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
    .release-status.planned { background: var(--bg-tertiary); color: var(--text-tertiary); border: 1px solid var(--border-strong); }
    .release-items { display: flex; flex-direction: column; gap: 8px; }
    .release-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: .875rem; color: var(--text-secondary); line-height: 1.6;
    }
    .release-badge {
      display: inline-flex; font-size: .625rem; font-weight: 600;
      padding: 1px 6px; border-radius: 3px; flex-shrink: 0; margin-top: 3px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .release-badge.new { background: var(--success-soft); color: var(--success); }
    .release-badge.improved { background: var(--accent-soft); color: var(--accent); }
    .release-badge.fixed { background: var(--warning-soft); color: var(--warning); }
    .release-filter {
      display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
      scroll-margin-top: calc(var(--header-h) + 16px);
    }
    .release-filter-btn {
      padding: 6px 14px; border-radius: 9999px; font-size: .75rem; font-weight: 500;
      border: 1px solid var(--border-strong); background: var(--bg-elevated);
      color: var(--text-secondary); cursor: pointer; transition: all var(--dur);
    }
    .release-filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .release-filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    /* ── FEATURE REQUEST FORM ─── */
    .feature-form { max-width: 560px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .8125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .form-group .optional { font-weight: 400; color: var(--text-tertiary); }
    .form-group .required { color: var(--danger, #e55); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-primary); font-size: .875rem; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(33,132,243,.1); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group select { appearance: auto; }
    .form-submit {
      padding: 10px 24px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      font-size: .875rem; font-weight: 600; cursor: pointer; transition: background var(--dur) var(--ease);
    }
    .form-submit:hover { background: var(--accent-hover); }
    .form-submit:disabled { opacity: .5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 32px 0; }
    .form-success .success-icon { width: 48px; height: 48px; color: var(--success); margin: 0 auto 12px; }
    .form-success .success-icon svg { width: 100%; height: 100%; }
    .form-success h2 { margin: 0 0 8px; color: var(--text-primary); font-size: 1rem; font-weight: 600; }
    .form-success p { color: var(--text-secondary); margin: 0 0 16px; }

    /* ── ARTICLE FEEDBACK ─── */
    .article-feedback {
      margin: 32px 0 16px; padding: 16px 20px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .article-feedback-prompt { font-size: .8125rem; color: var(--text-secondary); margin: 0 0 10px; font-weight: 500; }
    .article-feedback-buttons { display: flex; gap: 8px; }
    .article-feedback-btn {
      padding: 6px 14px; background: transparent; color: var(--text-primary);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font-size: .8125rem; cursor: pointer; transition: background var(--dur), border-color var(--dur);
      font-family: inherit;
    }
    .article-feedback-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .article-feedback-form { margin-top: 12px; }
    .article-feedback-form textarea {
      width: 100%; padding: 8px 12px; margin-bottom: 8px;
      background: var(--bg); color: var(--text-primary); font-family: inherit; font-size: .8125rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm); resize: vertical; min-height: 60px;
    }
    .article-feedback-form textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(33,132,243,.1); }
    .article-feedback-submit {
      padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
      font-size: .8125rem; font-weight: 500; cursor: pointer; transition: background var(--dur);
    }
    .article-feedback-submit:hover { background: var(--accent-hover); }
    .article-feedback-thanks { font-size: .8125rem; color: var(--text-secondary); }
    @media print { .article-feedback { display: none !important; } }
    .form-another { padding: 8px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); cursor: pointer; font-size: .8125rem; }
    .form-another:hover { border-color: var(--accent); color: var(--accent); }
    /* ── WELCOME BACK BAR ─── */
    .welcome-back {
      padding: 10px 16px; background: var(--accent-soft);
      border: 1px solid var(--accent-border); border-radius: var(--radius-sm);
      margin-bottom: 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; font-size: .8125rem;
      animation: fadeUp .2s var(--ease);
    }
    .welcome-back a { color: var(--accent); font-weight: 500; cursor: pointer; }
    .welcome-back-close {
      background: none; border: none; color: var(--text-tertiary);
      cursor: pointer; padding: 2px; display: flex; flex-shrink: 0;
    }
    .welcome-back-close svg { width: 12px; height: 12px; }

    /* ── SEARCH HISTORY ─── */
    .search-history { padding: 8px 0; }
    .search-history-title { padding: 6px 14px; font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); }
    .search-history-item {
      padding: 8px 14px; cursor: pointer; font-size: .8125rem;
      color: var(--text-secondary); display: flex; align-items: center; gap: 8px;
      transition: background var(--dur);
    }
    .search-history-item:hover { background: var(--bg-hover); }
    .search-history-item svg { width: 12px; height: 12px; color: var(--text-tertiary); flex-shrink: 0; }

    /* ── COPY ARTICLE ─── */
    .copy-article-btn {
      background: none; border: 1px solid var(--border-strong);
      color: var(--text-tertiary); padding: 4px 10px;
      border-radius: var(--radius-sm); font-size: .75rem;
      cursor: pointer; transition: all var(--dur);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .copy-article-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-article-btn svg { width: 12px; height: 12px; }
    @media print { .copy-article-btn { display: none !important; } }

    /* ── LAST UPDATED ─── */
    .last-updated { font-size: .75rem; color: var(--text-tertiary); margin-top: 6px; }

    /* ── HIGHLIGHT ─── */
    .user-highlight {
      background: rgba(253,126,20,.18); border-radius: 2px;
      padding: 0 1px; cursor: pointer; position: relative;
    }
    .user-highlight:hover { background: rgba(253,126,20,.30); }
    .highlight-tooltip {
      display: none; position: absolute; bottom: calc(100% + 6px); left: 0;
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius-xs); padding: 4px 6px;
      font-size: .75rem; color: var(--text-secondary);
      box-shadow: var(--shadow); white-space: nowrap; z-index: 50;
      cursor: pointer; transition: color var(--dur), border-color var(--dur);
    }
    .highlight-tooltip:hover { color: var(--danger); border-color: var(--danger); }
    .user-highlight:hover .highlight-tooltip { display: flex; align-items: center; gap: 4px; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(33,132,243,.4); }
      70% { box-shadow: 0 0 0 8px rgba(33,132,243,0); }
      100% { box-shadow: 0 0 0 0 rgba(33,132,243,0); }
    }
    .pulse-hint { animation: pulse-ring 2s ease-out 3; }

    /* ── FAQ ACCORDION ─── */
    .faq-item { border-bottom: 1px solid var(--border); }
    .faq-question {
      padding: 14px 0; font-size: .9375rem; font-weight: 600; color: var(--text-primary);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      user-select: none; transition: color var(--dur);
      background: none; border: none; width: 100%; text-align: left;
      font-family: var(--font-body); touch-action: manipulation;
    }
    @media (max-width: 768px) {
      .faq-question { min-height: 44px; }
    }
    .faq-question:hover { color: var(--accent); }
    .faq-chevron {
      font-size: .625rem; color: var(--text-tertiary); transition: transform .18s var(--ease);
      flex-shrink: 0; margin-left: 12px;
    }
    .faq-item.open .faq-chevron { transform: rotate(180deg); }
    .faq-answer {
      max-height: 0; overflow: hidden; transition: max-height .25s var(--ease), padding-bottom .25s var(--ease);
      padding: 0;
    }
    .faq-item.open .faq-answer { max-height: 500px; padding-bottom: 16px; }
    .faq-answer p, .faq-answer ul, .faq-answer li { color: var(--text-secondary); }
    .faq-answer p { margin-bottom: 8px; line-height: 1.65; }

    /* ── MOBILE BOTTOM NAV ─── */
    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      height: 52px; background: var(--bg-glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-top: 1px solid var(--border);
      z-index: 80; justify-content: space-around; align-items: center;
    }
    .mobile-nav-btn {
      background: none; border: none; color: var(--text-tertiary);
      font-size: 10px; display: flex; flex-direction: column;
      align-items: center; gap: 2px; cursor: pointer;
      padding: 8px 14px; min-width: 44px; min-height: 44px;
      transition: color var(--dur); text-decoration: none;
      justify-content: center;
    }
    .mobile-nav-btn:hover, .mobile-nav-btn:active { color: var(--accent); }
    .mobile-nav-btn svg { width: 20px; height: 20px; }
    @media (max-width: 768px) {
      .mobile-nav { display: flex; }
      .content-with-toc { padding-bottom: 100px !important; }
      #back-top { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
      #toast { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
    }

    /* ── SITE FOOTER ─── */
    .site-footer { background: var(--bg-elevated); border-top: 1px solid var(--border); padding: 20px 24px; margin-top: auto; }
    .footer-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-size: .75rem; color: var(--text-secondary); }
    .footer-links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: var(--text-secondary); text-decoration: none; cursor: pointer; transition: color var(--dur) var(--ease); }
    .footer-links a:hover { color: var(--accent); }
  </style>
</head>

<h1>Inviting your team</h1>
<p>Admins invite coaches and students; coaches invite students. Invitees get an email with a temporary password. Manage invites in <a href="https://app.kaynos.net" target="_blank" rel="noopener">app.kaynos.net</a> under <strong>Admin</strong> or <strong>Students</strong>.</p>
<div class="hint hint-info"><div class="hint-icon">${IC.info}</div><div>Role capabilities are summarized on <a href="#roles" onclick="navigate('roles');return false">Understanding user roles</a>.</div></div>
<h2>Send an invite</h2>
<ol>
<li>Go to <strong>Admin</strong> (full roster control) or <strong>Students</strong> (coaches adding a student).</li>
<li>Click <strong>Add Member</strong> / <strong>Add Student</strong>.</li>
<li>Enter name, email, and role (admins can also set coach vs student).</li>
<li>Choose how to deliver the invite:
  <ul>
    <li><strong>Email invite</strong> — Kaynos generates a temporary password and emails it to the new member.</li>
    <li><strong>Generate link</strong> — Kaynos creates a single-use setup link that expires after 7 days. No password is sent; the new member sets their own when they open the link. Use this to hand off the link directly (in person, in chat) instead of relying on email.</li>
  </ul>
</li>
<li>Click <strong>Send Invite</strong> (or <strong>Generate link</strong>).</li>
</ol>
<p>Email delivery is typically quick. If nothing arrives, check spam and verify the address for typos.</p>
<div class="hint hint-warning"><div class="hint-icon">${IC.warn}</div><div>Still missing mail? See <a href="#email-issues" onclick="navigate('email-issues');return false">Email and notification issues</a> or contact ${mailLink()}.</div></div>
<h2>Bulk invites (CSV)</h2>
<p>Admins can invite up to <strong>500 members at once</strong> by uploading a CSV from the Admin area. Bulk invites use link mode — each row gets a single-use setup link rather than an emailed temporary password. A dry-run validates the file (duplicates, bad addresses) before anything is created. Admin accounts can't be bulk-created; add those one at a time.</p>
<h2>Parent &amp; guardian accounts</h2>
<p>Admins and coaches can invite a <strong>parent or guardian</strong> from a student's profile. The parent gets an email with an accept link (valid <strong>14 days</strong>), sets their own name and password, and can then see that student's <strong>published</strong> sessions. One parent email can be linked to multiple students under a single login. Whether parents can comment on notes is a per-school setting — off by default. Staff can revoke a parent link at any time.</p>
<h2>Who can invite</h2>
<table><thead><tr><th scope="col">Your role</th><th scope="col">Can add</th></tr></thead><tbody>
<tr><td><strong>Admin</strong></td><td>Coaches, students, and parents</td></tr>
<tr><td><strong>Coach</strong></td><td>Students and parents</td></tr>
<tr><td><strong>Student</strong></td><td>Nobody</td></tr>
<tr><td><strong>Parent</strong></td><td>Nobody</td></tr>
</tbody></table>
<h2>What each role can do</h2>
<table><thead><tr><th scope="col">Role</th><th scope="col">What they can do</th></tr></thead><tbody>
<tr><td><strong>Admin</strong></td><td>Everything a coach can do, plus roster management, invites, and settings.</td></tr>
<tr><td><strong>Coach</strong></td><td>Sessions, classes, video upload, notes, and student progress.</td></tr>
<tr><td><strong>Student</strong></td><td>Their assigned private sessions, all published classes, notes, progress tracking. Can upload to their own review requests; cannot view other students' private sessions.</td></tr>
<tr><td><strong>Parent</strong></td><td>View published sessions of their linked student(s). Commenting only if the school enables it.</td></tr>
</tbody></table>
<h2>Resend or reset</h2>
<p><strong>Admin</strong> → find them in the roster → <strong>Reset Password</strong>. Kaynos emails a fresh temporary password.</p>
<h2>Tips</h2>
<ul>
<li>Onboard coaches before adding a large student wave when possible.</li>
<li>Use an email address people check — it becomes their login.</li>
<li>No fixed seat limit.</li>
</ul>`},

    roles: {
      title: "Understanding user roles", section: "Getting Started",
      content: `
<h1>Understanding user roles</h1>
<div class="tldr"><strong>TLDR:</strong> Three core roles — <strong>admin</strong> manages members and settings, <strong>coach</strong> uploads video and writes notes, <strong>student</strong> watches and replies — plus an optional <strong>parent</strong> role for viewing a linked student's published sessions.</div>
<p>Each person has one role. Assign them so permissions match how your team runs.</p>
<h2>Admin</h2>
<p>Typically the school owner or head coach. Full access: everything a coach can do, plus member management, invites, role changes, account settings, and the <strong>Admin</strong> panel for account-wide visibility.</p>
<h2>Coach</h2>
<p>Coaches create sessions and classes, upload video, add notes and annotations, manage their own content, view student progress, and invite students and parents. They can't manage the roster or access admin settings.</p>
<h2>Student</h2>
<p>Students watch sessions and classes shared with them, take notes, reply, request video review from coaches, and track their own progress. They can't create sessions or classes, and can't view other students' private sessions. The one place a student can upload video is to their own review request.</p>
<h2>Parent</h2>
<p>An optional guardian role, linked to one or more students by invite (see <a href="#inviting-members" onclick="navigate('inviting-members');return false">Inviting your team</a>). Parents see their linked students' <strong>published</strong> sessions. Commenting on notes is off by default and controlled by a per-school setting.</p>
<h2>Change a role</h2>
<p>Admins only: <strong>Admin</strong> → select the member → role dropdown → save. Admin accounts themselves can't be modified or removed from the roster screen, and parent access is managed via the link on the student's profile rather than the role dropdown.</p>
<div class="hint hint-warning"><div class="hint-icon">${IC.warn}</div><div>Downgrading a coach to student removes the ability to create sessions or upload video. Existing content stays available. For invite rules, see <a href="#inviting-members" onclick="navigate('inviting-members');return false">Inviting your team</a>.</div></div>`},
